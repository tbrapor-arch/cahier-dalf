const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};
let state = { tab: store.get("tab","structures"), level: store.get("level","all"), known: store.get("known",{}), card:0, flipped:false, rate:0.9, heard:false, checked:false, answers:{}, pe:"synthese", themeS:"all", vhome:true, lang: store.get("lang","fr"), follow: store.get("follow",true), smode:"fiches", scompact: store.get("scompact",false), squiz:null, qlen:10, themeV:"all", vmode:"cartes", onlyReview:false, playing:null, drafts: store.get("drafts",{}) };
const view = document.getElementById("view");
const byLevel = arr => arr.filter(x => state.level==="all" || x.level===state.level);
const exChip = '<span class="chip ex">exemple</span>';

/* ---------- Vues ---------- */
const themesOf = arr => [...new Set(byLevel(arr).map(x=>x.theme))];
function themeSelect(id, arr, current){
  return `<label class="filter" for="${id}"><span class="eyebrow">Thème</span>
    <select id="${id}"><option value="all">Tous les thèmes</option>${themesOf(arr).map(t=>`<option ${t===current?"selected":""}>${t}</option>`).join("")}</select></label>`;
}
const byTheme = (arr, t) => byLevel(arr).filter(x => t==="all" || x.theme===t);

function renderStructures(){
  const ESS = state.themeS==="ess";
  if(!ESS && state.themeS!=="all" && !themesOf(DATA.structures).includes(state.themeS)) state.themeS="all";
  const items = ESS ? byLevel(DATA.structures).filter(s=>s.ess) : byTheme(DATA.structures, state.themeS);
  const nEss = byLevel(DATA.structures).filter(s=>s.ess).length;
  const sel = `<label class="filter" for="theme-s"><span class="eyebrow">Thème</span>
    <select id="theme-s"><option value="all">Tous les thèmes</option><option value="ess" ${ESS?"selected":""}>★ Essentielles (${nEss})</option>${themesOf(DATA.structures).map(t=>`<option ${t===state.themeS?"selected":""}>${t}</option>`).join("")}</select></label>`;
  const modes = `<div class="row" role="group" aria-label="Affichage">${[["fiches","Fiches"],["quiz","Quiz"]].map(([k,l])=>`<button class="btn" data-smode="${k}" style="padding:6px 12px;${state.smode===k?'border-color:var(--encre);color:var(--encre)':''}">${l}</button>`).join("")}</div>`;
  const compactBtn = state.smode==="fiches" ? `<button class="btn" id="s-compact" aria-pressed="${state.scompact}" style="padding:6px 12px;${state.scompact?'border-color:var(--encre);color:var(--encre)':''}">${state.scompact?"Vue compacte ✓":"Vue compacte"}</button>` : "";
  const head = `<h2>Structures clés</h2><p class="sub">${items.length} tournures${ESS?" essentielles, à savoir placer à l'écrit et à l'oral":" C1·C2, classées par fonction. ★ = à maîtriser en priorité"}.</p>
  <div class="row" style="margin-bottom:12px;align-items:flex-end">${sel}${modes}${compactBtn}
    <div class="row" role="group" aria-label="Langue des explications" style="gap:0">${[["fr","FR"],["en","EN"]].map(([k,l],n)=>`<button class="btn" data-lang="${k}" aria-pressed="${state.lang===k}" style="padding:6px 10px;${n?'border-radius:0 8px 8px 0;margin-left:-1px':'border-radius:8px 0 0 8px'};${state.lang===k?'background:var(--encre);border-color:var(--encre);color:var(--sheet)':''}">${l}</button>`).join("")}</div></div>`;
  const bind = () => {
    document.getElementById("theme-s").onchange=e=>{ state.themeS=e.target.value; state.squiz=null; renderStructures(); };
    view.querySelectorAll("[data-smode]").forEach(b=>b.onclick=()=>{ state.smode=b.dataset.smode; renderStructures(); });
    view.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ state.lang=b.dataset.lang; store.set("lang",state.lang); renderStructures(); });
    const c=document.getElementById("s-compact"); if(c) c.onclick=()=>{ state.scompact=!state.scompact; store.set("scompact",state.scompact); renderStructures(); };
  };
  if(state.smode==="quiz"){ renderSQuiz(head, items, bind); return; }
  if(state.scompact){
    let last=null;
    view.innerHTML = head + `<div class="clist">${items.map(s=>{
      const grp = (state.themeS==="all"||state.themeS==="ess") && s.theme!==last ? `<p class="eyebrow cgroup">${(last=s.theme)}</p>` : "";
      return grp+`<details class="crow">
        <summary>${lvlBtn(s)}<span class="cname">${s.name}</span>${s.ess?'<span class="star" title="Essentielle">★</span>':""}</summary>
        <div class="cbody"><div class="pattern">${s.pattern}</div><p class="example">${s.example}</p><p class="note" lang="${state.lang}">${tNote(s)}</p>${morePanel(s)}</div>
      </details>`; }).join("") || '<p class="empty">Aucune fiche pour ce niveau.</p>'}</div>`;
    bind(); bindMore(); return;
  }
  view.innerHTML = head + `<div class="stack">${items.map(s=>`
    <article class="sheet">
      <div class="meta">${lvlBtn(s)}<span class="eyebrow">${s.theme}</span>${s.ess?'<span class="star" title="Essentielle">★</span>':""}</div>
      <h3 style="margin:2px 0;font:400 1.15rem var(--f-display)">${s.name}</h3>
      <div class="pattern">${s.pattern}</div>
      <p class="example">${s.example}</p>
      <p class="note" lang="${state.lang}">${tNote(s)}</p>
      ${morePanel(s)}
    </article>`).join("") || '<p class="empty">Aucune fiche pour ce niveau.</p>'}</div>`;
  bind(); bindMore();
}
const lvlBtn = s => s.more ? `<button class="chip chip-btn" data-more="${s._i}" aria-expanded="false" aria-label="Niveau ${s.level} : voir deux autres exemples et une explication">${s.level} <span aria-hidden="true">＋</span></button>` : `<span class="chip">${s.level}</span>`;
const morePanel = s => s.more ? `<button class="more-link" data-more="${s._i}" aria-expanded="false">＋ 2 exemples et une explication</button>
  <div class="more" id="more-${s._i}" hidden>
    <p class="eyebrow" style="margin:0 0 6px">Autres exemples</p>
    <ul class="more-ex">${s.more.map(e=>`<li class="example">${e}</li>`).join("")}</ul>
    <p class="eyebrow" style="margin:10px 0 4px">${state.lang==="en"?"Explanation":"Explication"}</p>
    <p style="margin:0" lang="${state.lang}">${tExpl(s)}</p>
  </div>` : "";
function bindMore(){
  view.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",e=>{
    e.preventDefault(); e.stopPropagation();
    const i=b.dataset.more, panel=document.getElementById("more-"+i); if(!panel) return;
    const det=panel.closest("details"); if(det && !det.open){ det.open=true; panel.hidden=false; }
    else panel.hidden=!panel.hidden;
    view.querySelectorAll(`[data-more="${i}"]`).forEach(x=>{ x.setAttribute("aria-expanded", String(!panel.hidden)); if(x.classList.contains("more-link")) x.textContent = panel.hidden ? "＋ 2 exemples et une explication" : "－ Masquer"; });
  }));
}

/* Quiz des structures : retrouver la tournure manquante */
const firstBold = s => { const m=s.example.match(/<b>(.*?)<\/b>/); return m ? m[1].trim() : null; };
function renderSQuiz(head, pool, bind){
  pool = pool.filter(firstBold);
  if(pool.length<4){ view.innerHTML = head+'<p class="empty">Pas assez de fiches dans ce thème pour un quiz. Choisissez « Tous les thèmes » ou « Essentielles ».</p>'; bind(); return; }
  const key = state.level+"|"+state.themeS;
  if(!state.squiz || state.squiz.key!==key){
    const qs = shuffle(pool).slice(0,10).map(s=>{
      const ans = firstBold(s);
      const others = shuffle(byLevel(DATA.structures).filter(o=>o!==s && firstBold(o) && firstBold(o).toLowerCase()!==ans.toLowerCase())).slice(0,3).map(firstBold);
      const prompt = s.example.replace(/<b>.*?<\/b>/, "<span class='gap'>……</span>").replace(/<\/?b>/g,"");
      return { s, prompt, opts: shuffle([{t:ans,ok:true},...others.map(t=>({t,ok:false}))]) };
    });
    state.squiz = { key, qs, i:0, score:0, picked:null, missed:[] };
  }
  const Q = state.squiz;
  if(Q.i>=Q.qs.length){
    view.innerHTML = head + `<div class="sheet"><div class="eyebrow">Résultat</div>
      <div class="word" style="font-variant-numeric:tabular-nums">${Q.score} / ${Q.qs.length}</div>
      ${Q.missed.length?`<p class="note" style="margin:4px 0 6px">À retravailler :</p><ul style="padding-left:18px;margin:0 0 12px">${Q.missed.map(s=>`<li><b>${s.name}</b> · <span class="note">${s.pattern}</span></li>`).join("")}</ul>`:'<p class="note">Sans faute.</p>'}
      <button class="btn primary" id="sq-new">Nouveau quiz</button></div>`;
    bind(); document.getElementById("sq-new").onclick=()=>{ state.squiz=null; renderStructures(); }; return;
  }
  const q = Q.qs[Q.i], done = Q.picked!==null;
  view.innerHTML = head + `
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <span class="counter">Question ${Q.i+1} / ${Q.qs.length}</span><span class="counter" style="color:var(--ok)">${Q.score} bonne(s)</span></div>
  <div class="sheet">
    <div class="meta"><span class="chip">${q.s.level}</span><span class="eyebrow">Complétez avec la bonne tournure</span></div>
    <p class="qprompt">${q.prompt}</p>
    <div class="stack" style="gap:8px">${q.opts.map((o,j)=>`<button class="qopt ${done?(o.ok?"right":(Q.picked===j?"wrong":"")):""}" data-o="${j}" ${done?"disabled":""}>${o.t}</button>`).join("")}</div>
    ${done?`<p class="note" style="margin:12px 0 0"><b>${q.s.name}</b> · ${tNote(q.s)}</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="sq-next">${Q.i+1<Q.qs.length?"Suivant":"Voir le résultat"}</button></div>`:""}
  </div>`;
  bind();
  view.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.o; Q.picked=j; if(q.opts[j].ok) Q.score++; else Q.missed.push(q.s); renderStructures(); });
  const n=document.getElementById("sq-next"); if(n) n.onclick=()=>{ Q.i++; Q.picked=null; renderStructures(); };
}

function renderVocab(){
  if(state.themeV!=="all" && !themesOf(DATA.vocab).includes(state.themeV)) state.themeV="all";
  let items = byTheme(DATA.vocab, state.themeV);
  if(state.onlyReview) items = items.filter(x=>!state.known[x.word]);
  const all = byTheme(DATA.vocab, state.themeV), known = all.filter(x=>state.known[x.word]).length;
  if(state.vhome){
    const lv = byLevel(DATA.vocab), tile=(t,label,arr,cls="")=>{ const k=arr.filter(x=>state.known[x.word]).length;
      return `<button class="vtile ${cls}" data-vt="${t}"><b>${label}</b><span class="counter">${arr.length} mots · ${k} acquis</span><div class="progress"><i style="width:${arr.length?k/arr.length*100:0}%"></i></div></button>`; };
    view.innerHTML = `<h2>Vocabulaire</h2><p class="sub">${lv.length} mots et expressions. Choisissez un thème.</p>
    <div class="vgrid">${tile("all","Tous les thèmes",lv,"all")}${themesOf(DATA.vocab).map(t=>tile(t,t,lv.filter(x=>x.theme===t))).join("")}</div>`;
    view.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>{ state.themeV=b.dataset.vt; state.vhome=false; state.card=0; state.flipped=false; state.quiz=null; renderVocab(); window.scrollTo(0,0); });
    return;
  }
  const head = `<div class="row" style="margin-top:18px;align-items:center"><button class="btn" id="v-back" style="padding:6px 12px">← Thèmes</button></div>
  <h2 style="margin-top:12px">${state.themeV==="all"?"Tous les thèmes":state.themeV}</h2><p class="sub">${all.length} mots et expressions, avec registre, définition et exemple.</p>
  <div class="row" style="margin-bottom:12px;align-items:flex-end">
    <div class="row" role="group" aria-label="Affichage">
      ${[["cartes","Cartes"],["liste","Liste"],["quiz","Quiz"]].map(([k,l])=>`<button class="btn" data-mode="${k}" style="padding:6px 12px;${state.vmode===k?'border-color:var(--encre);color:var(--encre)':''}">${l}</button>`).join("")}
    </div>
  </div>
  <div class="row" style="margin-bottom:12px">
    <div class="progress" aria-label="Mots acquis"><i style="width:${all.length?known/all.length*100:0}%"></i></div>
    <span class="counter">${known} / ${all.length} acquis</span>
  </div>`;
  const bind = () => {
    document.getElementById("v-back").onclick=()=>{ state.vhome=true; renderVocab(); window.scrollTo(0,0); };
    view.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ state.vmode=b.dataset.mode; renderVocab(); });
  };

  if(state.vmode==="quiz"){ renderQuiz(head, all, bind); return; }
  if(state.vmode==="liste"){
    view.innerHTML = head + `<div class="stack">${all.map(v=>`
      <div class="sheet" style="padding-block:12px">
        <div class="meta"><span class="chip">${v.level}</span><span class="eyebrow">${v.reg}</span>${state.known[v.word]?'<span class="chip" style="background:var(--ok-soft);color:var(--ok)">acquis</span>':""}</div>
        <b style="font:400 1.1rem var(--f-display)">${v.word}</b>
        <p style="margin:2px 0">${v.def}</p><p class="example note" style="margin:0">« ${v.ex} »</p>
      </div>`).join("")}</div>`;
    bind(); return;
  }

  if(!items.length){
    view.innerHTML = head + `<p class="empty">Tous les mots de ce thème sont acquis. <button class="btn" id="v-resetk" style="margin-left:6px">Tout revoir</button></p>`;
    bind();
    document.getElementById("v-resetk").onclick=()=>{ all.forEach(x=>delete state.known[x.word]); store.set("known",state.known); renderVocab(); };
    return;
  }
  if(state.card>=items.length) state.card=0;
  const v = items[state.card];
  view.innerHTML = head + `
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <span class="counter">${state.card+1} / ${items.length}</span>
    <label class="note" style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="only-review" ${state.onlyReview?"checked":""}> Seulement les mots à revoir</label>
  </div>
  <div class="sheet card" id="flash" tabindex="0" role="button" aria-label="Retourner la carte">
    <div class="meta"><span class="chip">${v.level}</span><span class="eyebrow">${v.theme} · ${v.reg}</span></div>
    ${state.flipped
      ? `<div class="word" style="font-size:1.2rem">${v.word}</div><p style="margin:4px 0 8px">${v.def}</p><p class="example">« ${v.ex} »</p>`
      : `<div class="word">${v.word}</div><span class="hint">Touchez pour la définition</span>`}
  </div>
  <div class="row" style="margin-top:12px">
    <button class="btn" id="v-again">À revoir</button>
    <button class="btn good" id="v-known">Je savais</button>
    <button class="btn" id="v-shuffle" style="margin-left:auto">Mélanger</button>
  </div>`;
  bind();
  const flip=()=>{ state.flipped=!state.flipped; renderVocab(); };
  document.getElementById("flash").onclick=flip;
  document.getElementById("flash").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); } };
  document.getElementById("only-review").onchange=e=>{ state.onlyReview=e.target.checked; state.card=0; state.flipped=false; renderVocab(); };
  const next=(k)=>{ state.known[v.word]=k; store.set("known",state.known); state.flipped=false;
    if(!(k && state.onlyReview)) state.card=(state.card+1)%items.length; renderVocab(); };
  document.getElementById("v-again").onclick=()=>next(false);
  document.getElementById("v-known").onclick=()=>next(true);
  document.getElementById("v-shuffle").onclick=()=>{ DATA.vocab.sort(()=>Math.random()-.5); state.card=0; state.flipped=false; renderVocab(); };
}

/* ---------- Quiz ---------- */
const ART = /^(le |la |l'|les |un |une |des |se |s')/i;
const core = w => w.replace(ART,"");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function blank(v){
  const c=core(v.word); const i=v.ex.toLowerCase().indexOf(c.toLowerCase());
  return (i<0 || c.length<3) ? null : v.ex.slice(0,i)+"<span class='gap'>……</span>"+v.ex.slice(i+c.length);
}
function buildQuiz(pool){
  const picks = shuffle(pool).slice(0,state.qlen);
  return picks.map((v,n)=>{
    const others = shuffle((pool.length>=4?pool:byLevel(DATA.vocab)).filter(x=>x.word!==v.word && x.def!==v.def)).slice(0,3);
    const b = blank(v);
    const type = b && n%3!==2 ? (n%3===0?"trou":"def") : (n%3===2?"mot":"def");
    const opts = shuffle([v,...others]);
    if(type==="trou") return { v, type, prompt:b, label:"Complétez la phrase", opts:opts.map(o=>({t:core(o.word), ok:o===v})) };
    if(type==="mot") return { v, type, prompt:`<b class="qword">${v.word}</b>`, label:"Que signifie…", opts:opts.map(o=>({t:o.def, ok:o===v})) };
    return { v, type, prompt:v.def, label:"Quel mot correspond à cette définition ?", opts:opts.map(o=>({t:o.word, ok:o===v})) };
  });
}
function renderQuiz(head, pool, bind){
  if(pool.length<2){ view.innerHTML = head+'<p class="empty">Pas assez de mots dans ce thème pour un quiz.</p>'; bind(); return; }
  const key = state.level+"|"+state.themeV+"|"+state.qlen;
  if(!state.quiz || state.quiz.key!==key) state.quiz = { key, qs:buildQuiz(pool), i:0, score:0, picked:null, missed:[] };
  const Q = state.quiz;
  if(Q.i>=Q.qs.length){
    view.innerHTML = head + `<div class="sheet" style="text-align:left">
      <div class="eyebrow">Résultat</div>
      <div class="word" style="font-variant-numeric:tabular-nums">${Q.score} / ${Q.qs.length}</div>
      <p class="note" style="margin:4px 0 10px">${Q.score===Q.qs.length?"Sans faute.":Q.missed.length+" mot(s) ajouté(s) à « à revoir »."}</p>
      ${Q.missed.length?`<ul style="padding-left:18px;margin:0 0 12px">${Q.missed.map(v=>`<li><b>${v.word}</b> : ${v.def}</li>`).join("")}</ul>`:""}
      <button class="btn primary" id="qz-new">Nouveau quiz</button></div>`;
    bind(); document.getElementById("qz-new").onclick=()=>{ state.quiz=null; renderVocab(); }; return;
  }
  const q = Q.qs[Q.i], done = Q.picked!==null;
  view.innerHTML = head + `
  <div class="row" role="group" aria-label="Nombre de questions" style="margin-bottom:10px">
    <span class="eyebrow">Questions</span>
    ${[10,20,40].map(n=>`<button class="btn" data-qlen="${n}" style="padding:4px 10px;${state.qlen===n?'border-color:var(--encre);color:var(--encre)':''}">${n}</button>`).join("")}
  </div>
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <span class="counter">Question ${Q.i+1} / ${Q.qs.length}</span><span class="counter" style="color:var(--ok)">${Q.score} bonne(s)</span>
  </div>
  <div class="sheet">
    <div class="meta"><span class="chip">${q.v.level}</span><span class="eyebrow">${q.label}</span></div>
    <p class="qprompt">${q.prompt}</p>
    <div class="stack" style="gap:8px">${q.opts.map((o,j)=>{
      const cls = done ? (o.ok?"right":(Q.picked===j?"wrong":"")) : "";
      return `<button class="qopt ${cls}" data-o="${j}" ${done?"disabled":""}>${o.t}</button>`; }).join("")}</div>
    ${done?`<p class="example note" style="margin:12px 0 0">« ${q.v.ex} »</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="qz-next">${Q.i+1<Q.qs.length?"Suivant":"Voir le résultat"}</button></div>`:""}
  </div>`;
  bind();
  view.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.o; Q.picked=j;
    if(q.opts[j].ok) Q.score++; else { Q.missed.push(q.v); state.known[q.v.word]=false; store.set("known",state.known); }
    renderVocab(); });
  const n=document.getElementById("qz-next"); if(n) n.onclick=()=>{ Q.i++; Q.picked=null; renderVocab(); };
  view.querySelectorAll("[data-qlen]").forEach(b=>b.onclick=()=>{ state.qlen=+b.dataset.qlen; state.quiz=null; renderVocab(); });
}

  if(state.playing!==null) stopSync();
  const items = byLevel(DATA.ecoute);
  const canSpeak = "speechSynthesis" in window;
  view.innerHTML = `<h2>Écoute</h2><p class="sub">${items.length} textes originaux lus par la voix française de l'appareil. Écoutez, répondez, puis vérifiez.</p>
  <div class="row speed" role="group" aria-label="Vitesse de lecture" style="margin-bottom:12px">
    <span class="eyebrow">Vitesse</span>
    ${[0.8,0.9,1].map(r=>`<button class="btn" style="padding:6px 10px;${r===state.rate?'border-color:var(--encre);color:var(--encre)':''}" data-rate="${r}">×${r}</button>`).join("")}
  </div>
  <label class="note" style="display:flex;gap:8px;align-items:center;margin:0 0 14px"><input type="checkbox" id="follow" ${state.follow?"checked":""}> Texte synchronisé : la transcription s'affiche et suit la lecture mot à mot. Touchez un mot pour reprendre à partir de là.</label>
  ${canSpeak?"":'<p class="note">La lecture vocale n\'est pas disponible sur ce navigateur : lisez la transcription.</p>'}
  <div class="stack">${items.map((e,i)=>`
    <article class="sheet">
      <div class="meta"><span class="chip">${e.level}</span><span class="eyebrow">${e.theme} · ${e.type}</span></div>
      <div class="player" style="margin:6px 0 4px">
        <button class="play" id="play-${i}" aria-label="Écouter ou arrêter" ${canSpeak?"":"disabled"}>${ICON_PLAY}</button>
        <h3 style="margin:0;font:400 1.1rem var(--f-display);flex:1;min-width:0">${e.title}</h3>
      </div>
      <ol style="padding-left:20px;margin:10px 0 0">${e.questions.map(q=>`
        <li style="margin-top:8px">${q.q}<details style="margin-top:2px"><summary>Réponse</summary><p class="note" style="margin:4px 0 0;color:var(--ok)">${q.a}</p></details></li>`).join("")}</ol>
      <details class="transcript" id="tr-${i}"><summary>Transcription</summary><p class="kar" id="kar-${i}">${karaoke(e.text)}</p></details>
    </article>`).join("") || '<p class="empty">Aucun extrait pour ce niveau.</p>'}</div>
  <h2>Écoutes authentiques</h2><p class="sub">De vraies voix françaises, à ouvrir sur leur site. Les sources libres de droits sont en tête.</p>
  ${["Libres de droits","Gratuits"].map(g=>`<p class="eyebrow" style="margin:14px 0 8px">${g}</p><ul class="links">${DATA.ressources.filter(r=>r.group===g).map(r=>`<li><a href="${r.url}" target="_blank" rel="noopener"><div>${r.name}<small>${r.src}</small></div><span>↗</span></a></li>`).join("")}</ul>`).join("")}`;
  view.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{ state.rate=+b.dataset.rate; renderEcoute(); });
  document.getElementById("follow").onchange=ev=>{ state.follow=ev.target.checked; store.set("follow",state.follow); };
  items.forEach((e,i)=>{
    const b=document.getElementById("play-"+i); if(!b) return;
    b.onclick=()=>{ if(state.playing===i){ stopSync(); return; } speakSync(i, e.text, 0); };
    document.getElementById("kar-"+i).addEventListener("click",ev=>{
      const w=ev.target.closest("[data-s]"); if(!w || !canSpeak) return;
      speakSync(i, e.text, +w.dataset.s);
    });
  });
}

/* Lecture synchronisée : surligne le mot prononcé */
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';
function karaoke(text){
  let out="", re=/\S+/g, m, last=0;
  while((m=re.exec(text))){ out += text.slice(last,m.index) + `<span class="w" data-s="${m.index}">${m[0]}</span>`; last=m.index+m[0].length; }
  return out + text.slice(last);
}
let sync = { timer:null, i:null };
function markWord(i, charIdx){
  const box=document.getElementById("kar-"+i); if(!box) return;
  let cur=null; for(const w of box.children){ if(+w.dataset.s<=charIdx) cur=w; else break; }
  const prev=box.querySelector(".w.cur"); if(prev===cur) return;
  if(prev) prev.classList.remove("cur");
  box.querySelectorAll(".w").forEach(w=>w.classList.toggle("read", cur && +w.dataset.s < +cur.dataset.s));
  if(cur){ cur.classList.add("cur");
    const r=cur.getBoundingClientRect(), vh=window.innerHeight||0;
    if(vh && (r.top < 80 || r.bottom > vh-110)) cur.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
}
function clearSync(i){
  clearInterval(sync.timer); sync.timer=null;
  const box=document.getElementById("kar-"+i); if(box) box.querySelectorAll(".w").forEach(w=>w.classList.remove("cur","read"));
  const b=document.getElementById("play-"+i); if(b){ b.innerHTML=ICON_PLAY; b.classList.remove("on"); }
}
function stopSync(){ try{ speechSynthesis.cancel(); }catch(_){} if(state.playing!==null) clearSync(state.playing); state.playing=null; }
function speakSync(i, text, from){
  stopSync();
  if(!("speechSynthesis" in window)) return;
  state.playing=i;
  const b=document.getElementById("play-"+i); if(b){ b.innerHTML=ICON_STOP; b.classList.add("on"); }
  if(state.follow){ const d=document.getElementById("tr-"+i); if(d) d.open=true; }
  const part=text.slice(from), u=new SpeechSynthesisUtterance(part);
  u.lang="fr-FR"; u.rate=state.rate;
  try{ const fr=speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith("fr")); if(fr) u.voice=fr; }catch(_){}
  let real=false, t0=0;
  u.onboundary = ev => { if(ev.name && ev.name!=="word") return; real=true; if(state.follow) markWord(i, from+ev.charIndex); };
  u.onstart = () => { t0=performance.now();
    // Repli si l'appareil ne signale pas les mots : estimation au rythme moyen de lecture
    sync.timer=setInterval(()=>{ if(real || !state.follow) return;
      const chars=(performance.now()-t0)/1000 * 14.5 * state.rate; markWord(i, from+Math.min(chars, part.length)); }, 120); };
  u.onend = u.onerror = () => { if(state.playing===i){ clearSync(i); state.playing=null; } };
  speechSynthesis.speak(u);
}

function renderExamen(){
  const E = DATA.examen, x = E.exercice;
  const heard = state.heard, done = state.checked;
  view.innerHTML = `<h2>Examen blanc DALF C1</h2><p class="sub">Format calqué sur le sujet de démonstration officiel. Sans chronomètre.</p>
  <div class="epreuves">${E.epreuves.map(e=>`<div class="ep"><span class="pts">/${e.pts}</span><b>${e.name}</b><p>${e.desc}</p></div>`).join("")}</div>
  <p class="note">Total sur 100. Il faut 50 points et au moins 5/25 dans chaque épreuve.</p>
  ${E.regles.map(r=>`<p class="rule-note">${r}</p>`).join("")}

  <h2>Entraînement</h2>
  <article class="sheet">
    <div class="meta"><span class="chip">C1</span><span class="eyebrow">${x.theme}</span>${exChip}</div>
    <h3 style="margin:2px 0 12px;font:400 1.1rem var(--f-display)">${x.title}</h3>
    <div class="player">
      <button class="play" id="ex-play" aria-label="Écouter" ${heard?"disabled style='opacity:.4'":""}><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
      <span class="note" style="margin:0">${heard?"Écoute utilisée, comme le jour de l'examen.":"Lisez les questions, puis écoutez une seule fois."}</span>
    </div>
    <form id="ex-form">${x.questions.map((q,i)=>`
      <fieldset class="q"><legend>${i+1}. ${q.q}</legend>
      ${q.opts.map((o,j)=>{
        const cls = done ? (j===q.a?"right":(state.answers[i]===j?"wrong":"")) : "";
        return `<label class="${cls}"><input type="radio" id="q${i}-${j}" name="q${i}" value="${j}" ${state.answers[i]===j?"checked":""} ${done?"disabled":""}> ${String.fromCharCode(65+j)}. ${o}</label>`;
      }).join("")}</fieldset>`).join("")}
      <div class="row" style="margin-top:14px">
        ${done
          ? `<span class="score">${x.questions.filter((q,i)=>state.answers[i]===q.a).length} / ${x.questions.length}</span><button type="button" class="btn" id="ex-reset">Recommencer</button>`
          : `<button type="submit" class="btn primary">Corriger</button>`}
      </div>
    </form>
    ${done?`<details class="transcript"><summary>Afficher la transcription</summary><p>${x.text}</p></details>`:""}
  </article>

  <h2>Production écrite</h2>
  <article class="sheet">
    <div class="row" role="group" aria-label="Exercice" style="margin-bottom:10px">
      ${["synthese","essai"].map(k=>`<button type="button" class="btn" data-pe="${k}" style="padding:6px 12px;${state.pe===k?'border-color:var(--encre);color:var(--encre)':''}">${E.ecrit[k].label}</button>`).join("")}
      ${exChip}
    </div>
    <p style="margin:0 0 8px"><b>Sujet :</b> ${E.ecrit[state.pe].sujet}</p>
    <ul class="note" style="padding-left:18px;margin:0 0 10px">${E.ecrit[state.pe].consignes.map(c=>`<li>${c}</li>`).join("")}</ul>
    <textarea id="pe-text" rows="9" style="width:100%;box-sizing:border-box;font:16px/1.6 var(--f-body);padding:10px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);resize:vertical" placeholder="Rédigez ici…">${(state.drafts[state.pe]||"").replace(/</g,"&lt;")}</textarea>
    <div class="row" style="justify-content:space-between;margin-top:6px">
      <span class="counter" id="pe-count"></span>
      <span class="note" style="margin:0">Décompte officiel : « c'est-à-dire » = 1 mot</span>
    </div>
  </article>

  <h2>Sujet officiel</h2>
  <ul class="links"><li><a href="https://www.france-education-international.fr/article/dalf-c1?langue=fr" target="_blank" rel="noopener"><div>Sujet de démonstration DALF C1<small>France Éducation international · livret, audio et corrigé</small></div><span>↗</span></a></li></ul>`;

  const ta=document.getElementById("pe-text"), cnt=document.getElementById("pe-count"), cfg=E.ecrit[state.pe];
  const upd=()=>{ const n=(ta.value.trim().match(/\S+/g)||[]).length;
    const ok = n>=cfg.min && (cfg.max==null || n<=cfg.max);
    cnt.textContent = `${n} mots · attendu ${cfg.max?cfg.min+" à "+cfg.max:cfg.min+" minimum"}`;
    cnt.style.color = n===0 ? "var(--muted)" : ok ? "var(--ok)" : "var(--marge)"; };
  ta.oninput=()=>{ state.drafts[state.pe]=ta.value; store.set("drafts",state.drafts); upd(); }; upd();
  view.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>{ state.pe=b.dataset.pe; renderExamen(); });
  document.getElementById("ex-play").onclick=()=>{ if(state.heard) return; speak(x.text); state.heard=true; renderExamen(); };
  const f=document.getElementById("ex-form");
  f.onchange=e=>{ const m=e.target.name.match(/^q(\d+)$/); if(m) state.answers[+m[1]]=+e.target.value; };
  f.onsubmit=e=>{ e.preventDefault(); state.checked=true; renderExamen(); };
  const r=document.getElementById("ex-reset"); if(r) r.onclick=()=>{ state.checked=false; state.heard=false; state.answers={}; renderExamen(); };
}

function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="fr-FR"; u.rate=state.rate;
    const fr = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith("fr"));
    if(fr) u.voice=fr;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Navigation ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.t===state.tab));
  document.querySelectorAll(".lvl button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===state.level));
  ({structures:renderStructures, vocab:renderVocab, ecoute:renderEcoute, examen:renderExamen})[state.tab]();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.t; store.set("tab",state.tab); try{ if(state.playing!==null) stopSync(); else speechSynthesis.cancel(); }catch(e){}; render(); window.scrollTo(0,0); });
document.querySelectorAll(".lvl button").forEach(b=>b.onclick=()=>{ state.level=b.dataset.l; store.set("level",state.level); state.card=0; state.flipped=false; render(); });
const h = location.hash.slice(1); if(["structures","vocab","ecoute","examen"].includes(h)) state.tab=h;
if(!["structures","vocab","ecoute","examen"].includes(state.tab)) state.tab="structures";
render();
</script>
