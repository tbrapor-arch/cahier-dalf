/* ---------- Quiz ---------- */
const ART = /^(le |la |l'|les |un |une |des |se |s')/i;
const core = w => w.replace(ART,"");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function blank(v){
  const c=core(v.word); const i=v.ex.toLowerCase().indexOf(c.toLowerCase());
  return (i<0 || c.length<3) ? null : v.ex.slice(0,i)+"<span class='gap'>……</span>"+v.ex.slice(i+c.length);
}
function buildQuiz(pool){
  const picks = shuffle(pool).slice(0,state.qlen);
  return picks.map((v,n)=>{
    const others = shuffle((pool.length>=4?pool:byLevel(DATA.vocab)).filter(x=>x.word!==v.word && x.def!==v.def)).slice(0,3);
    const b = blank(v);
    const type = b && n%3!==2 ? (n%3===0?"trou":"def") : (n%3===2?"mot":"def");
    const opts = shuffle([v,...others]);
    if(type==="trou") return { v, type, prompt:b, label:"Complétez la phrase", opts:opts.map(o=>({t:core(o.word), ok:o===v})) };
    if(type==="mot") return { v, type, prompt:`<b class="qword">${v.word}</b>`, label:"Que signifie…", opts:opts.map(o=>({t:o.def, ok:o===v})) };
    return { v, type, prompt:v.def, label:"Quel mot correspond à cette définition ?", opts:opts.map(o=>({t:o.word, ok:o===v})) };
  });
}
function renderQuiz(head, pool, bind){
  if(pool.length<2){ view.innerHTML = head+'<p class="empty">Pas assez de mots dans ce thème pour un quiz.</p>'; bind(); return; }
  const key = state.level+"|"+state.themeV+"|"+state.qlen;
  if(!state.quiz || state.quiz.key!==key) state.quiz = { key, qs:buildQuiz(pool), i:0, score:0, picked:null, missed:[] };
  const Q = state.quiz;
  if(Q.i>=Q.qs.length){
    view.innerHTML = head + `<div class="sheet" style="text-align:left">
      <div class="eyebrow">Résultat</div>
      <div class="word" style="font-variant-numeric:tabular-nums">${Q.score} / ${Q.qs.length}</div>
      <p class="note" style="margin:4px 0 10px">${Q.score===Q.qs.length?"Sans faute.":Q.missed.length+" mot(s) ajouté(s) à « à revoir »."}</p>
      ${Q.missed.length?`<ul style="padding-left:18px;margin:0 0 12px">${Q.missed.map(v=>`<li><b>${v.word}</b> : ${v.def}</li>`).join("")}</ul>`:""}
      <button class="btn primary" id="qz-new">Nouveau quiz</button></div>`;
    bind(); document.getElementById("qz-new").onclick=()=>{ state.quiz=null; renderVocab(); }; return;
  }
  const q = Q.qs[Q.i], done = Q.picked!==null;
  view.innerHTML = head + `
  <div class="row" role="group" aria-label="Nombre de questions" style="margin-bottom:10px">
    <span class="eyebrow">Questions</span>
    ${[10,20,40].map(n=>`<button class="btn" data-qlen="${n}" style="padding:4px 10px;${state.qlen===n?'border-color:var(--encre);color:var(--encre)':''}">${n}</button>`).join("")}
  </div>
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <span class="counter">Question ${Q.i+1} / ${Q.qs.length}</span><span class="counter" style="color:var(--ok)">${Q.score} bonne(s)</span>
  </div>
  <div class="sheet">
    <div class="meta"><span class="chip">${q.v.level}</span><span class="eyebrow">${q.label}</span></div>
    <p class="qprompt">${q.prompt}</p>
    <div class="stack" style="gap:8px">${q.opts.map((o,j)=>{
      const cls = done ? (o.ok?"right":(Q.picked===j?"wrong":"")) : "";
      return `<button class="qopt ${cls}" data-o="${j}" ${done?"disabled":""}>${o.t}</button>`; }).join("")}</div>
    ${done?`<p class="example note" style="margin:12px 0 0">« ${q.v.ex} »</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="qz-next">${Q.i+1<Q.qs.length?"Suivant":"Voir le résultat"}</button></div>`:""}
  </div>`;
  bind();
  view.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.o; Q.picked=j;
    if(q.opts[j].ok) Q.score++; else { Q.missed.push(q.v); state.known[q.v.word]=false; store.set("known",state.known); }
    renderVocab(); });
  const n=document.getElementById("qz-next"); if(n) n.onclick=()=>{ Q.i++; Q.picked=null; renderVocab(); };
  view.querySelectorAll("[data-qlen]").forEach(b=>b.onclick=()=>{ state.qlen=+b.dataset.qlen; state.quiz=null; renderVocab(); });
}

/* Lecture synchronisée : surligne le mot prononcé, avec pause et reprise */
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function karaoke(text){
  let out="", re=/\S+/g, m, last=0;
  while((m=re.exec(text))){ out += text.slice(last,m.index) + `<span class="w" data-s="${m.index}">${m[0]}</span>`; last=m.index+m[0].length; }
  return out + text.slice(last);
}
let sync = { timer:null, pos:0, tok:0 };
function playerHTML(id){
  const ok="speechSynthesis" in window;
  return `<div class="player2"><button class="play" id="play-${id}" aria-label="Lire" ${ok?"":"disabled"}>${ICON_PLAY}</button><button class="stopb" id="stop-${id}" aria-label="Arrêter" hidden>${ICON_STOP}</button><span class="note pstate" id="ps-${id}" style="margin:0">${ok?"":"Lecture vocale indisponible sur ce navigateur."}</span></div>`;
}
function setPlayerUI(id, mode){
  const b=document.getElementById("play-"+id), s=document.getElementById("stop-"+id), t=document.getElementById("ps-"+id);
  if(b){ b.innerHTML = mode==="play" ? ICON_PAUSE : ICON_PLAY; b.classList.toggle("on", mode==="play"); b.setAttribute("aria-label", mode==="play" ? "Mettre en pause" : mode==="pause" ? "Reprendre" : "Lire"); }
  if(s) s.hidden = mode==="idle";
  if(t) t.textContent = mode==="play" ? "Lecture…" : mode==="pause" ? "En pause · touchez ▶ pour reprendre" : "";
}
function markWord(i, charIdx){
  const box=document.getElementById("kar-"+i); if(!box) return;
  let cur=null; for(const w of box.children){ if(+w.dataset.s<=charIdx) cur=w; else break; }
  const prev=box.querySelector(".w.cur"); if(prev===cur) return;
  if(prev) prev.classList.remove("cur");
  box.querySelectorAll(".w").forEach(w=>w.classList.toggle("read", cur && +w.dataset.s < +cur.dataset.s));
  if(cur){ cur.classList.add("cur");
    const r=cur.getBoundingClientRect(), vh=window.innerHeight||0;
    if(vh && (r.top < 80 || r.bottom > vh-110)) cur.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
}
function clearSync(i){
  clearInterval(sync.timer); sync.timer=null;
  const box=document.getElementById("kar-"+i); if(box) box.querySelectorAll(".w").forEach(w=>w.classList.remove("cur","read"));
  setPlayerUI(i,"idle");
}
function stopSync(){
  sync.tok++; try{ speechSynthesis.cancel(); }catch(_){}
  if(state.playing!==null) clearSync(state.playing);
  if(state.paused) clearSync(state.paused.i);
  state.playing=null; state.paused=null;
}
function pauseSync(){
  const i=state.playing; if(i===null) return;
  sync.tok++; clearInterval(sync.timer); sync.timer=null;
  state.paused={ i, pos: sync.pos||0 }; state.playing=null;
  try{ speechSynthesis.cancel(); }catch(_){}
  setPlayerUI(i,"pause");
}
const wordStart = (text,pos) => { pos=Math.max(0,Math.min(pos,text.length)); while(pos>0 && !/\s/.test(text[pos-1])) pos--; return pos; };
function speakSync(i, text, from){
  stopSync();
  if(!("speechSynthesis" in window)) return;
  const tok=++sync.tok;
  state.playing=i; sync.pos=from; setPlayerUI(i,"play");
  if(state.follow){ const d=document.getElementById("tr-"+i); if(d) d.open=true; }
  const part=text.slice(from), u=new SpeechSynthesisUtterance(part);
  u.lang="fr-FR"; u.rate=state.rate;
  try{ const fr=speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith("fr")); if(fr) u.voice=fr; }catch(_){}
  let real=false, t0=0;
  u.onboundary = ev => { if(tok!==sync.tok) return; if(ev.name && ev.name!=="word") return; real=true; sync.pos=from+ev.charIndex; if(state.follow) markWord(i, sync.pos); };
  u.onstart = () => { if(tok!==sync.tok) return; t0=performance.now();
    // Repli si l'appareil ne signale pas les mots : estimation au rythme moyen de lecture
    sync.timer=setInterval(()=>{ if(real || tok!==sync.tok) return;
      sync.pos=from+Math.min((performance.now()-t0)/1000 * 14.5 * state.rate, part.length); if(state.follow) markWord(i, sync.pos); }, 120); };
  u.onend = u.onerror = () => { if(tok!==sync.tok) return; if(state.playing===i){ clearSync(i); state.playing=null; } };
  speechSynthesis.speak(u);
}
function bindPlayer(id, text){
  const b=document.getElementById("play-"+id), s=document.getElementById("stop-"+id), k=document.getElementById("kar-"+id);
  if(b) b.onclick=()=>{
    if(state.playing===id) return pauseSync();
    if(state.paused && state.paused.i===id) return speakSync(id, text, wordStart(text, state.paused.pos));
    speakSync(id, text, 0); };
  if(s) s.onclick=()=>stopSync();
  if(k) k.addEventListener("click",ev=>{ const w=ev.target.closest("[data-s]"); if(!w || !("speechSynthesis" in window)) return; speakSync(id, text, +w.dataset.s); });
}

function methodHTML(keys){ const E=DATA.examen; return `<div class="stack">${keys.map(k=>{ const M=E.methode[k]; return `
    <details class="method" ${state.mopen===k?"open":""} data-m="${k}">
      <summary><b>${M.label}</b><span class="counter">${M.temps}</span></summary>
      <div class="mbody">
        ${M.steps.map(([t,items],n)=>`<div class="mstep"><span class="mnum">${n+1}</span><div><b>${t}</b><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></div></div>`).join("")}
        <p class="eyebrow" style="margin:14px 0 6px">Avant de rendre</p>

      </div>

/* ---------- Onglet Examen : Entraînement | Examen blanc | Méthode ---------- */
const exSwitch = () => `<div class="row" role="group" aria-label="Diplôme" style="margin:4px 0 14px">${["C1","C2"].map(l=>`<button class="btn" data-exlvl="${l}" aria-pressed="${state.exlvl===l}" style="padding:6px 14px;${state.exlvl===l?'background:var(--encre);border-color:var(--encre);color:var(--sheet)':''}">DALF ${l}</button>`).join("")}</div>`;
const wc = t => (t.trim().match(/\S+/g)||[]).length;
const ICO = {
  ecoute:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
  structures:'<path d="M4 6h16M4 12h10M4 18h13"/>',

/* Hasard reproductible : une série contient toujours les mêmes questions */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function sshuffle(arr, seed){ const r=rng(seed), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let _pools = null;
function pools(){
  if(_pools) return _pools;
  _pools = {
    structures: sshuffle(DATA.structures.filter(firstBold), 1101),
    vocab: sshuffle(DATA.vocab.filter(v=>blank(v)), 2202),
    grammaire: DATA.grammaire.slice(),
    ecoute: DATA.ecoute.slice(),
    essai: DATA.examen.sujetsEssai.slice(),
    c2: DATA.examen.c2.sujets.slice()
  };
  return _pools;
}
const TYPES = {
  ecoute:     { label:"Écoute", size:2, unit:"documents", kind:"listen", sub:"comme la 2ᵉ partie de l'épreuve" },
  structures: { label:"Structures", size:10, unit:"textes à trous", kind:"mcq" },
  vocab:      { label:"Vocabulaire", size:10, unit:"textes à trous", kind:"mcq" },
  grammaire:  { label:"Grammaire", size:10, unit:"questions", kind:"mcq" },
  essai:      { label:"Essai C1", size:1, unit:"sujet · 250 mots", kind:"write", min:250, meth:"essai" },
  c2:         { label:"Texte C2", size:1, unit:"sujet · 700 mots", kind:"write", min:700, meth:"c2ecrit" }
};
const nSeries = t => Math.ceil(pools()[t].length / TYPES[t].size);
const prog = (t,n) => ((state.prog[t]||{})[n]) || null;
function setProg(t,n,v){ state.prog[t]=state.prog[t]||{}; state.prog[t][n]=v; store.set("prog",state.prog); }

function buildMCQ(t, n){
  const P=pools()[t], items=P.slice(n*10, n*10+10);
  return items.map((it,k)=>{
    const r=rng(7919*(n+1)+k*31+t.length);
    if(t==="grammaire") return { prompt: it.q.replace(/……….|………./g,"<span class='gap'>……</span>"), opts: it.opts, a: it.a, tag: it.pt, ex: it.ex };
    if(t==="structures"){
      const ans=firstBold(it), seen=new Set([ans.toLowerCase()]), others=[];
      for(const o of sshuffle(DATA.structures, Math.floor(r()*1e9))){ const f=firstBold(o); if(f && !seen.has(f.toLowerCase())){ seen.add(f.toLowerCase()); others.push(f); } if(others.length===3) break; }
      const opts=sshuffle([ans,...others], Math.floor(r()*1e9));
      return { prompt: it.example.replace(/<b>.*?<\/b>/, "<span class='gap'>……</span>").replace(/<\/?b>/g,""), opts, a: opts.indexOf(ans), tag: it.name, ex: tNote(it) };
    }
    const ans=core(it.word), seen=new Set([ans.toLowerCase()]), others=[];
    const same=DATA.vocab.filter(v=>v.theme===it.theme), pool=same.length>=6?same:DATA.vocab;
    for(const o of sshuffle(pool, Math.floor(r()*1e9))){ const c=core(o.word); if(!seen.has(c.toLowerCase())){ seen.add(c.toLowerCase()); others.push(c); } if(others.length===3) break; }
    const opts=sshuffle([ans,...others], Math.floor(r()*1e9));
    return { prompt: blank(it), opts, a: opts.indexOf(ans), tag: it.word, ex: it.def };
  });
}

function renderExamen(){
  if(state.playing!==null || state.paused) { stopSync(); state.paused=null; }
  const subs=[["train","Entraînement"],["blanc","Examen blanc"],["meth","Méthode"]];
  const top = `<h2>Examen</h2><div class="subtabs" role="tablist" aria-label="Examen">${subs.map(([k,l])=>`<button role="tab" id="sub-${k}" data-sub="${k}" aria-selected="${state.exsub===k}">${l}</button>`).join("")}</div>`;
  if(state.exsub==="blanc") return renderBlanc(top);
  if(state.exsub==="meth") return renderMeth(top);
  if(state.exRun) return renderRun();
  if(state.exType) return renderSeriesList(top);
  renderTrain(top);
}
function bindTop(){
  view.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{ state.exsub=b.dataset.sub; store.set("exsub",state.exsub); state.exRun=null; renderExamen(); window.scrollTo(0,0); });
  view.querySelectorAll("[data-goto-meth]").forEach(b=>b.onclick=()=>{ state.exsub="meth"; state.mopen=b.dataset.gotoMeth; renderExamen();
    const d=view.querySelector(`details.method[data-m="${state.mopen}"]`); if(d) d.scrollIntoView({block:"start"}); });
}

/* Entraînement : une carte par type d'exercice */
function seriesStats(t){
  const N=nSeries(t), P=state.prog[t]||{}; let done=0, sum=0, cnt=0;
  for(const n in P){ if(P[n].done){ done++; if(TYPES[t].kind!=="write" && P[n].total){ sum+=P[n].best/P[n].total; cnt++; } } }
  return { N, done, avg: cnt? sum/cnt : null };
}
function renderTrain(top){
  const keys=Object.keys(TYPES); let D=0,T=0,S=0,C=0;
  keys.forEach(t=>{ const s=seriesStats(t); D+=s.done; T+=s.N; if(s.avg!==null){ S+=s.avg; C++; } });
  view.innerHTML = top + `
  <div class="stats"><div><span class="eyebrow">Séries terminées</span><b>${D} / ${T}</b></div><div><span class="eyebrow">Score moyen</span><b>${C?Math.round(S/C*100)+" %":"—"}</b></div></div>
  <div class="tcards">${keys.map(t=>{ const s=seriesStats(t), T=TYPES[t];
    return `<button class="tcard" data-type="${t}">${icon(t)}<b>${T.label}</b><small>${s.N} ${T.kind==="write"?"sujets":"séries"} · ${T.kind==="write"?T.unit:T.size+" "+T.unit}</small><div class="progress"><i style="width:${s.N?s.done/s.N*100:0}%"></i></div><small class="counter">${s.done} / ${s.N}</small></button>`; }).join("")}</div>
  <p class="note" style="margin-top:14px">Chaque série contient toujours les mêmes questions : vous pouvez refaire une série ratée et suivre vos progrès.</p>`;
  bindTop();
  view.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{ state.exType=b.dataset.type; renderExamen(); window.scrollTo(0,0); });
}

/* Liste des séries d'un type */
function renderSeriesList(top){
  const t=state.exType, T=TYPES[t], s=seriesStats(t), N=s.N;
  const tiles=[]; for(let n=0;n<N;n++){ const p=prog(t,n); let cls="", sub="";
    if(p && p.done){ cls="ok"; sub = T.kind==="write" ? `${p.best} mots` : `${p.best}/${p.total}`; }
    else if(p && p.cur){ cls="go"; sub = T.kind==="mcq" ? `${p.cur.i}/${T.size}…` : "en cours"; }
    tiles.push(`<button class="stile ${cls}" data-n="${n}" aria-label="Série ${n+1}${sub?", "+sub:""}">${n+1}${sub?`<small>${sub}</small>`:""}</button>`); }
  view.innerHTML = top + `
  <button class="more-link" id="back-train" style="margin:0 0 8px">← Entraînement</button>
  <h3 class="sl-title">${icon(t)} ${T.label}</h3>
  <p class="sub">${s.done} ${T.kind==="write"?"sujet(s)":"série(s)"} sur ${N} terminé(s)${s.avg!==null?` · moyenne ${Math.round(s.avg*100)} %`:""}. ${T.kind==="write"?`Un sujet par série, ${T.min} mots minimum.`:`${T.size} ${T.unit} par série${T.sub?", "+T.sub:""}.`}</p>
  <div class="stiles">${tiles.join("")}</div>`;
  bindTop();
  document.getElementById("back-train").onclick=()=>{ state.exType=null; renderExamen(); };
  view.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ state.exRun={t, n:+b.dataset.n}; renderExamen(); window.scrollTo(0,0); });
}

/* Déroulement d'une série */
function runHead(t,n,extra){
  return `<div class="runhead"><button class="more-link" id="run-back">← ${TYPES[t].label}</button><span class="counter">Série ${n+1}${extra?" · "+extra:""}</span></div>`;
}
function bindRunHead(){ document.getElementById("run-back").onclick=()=>{ stopSync(); state.paused=null; state.exRun=null; renderExamen(); window.scrollTo(0,0); }; }
function renderRun(){
  const {t,n}=state.exRun, T=TYPES[t];
  if(T.kind==="mcq") return runMCQ(t,n);
  if(T.kind==="listen") return runListen(t,n);
  return runWrite(t,n);
}
function runMCQ(t,n){
  const qs=buildMCQ(t,n), T=TYPES[t]; let p=prog(t,n)||{};
  let cur=p.cur || { i:0, score:0, ans:[] };
  if(!p.cur && p.done && !state.exRun.restart){ return runResult(t,n,qs,p.lastAns||[]); }
  if(state.exRun.restart){ cur={i:0,score:0,ans:[]}; state.exRun.restart=false; }
  if(cur.i>=qs.length) return runResult(t,n,qs,cur.ans);
  const q=qs[cur.i], picked=cur.ans[cur.i], done=picked!==undefined;
  view.innerHTML = runHead(t,n,`Question ${cur.i+1} / ${qs.length}`) + `
  <div class="progress" style="margin:0 0 12px"><i style="width:${cur.i/qs.length*100}%"></i></div>
  <div class="sheet">
    <div class="meta"><span class="eyebrow">${done?q.tag:(t==="grammaire"?"Grammaire":"Complétez la phrase")}</span></div>
    <p class="qprompt">${q.prompt}</p>
    <div class="stack" style="gap:8px">${q.opts.map((o,j)=>`<button class="qopt ${done?(j===q.a?"right":(picked===j?"wrong":"")):""}" data-o="${j}" ${done?"disabled":""}>${t==="grammaire"?String.fromCharCode(65+j)+". ":""}${o}</button>`).join("")}</div>
    ${done?`<p class="note" style="margin:12px 0 0">${q.ex}</p><div class="row" style="margin-top:12px"><button class="btn primary" id="q-next">${cur.i+1<qs.length?"Suivant":"Voir le résultat"}</button></div>`:""}
  </div>`;
  bindRunHead();
  const save=()=>setProg(t,n,Object.assign({}, prog(t,n)||{}, {cur}));
  view.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.o; cur.ans[cur.i]=j; if(j===q.a) cur.score++; save(); renderRun(); });
  const nx=document.getElementById("q-next"); if(nx) nx.onclick=()=>{ cur.i++;
    if(cur.i>=qs.length){ const old=prog(t,n)||{}; setProg(t,n,{done:true, best:Math.max(old.best||0,cur.score), last:cur.score, total:qs.length, lastAns:cur.ans}); return runResult(t,n,qs,cur.ans); }
    save(); renderRun(); window.scrollTo(0,0); };
}
function runResult(t,n,qs,ans){
  const p=prog(t,n)||{}, score=qs.filter((q,k)=>ans[k]===q.a).length, miss=qs.filter((q,k)=>ans[k]!==q.a), N=nSeries(t);
  view.innerHTML = runHead(t,n,"Résultat") + `
  <div class="sheet">
    <div class="eyebrow">Score</div><div class="word" style="font-variant-numeric:tabular-nums">${score} / ${qs.length}</div>
    ${p.best!==undefined?`<p class="note" style="margin:2px 0 10px">Meilleur score sur cette série : ${p.best} / ${qs.length}</p>`:""}
    ${miss.length?`<p class="eyebrow" style="margin:10px 0 6px">À revoir</p><ul class="miss">${miss.map(q=>`<li><b>${q.tag}</b><br><span class="note">${q.ex}</span></li>`).join("")}</ul>`:'<p class="note">Sans faute.</p>'}
    <div class="row" style="margin-top:12px"><button class="btn" id="r-again">Refaire la série</button>${n+1<N?`<button class="btn primary" id="r-next">Série ${n+2}</button>`:""}</div>
  </div>`;
  bindRunHead();
  document.getElementById("r-again").onclick=()=>{ const p=prog(t,n)||{}; delete p.cur; setProg(t,n,p); state.exRun={t,n,restart:true}; renderRun(); window.scrollTo(0,0); };
  const nx=document.getElementById("r-next"); if(nx) nx.onclick=()=>{ state.exRun={t,n:n+1}; renderRun(); window.scrollTo(0,0); };
}

/* Série d'écoute : 2 documents, questions ouvertes, auto-correction */
function runListen(t,n){
  const docs=pools().ecoute.slice(n*2,n*2+2), p=prog(t,n)||{}, marks=(p.cur&&p.cur.marks)||p.lastMarks||{};
  const total=docs.reduce((s,d)=>s+d.questions.length,0), marked=Object.keys(marks).length, score=Object.values(marks).filter(Boolean).length;
  view.innerHTML = runHead(t,n,`${marked} / ${total} corrigées`) + `
  <p class="note" style="margin:0 0 12px">Écoutez chaque document, répondez dans votre tête ou sur papier, puis affichez la réponse et dites si vous aviez juste.</p>
  <div class="stack">${docs.map((d,k)=>{ const id=`r${n}-${k}`; return `
    <article class="sheet">
      <div class="meta"><span class="chip">${d.level}</span><span class="eyebrow">${d.theme} · ${d.type}</span></div>
      <h3 style="margin:2px 0 8px;font:400 1.1rem var(--f-display)">${d.title}</h3>
      ${playerHTML(id)}
      <ol class="lq">${d.questions.map((q,j)=>{ const key=k+"-"+j, m=marks[key]; return `
        <li>${q.q}
          <details ${m!==undefined?"open":""}><summary>Réponse</summary><p class="note" style="margin:4px 0 6px;color:var(--ok)">${q.a}</p>
            <div class="row" style="gap:6px"><button class="btn mk ${m===true?"good":""}" data-mk="${key}" data-v="1">J'avais juste</button><button class="btn mk ${m===false?"bad":""}" data-mk="${key}" data-v="0">Je me suis trompé(e)</button></div>
          </details></li>`; }).join("")}</ol>
      <details class="transcript" id="tr-${id}"><summary>Transcription</summary><p class="kar" id="kar-${id}">${karaoke(d.text)}</p></details>
    </article>`; }).join("")}</div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><span class="score">${score} / ${total}</span>
    <button class="btn primary" id="l-done" ${marked<total?"disabled style='opacity:.5'":""}>${p.done && marked===total?"Enregistrer à nouveau":"Terminer la série"}</button></div>`;
  bindRunHead();
  docs.forEach((d,k)=>bindPlayer(`r${n}-${k}`, d.text));
  view.querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{ const cur=Object.assign({}, marks); cur[b.dataset.mk]=b.dataset.v==="1"; setProg(t,n,Object.assign({}, prog(t,n)||{}, {cur:{marks:cur}})); const y=window.scrollY; renderRun(); window.scrollTo(0,y); });
  document.getElementById("l-done").onclick=()=>{ if(marked<total) return; const old=prog(t,n)||{}; setProg(t,n,{done:true,best:Math.max(old.best||0,score),last:score,total,lastMarks:marks}); stopSync(); state.exRun=null; renderExamen(); };
}

/* Série d'écriture : un sujet */
function countLine(nw, min){
  const col = !nw ? "var(--muted)" : nw>=min ? "var(--ok)" : nw>=min*0.9 ? "var(--warn)" : "var(--marge)";

}
function runWrite(t,n){

    <div class="row" style="margin-top:14px"><button class="btn primary" id="w-done">Marquer comme terminé</button></div>
  </article>`;
  bindRunHead(); bindTop();
  view.querySelectorAll("[data-chk]").forEach(c=>c.onchange=()=>{ state.checks[c.dataset.chk]=c.checked; store.set("checks",state.checks); });

  document.getElementById("w-done").onclick=()=>{ setProg(t,n,{done:true,best:wc(ta.value),total:T.min}); state.exRun=null; renderExamen(); };

    const ce=`<p class="note" style="margin:0 0 10px">Texte d'idées de 1 500 à 2 000 mots, questions à choix multiple, réponses rédigées et vrai / faux justifiés.</p>
      <ul class="links"><li><a href="https://www.france-education-international.fr/article/dalf-c1?langue=fr" target="_blank" rel="noopener"><div>Sujet de démonstration officiel<small>Texte, questions et corrigé</small></div><span>↗</span></a></li></ul>`;
    const pe=`<div class="row" role="group" aria-label="Exercice" style="margin-bottom:10px">${["synthese","essai"].map(k=>`<button type="button" class="btn" data-pe="${k}" style="padding:6px 12px;${state.pe===k?'border-color:var(--encre);color:var(--encre)':''}">${E.ecrit[k].label}</button>`).join("")}</div>
      <p style="margin:0 0 8px"><b>Sujet :</b> ${state.pe==="essai"?E.sujetsEssai[state.sujetI % E.sujetsEssai.length]:E.ecrit.synthese.sujet}</p>
      ${state.pe==="essai"?`<button type="button" class="more-link" id="pe-next" style="margin:0 0 10px">↻ Autre sujet</button>`:`<p class="note" style="margin:0 0 10px">Pour une vraie synthèse, utilisez les documents du sujet officiel.</p>`}
      <textarea id="pe-text" rows="9" class="wbox" placeholder="Rédigez ici…">${(state.drafts[state.pe]||"").replace(/</g,"&lt;")}</textarea>
      <div class="row" style="justify-content:space-between;margin-top:6px"><span class="counter" id="pe-count"></span><span class="note" style="margin:0">« c'est-à-dire » = 1 mot</span></div>`;
    const S=E.sujetsOral, so=S[state.oralI % S.length];
    const po=`<p class="note" style="margin:0 0 8px">1 h de préparation, exposé de 8 à 10 min, puis débat avec le jury.</p>
      <p style="margin:0 0 8px"><b>Sujet :</b> ${so}</p><button type="button" class="more-link" id="po-next" style="margin:0 0 10px">↻ Autre sujet</button>
      <textarea id="po-text" rows="6" class="wbox" placeholder="Plan et mots-clés (pas de phrases rédigées)">${(state.drafts.oral||"").replace(/</g,"&lt;")}</textarea>`;
    rows = epRow("co","Compréhension de l'oral",25,co,"co")+epRow("ce","Compréhension des écrits",25,ce,"ce")+epRow("pe","Production écrite",25,pe,"synthese")+epRow("po","Production orale",25,po,"po");
  } else {
    const docs=DATA.ecoute.filter(d=>d.level==="C2"), d=docs[state.c2oi % docs.length];
    const oral=`<p class="note" style="margin:0 0 8px">Écoutez deux fois le document, préparez 1 h, puis : compte rendu, votre position, débat avec le jury.</p>
      <h3 style="margin:2px 0 8px;font:400 1.05rem var(--f-display)">${d.title}</h3>${playerHTML("c2o")}
      <button type="button" class="more-link" id="c2o-next" style="margin:8px 0 10px">↻ Autre document</button>
      <textarea id="c2o-text" rows="6" class="wbox" placeholder="Notes : idées du document, votre position, exemples">${(state.drafts.c2oral||"").replace(/</g,"&lt;")}</textarea>
      <details class="transcript" id="tr-c2o"><summary>Transcription</summary><p class="kar" id="kar-c2o">${karaoke(d.text)}</p></details>`;
    const C=E.c2, n=state.c2i % C.sujets.length;
    const ecrit=`<p style="margin:0 0 8px"><b>Sujet :</b> ${C.sujets[n]}</p><button type="button" class="more-link" id="c2-next" style="margin:0 0 10px">↻ Autre sujet</button>
      <textarea id="c2-text" rows="12" class="wbox" placeholder="Rédigez ici…">${(state.drafts.c2||"").replace(/</g,"&lt;")}</textarea>
      <div class="row" style="justify-content:space-between;margin-top:6px"><span class="counter" id="c2-count"></span><span class="note" style="margin:0">Au moins 700 mots</span></div>`;
    rows = epRow("c2oral","Compréhension et production orales",50,oral,"c2oral")+epRow("c2ecrit","Compréhension et production écrites",50,ecrit,"c2ecrit");
  }
  view.innerHTML = top + exSwitch() + `<p class="sub">Les épreuves dans l'ordre de l'examen. Touchez une épreuve pour l'ouvrir.</p><div class="stack">${rows}</div>
    <p class="note" style="margin-top:12px">${C1?"Total sur 100. Il faut 50 points et au moins 5/25 dans chaque épreuve.":"Total sur 100. Il faut 50 points pour obtenir le diplôme."}</p>`;
  bindTop(); bindMethods();
  view.querySelectorAll("details.eprow").forEach(d=>d.addEventListener("toggle",()=>{ if(d.open) state.blancOpen=d.dataset.ep; else if(state.blancOpen===d.dataset.ep) state.blancOpen=null; }));
  view.querySelectorAll("[data-open-type]").forEach(b=>b.onclick=()=>{ state.exsub="train"; state.exType=b.dataset.openType; state.exRun=null; renderExamen(); window.scrollTo(0,0); });
  const draft=(id,key,after)=>{ const ta=document.getElementById(id); if(!ta) return; ta.oninput=()=>{ state.drafts[key]=ta.value; store.set("drafts",state.drafts); after&&after(); }; after&&after(); };
  if(C1){
    const x=E.exercice;
    document.getElementById("ex-play").onclick=()=>{ if(state.heard) return; speak(x.text); state.heard=true; renderExamen(); };
    const f=document.getElementById("ex-form");
    f.onchange=e=>{ const m=e.target.name.match(/^q(\d+)$/); if(m) state.answers[+m[1]]=+e.target.value; };
    f.onsubmit=e=>{ e.preventDefault(); state.checked=true; renderExamen(); };
    const r=document.getElementById("ex-reset"); if(r) r.onclick=()=>{ state.checked=false; state.heard=false; state.answers={}; renderExamen(); };
    const cfg=E.ecrit[state.pe], cnt=document.getElementById("pe-count"), ta=document.getElementById("pe-text");
    draft("pe-text", state.pe, ()=>{ const n=wc(ta.value); let msg,col;
      if(state.pe==="synthese"){ const off=n<cfg.min?cfg.min-n:(n>cfg.max?n-cfg.max:0); col=!n?"var(--muted)":off===0?"var(--ok)":"var(--marge)"; msg=!n?"attendu 200 à 240":off===0?"dans la fourchette":(n<cfg.min?`${off} mot(s) de moins que le minimum`:`${off} mot(s) de trop`); }
      else { [msg,col]=countLine(n,250); msg=msg.replace(/^\d+ mots · /,""); }
      cnt.textContent=`${n} mots · ${msg}`; cnt.style.color=col; });
    view.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>{ state.pe=b.dataset.pe; renderExamen(); });
    const nx=document.getElementById("pe-next"); if(nx) nx.onclick=()=>{ state.sujetI++; store.set("sujetI",state.sujetI); renderExamen(); };
    draft("po-text","oral");
    document.getElementById("po-next").onclick=()=>{ state.oralI++; store.set("oralI",state.oralI); renderExamen(); };
  } else {
    const docs=DATA.ecoute.filter(d=>d.level==="C2"), d=docs[state.c2oi % docs.length];
    bindPlayer("c2o", d.text);
    document.getElementById("c2o-next").onclick=()=>{ state.c2oi++; store.set("c2oi",state.c2oi); renderExamen(); };
    draft("c2o-text","c2oral");
    const ta=document.getElementById("c2-text"), cnt=document.getElementById("c2-count");
    draft("c2-text","c2",()=>{ const [txt,col]=countLine(wc(ta.value),700); cnt.textContent=txt; cnt.style.color=col; });
    document.getElementById("c2-next").onclick=()=>{ state.c2i++; store.set("c2i",state.c2i); renderExamen(); };
  }
}

/* Méthode : format, règles et fiches pas à pas */
function renderMeth(top){
  const E=DATA.examen, C1=state.exlvl!=="C2", eps=C1?E.epreuves:E.c2.epreuves;
  view.innerHTML = top + exSwitch() + `
  <div class="epreuves">${eps.map(e=>`<div class="ep"><span class="pts">/${e.pts}</span><b>${e.name}</b><p>${e.desc}</p></div>`).join("")}</div>
  <p class="note">${C1?"Total sur 100. Il faut 50 points et au moins 5/25 dans chaque épreuve.":"Total sur 100. Il faut 50 points pour obtenir le diplôme."}</p>
  ${C1?E.regles.map(r=>`<p class="rule-note">${r}</p>`).join(""):""}
  <h2>Méthode par épreuve</h2><p class="sub">La démarche pas à pas, et une liste à cocher avant de rendre sa copie.</p>
  ${methodHTML(C1?["co","ce","synthese","essai","po"]:["c2oral","c2ecrit"])}
  <h2>Sujets officiels</h2>
  <ul class="links"><li><a href="https://www.france-education-international.fr/article/dalf-${C1?"c1":"c2"}?langue=fr" target="_blank" rel="noopener"><div>Sujet de démonstration DALF ${C1?"C1":"C2"}<small>France Éducation international · documents, audio et corrigés</small></div><span>↗</span></a></li></ul>`;
  bindTop(); bindMethods();
}

function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="fr-FR"; u.rate=state.rate;
    const fr = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith("fr"));
    if(fr) u.voice=fr;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Navigation ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.t===state.tab));
  document.querySelectorAll(".lvl button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===state.level));
  ({structures:renderStructures, vocab:renderVocab, ecoute:renderEcoute, examen:renderExamen})[state.tab]();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.t; store.set("tab",state.tab); try{ stopSync(); }catch(e){}; render(); window.scrollTo(0,0); });
document.querySelectorAll(".lvl button").forEach(b=>b.onclick=()=>{ state.level=b.dataset.l; store.set("level",state.level); state.card=0; state.flipped=false; render(); });
const h = location.hash.slice(1); if(["structures","vocab","ecoute","examen"].includes(h)) state.tab=h;
if(!["structures","vocab","ecoute","examen"].includes(state.tab)) state.tab="structures";
render();
</script>

<script>
if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
