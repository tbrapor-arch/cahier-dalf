: « après » + infinitif passé."}, "Depuis que / il y a… que": {"more": ["<b>Il y a</b> deux ans <b>que</b> je prépare cet examen.", "<b>Depuis qu'</b>elle vit à Paris, elle parle mieux français."], "expl": "Durée qui continue jusqu'au présent : présent de l'indicatif, pas le passé composé."}, "Au fur et à mesure que": {"more": ["<b>Au fur et à mesure que</b> l'année avance, les cours deviennent plus difficiles.", "<b>Au fur et à mesure qu'</b>on lit, le vocabulaire s'enrichit."], "expl": "Deux actions progressent en parallèle. Peut aussi s'employer seul : « je range au fur et à mesure »."}, "À peine… que (inversion)": {"more": ["<b>À peine était-il</b> arrivé <b>qu'</b>il repartait.", "<b>À peine</b> le film <b>avait-il</b> commencé <b>que</b> la salle se vidait."], "expl": "Succession très rapide de deux actions. Inversion obligatoire après « à peine » en tête, puis « que »."}, "Sitôt + participe passé": {"more": ["<b>Sitôt</b> le diplôme <b>obtenu</b>, elle a été embauchée.", "<b>Sitôt dit, sitôt fait</b>."], "expl": "Version condensée et littéraire de « dès que ». « Sitôt dit, sitôt fait » est une expression figée."}, "Tant que / jusqu'à ce que": {"more": ["Reste ici <b>jusqu'à ce que</b> je <b>revienne</b>.", "<b>Tant que</b> tu <b>es</b> là, profite."], "expl": "« Jusqu'à ce que » marque une limite et prend le subjonctif. « Tant que » marque une durée simultanée et prend l'indicatif."}, "Ne… que": {"more": ["Je <b>n'</b>ai <b>qu'</b>une semaine de vacances.", "Il <b>ne</b> pense <b>qu'</b>à son travail."], "expl": "Restriction plus élégante que « seulement ». Le « que » se place juste avant l'élément restreint."}, "Sauf / excepté / hormis": {"more": ["Tout le monde est venu, <b>sauf</b> Paul.", "<b>Hormis</b> le prix, le produit est parfait."], "expl": "Exclut un élément d'un ensemble. « Hormis » est le plus soutenu, « excepté » s'accorde s'il est placé après le nom."}, "Si ce n'est": {"more": ["Personne ne l'a aidé, <b>si ce n'est</b> sa sœur.", "Il n'a rien dit, <b>si ce n'est</b> quelques mots."], "expl": "Restriction après une négation : « sauf, excepté ». Très courant à l'écrit soutenu."}, "Pour ce qui est de / quant à": {"more": ["<b>Quant à</b> moi, je préfère attendre.", "<b>Pour ce qui est du</b> budget, rien n'est décidé."], "expl": "Passe d'un sujet à un autre. « Quant à » s'accorde avec la contraction : quant au, quant aux."}, "Tout au plus / à tout le moins": {"more": ["Cela prendra <b>tout au plus</b> une heure.", "On aurait pu, <b>à tout le moins</b>, nous prévenir."], "expl": "« Tout au plus » fixe un maximum. « À tout le moins » fixe un minimum, souvent pour exprimer un reproche."}, "Ce qui…, c'est…": {"more": ["<b>Ce qui</b> compte, <b>c'est</b> la persévérance.", "<b>Ce que</b> je regrette, <b>c'est</b> le manque de dialogue."], "expl": "Met en valeur l'élément final. « Ce qui » si le verbe a besoin d'un sujet, « ce que » s'il a besoin d'un complément."}, "Non seulement…, mais encore": {"more": ["Il est <b>non seulement</b> intelligent, <b>mais aussi</b> généreux.", "<b>Non seulement</b> elle parle français, <b>mais encore</b> elle l'enseigne."], "expl": "Additionne en insistant sur le second élément. Les deux éléments doivent être de même nature grammaticale."}, "Encore faut-il que": {"more": ["Il veut réussir ; <b>encore faut-il qu'</b>il <b>travaille</b>.", "Les solutions existent ; <b>encore faut-il</b> les mettre en œuvre."], "expl": "Ajoute une condition qui relativise ce qui précède. Inversion obligatoire. Une tournure typiquement C2."}, "Ne serait-ce que": {"more": ["Viens, <b>ne serait-ce que</b> cinq minutes.", "Il faudrait réagir, <b>ne serait-ce que</b> par principe."], "expl": "« Même si ce n'est que… ». Présente un minimum suffisant. Figé au conditionnel."}, "C'est… qui / c'est… que": {"more": ["<b>C'est</b> toi <b>qui</b> as raison.", "<b>C'est</b> en lisant <b>qu'</b>on progresse."], "expl": "Mise en relief de base. Attention à l'accord : le verbe après « qui » s'accorde avec l'élément mis en relief."}, "Ce dont…, c'est": {"more": ["<b>Ce dont</b> j'ai peur, <b>c'est</b> de l'échec.", "<b>Ce dont</b> on parle le moins, <b>c'est</b> de la santé mentale."], "expl": "Pour les verbes construits avec « de » (avoir besoin de, parler de, avoir peur de). Erreur fréquente : « ce que j'ai besoin »."}, "Ce à quoi…, c'est": {"more": ["<b>Ce à quoi</b> je pense, <b>c'est</b> à l'avenir.", "<b>Ce à quoi</b> il faut s'attaquer, <b>c'est</b> la pauvreté."], "expl": "Pour les verbes construits avec « à » (penser à, s'attendre à). Le « à » peut être répété après « c'est »."}, "Le problème, c'est que": {"more": ["<b>Le problème, c'est qu'</b>on manque de temps.", "<b>L'essentiel, c'est que</b> tout le monde soit d'accord."], "expl": "Annonce l'idée importante. « L'essentiel, c'est que » prend le subjonctif car il exprime un souhait."}, "Dislocation": {"more": ["Les écrans, les enfants <b>les</b> adorent.", "Moi, je <b>le</b> trouve trop cher, ce téléphone."], "expl": "Détache un élément en début ou en fin de phrase, puis le reprend par un pronom. Naturel à l'oral, à éviter à l'écrit soutenu."}, "Si… c'est (parce) que": {"more": ["<b>Si</b> je suis en retard, <b>c'est que</b> le train a été annulé.", "<b>Si</b> les jeunes votent peu, <b>c'est parce qu'</b>ils se sentent ignorés."], "expl": "Part d'un fait constaté pour en donner l'explication. Très efficace pour structurer une analyse."}, "Rien de tel que / il n'y a que": {"more": ["<b>Rien de tel qu'</b>une bonne nuit de sommeil.", "<b>Il n'y a que</b> toi pour dire ça !"], "expl": "« Rien de tel que » : rien n'est meilleur. « Il n'y a que » : exclusivité, souvent avec une nuance d'étonnement."}, "Ni plus ni moins que": {"more": ["Ce <b>n'</b>est <b>ni plus ni moins qu'</b>un scandale.", "Il a <b>ni plus ni moins</b> doublé ses ventes."], "expl": "Insiste sur l'exactitude d'une qualification souvent forte. Accompagne généralement « ne… »."}, "Toujours est-il / reste que": {"more": ["L'idée est bonne. <b>Reste que</b> personne ne veut la financer.", "Le projet est lancé ; <b>reste à</b> trouver des volontaires."], "expl": "« Reste que » : une difficulté demeure. « Reste à + infinitif » : ce qu'il faut encore faire."}, "Force est de constater que": {"more": ["<b>Force est de constater que</b> le dialogue a échoué.", "<b>Force est de reconnaître</b> qu'il avait raison."], "expl": "On est obligé d'admettre un fait, même à contrecœur. Excellente formule de conclusion."}, "Il n'est pas exclu que": {"more": ["<b>Il n'est pas exclu qu'</b>il <b>pleuve</b> demain.", "<b>Il n'est pas impossible que</b> les prix <b>baissent</b>."], "expl": "Exprime une possibilité avec prudence (double négation). Subjonctif obligatoire."}, "Superlatif + subjonctif": {"more": ["C'est le meilleur livre que j'<b>aie</b> jamais lu.", "Elle est la seule qui <b>puisse</b> répondre."], "expl": "Après un superlatif ou « le seul, le premier, le dernier », le subjonctif exprime une appréciation subjective. L'indicatif est possible pour un fait objectif."}, "Il est probable que / il est possible que": {"more": ["<b>Il est probable qu'</b>il <b>viendra</b>.", "<b>Il est peu probable qu'</b>il <b>vienne</b>."], "expl": "« Probable » à l'affirmative prend l'indicatif. À la négative ou avec « peu », il bascule vers le subjonctif, comme « possible »."}, "Sans doute / peut-être + inversion": {"more": ["<b>Peut-être faut-il</b> revoir notre méthode.", "<b>Sans doute est-ce</b> la meilleure solution."], "expl": "En tête de phrase, ces adverbes entraînent l'inversion. Alternative orale : « peut-être qu'il faut »."}, "Il y a fort à parier que": {"more": ["<b>Il y a fort à parier qu'</b>il démissionnera.", "<b>Il y a fort à parier que</b> les prix augmenteront."], "expl": "Exprime une forte probabilité avec un registre soutenu. Indicatif, souvent au futur."}, "À mon sens / selon moi": {"more": ["<b>À mon sens</b>, la culture doit rester accessible.", "<b>À mes yeux</b>, ce débat est essentiel."], "expl": "Introduit une opinion personnelle de façon élégante. Évitez de répéter « je pense que » : variez avec ces formules."}, "Il me semble que": {"more": ["<b>Il me semble que</b> vous avez oublié un point.", "<b>Il me paraît</b> évident <b>que</b> la situation doit changer."], "expl": "Opinion atténuée, polie. « Il me semble que » prend l'indicatif. Utile pour contredire le jury avec tact."}, "Je ne suis pas convaincu(e) que": {"more": ["<b>Je doute que</b> cette loi <b>soit</b> efficace.", "<b>Je ne suis pas certain que</b> tout le monde <b>ait compris</b>."], "expl": "Le doute et l'incertitude entraînent le subjonctif. À l'affirmative (« je suis certain que »), on revient à l'indicatif."}, "Je partage l'avis de": {"more": ["<b>Je rejoins l'auteur</b> sur ce point.", "<b>Je ne partage pas du tout cet avis</b>, car…"], "expl": "Situe sa position par rapport à celle d'un document ou du jury. Indispensable dans l'essai et le débat."}, "Il est légitime de se demander si": {"more": ["<b>On peut légitimement se demander si</b> ce progrès est souhaitable.", "<b>Il est permis de s'interroger sur</b> l'efficacité de cette mesure."], "expl": "Introduit une question critique avec prudence. Idéal pour une problématique ou une ouverture."}, "Autrement dit / en d'autres termes": {"more": ["Il est parti sans payer, <b>autrement dit</b> il a volé.", "Le pays importe plus qu'il n'exporte ; <b>en d'autres termes</b>, sa balance commerciale est déficitaire."], "expl": "Reformule pour clarifier ou simplifier. Montre au jury que vous maîtrisez votre propos."}, "Ce qui revient à dire que": {"more": ["Supprimer ce cours <b>reviendrait à</b> priver les élèves d'une ouverture.", "Il refuse de répondre, <b>ce qui revient à</b> admettre sa faute."], "expl": "Montre l'équivalence logique entre deux idées. « Revenir à » + nom ou infinitif."}, "Pour ainsi dire": {"more": ["Elle est, <b>pour ainsi dire</b>, la mémoire de l'entreprise.", "Le village est <b>pour ainsi dire</b> désert en hiver."], "expl": "Atténue une formule un peu forte ou imagée. Équivaut à « en quelque sorte »."}, "Du moins": {"more": ["Il viendra demain, <b>du moins</b> c'est ce qu'il a dit.", "<b>Du moins</b> faut-il essayer."], "expl": "Restreint ou corrige ce qui précède. En tête de phrase, « du moins » peut entraîner l'inversion."}, "Prenons l'exemple de": {"more": ["<b>Prenons le cas de</b> l'Allemagne, qui a misé sur l'apprentissage.", "<b>Si l'on prend l'exemple des</b> transports, la situation est similaire."], "expl": "Passe d'une idée à un exemple concret. Un bon exposé alterne idée générale et exemple."}, "C'est notamment le cas de": {"more": ["Certaines villes réduisent la voiture. <b>C'est notamment le cas d'</b>Amsterdam.", "Plusieurs langues sont menacées ; <b>c'est en particulier le cas du</b> breton."], "expl": "Illustre une affirmation par un cas précis. Évite la répétition de « par exemple »."}, "En témoigne + nom (inversion)": {"more": ["<b>En témoignent</b> les nombreuses manifestations.", "La crise est profonde. <b>En attestent</b> les chiffres du chômage."], "expl": "Verbe en tête et sujet inversé : le verbe s'accorde avec le nom qui suit. « En attester » est une variante."}, "À titre d'exemple": {"more": ["<b>À titre d'exemple</b>, Paris compte 1 800 km de pistes cyclables.", "<b>À titre indicatif</b>, le billet coûte environ 20 euros."], "expl": "« À titre d'exemple » introduit une illustration chiffrée. « À titre indicatif » signale une donnée approximative."}, "Il faut que / il est essentiel que": {"more": ["<b>Il est urgent que</b> nous <b>agissions</b>.", "<b>Il est nécessaire que</b> chacun <b>fasse</b> un effort."], "expl": "Les expressions de nécessité, d'obligation et d'urgence imposent le subjonctif. Même sujet général : « il faut / il est urgent de » + infinitif."}, "Sentiments + subjonctif": {"more": ["<b>Je suis ravi que</b> vous <b>soyez</b> venus.", "<b>Il est dommage qu'</b>il <b>ait refusé</b>."], "expl": "Joie, regret, peur, surprise : subjonctif. Même sujet : « je suis ravi d'être venu »."}, "Penser que / ne pas penser que": {"more": ["<b>Je crois qu'</b>il <b>a</b> raison.", "<b>Crois-tu qu'</b>il <b>ait</b> raison ?"], "expl": "Verbes d'opinion : indicatif à l'affirmative, subjonctif à la négative ou à l'interrogative par inversion (doute)."}, "Le fait que": {"more": ["<b>Le fait qu'</b>elle <b>soit</b> absente m'inquiète.", "<b>Du fait que</b> les prix <b>augmentent</b>, la demande baisse."], "expl": "« Le fait que » sujet ou complément : subjonctif fréquent. « Du fait que » (cause) prend l'indicatif."}, "Subjonctif passé": {"more": ["Je suis content que tu <b>aies réussi</b>.", "Il est parti avant que nous <b>ayons pu</b> lui parler."], "expl": "Subjonctif passé : l'action de la subordonnée est antérieure. Formé avec « avoir » ou « être » au subjonctif + participe passé."}, "Relative au subjonctif": {"more": ["Je cherche un logement qui <b>soit</b> proche du centre.", "Connaissez-vous quelqu'un qui <b>puisse</b> m'aider ?"], "expl": "Le subjonctif dans la relative indique qu'on ne sait pas si cela existe. Avec l'indicatif, l'existence est certaine."}, "Subjonctif de souhait en tête": {"more": ["<b>Qu'</b>il <b>entre</b> !", "<b>Vive</b> la République !"], "expl": "Ordre ou souhait à la 3e personne. Quelques formules sont figées sans « que » : « vive », « soit »."}, "Ne… guère": {"more": ["Il <b>ne</b> parle <b>guère</b> de son passé.", "Ce film <b>n'</b>a <b>guère</b> eu de succès."], "expl": "« Guère » = « pas beaucoup, presque pas ». Négation soutenue qui enrichit immédiatement le registre."}, "Ne… nullement / aucunement": {"more": ["Je <b>ne</b> suis <b>nullement</b> responsable.", "Il <b>ne</b> souhaite <b>aucunement</b> démissionner."], "expl": "Négation catégorique et emphatique. Plus formelle que « pas du tout »."}, "Ni… ni…": {"more": ["Il <b>ne</b> boit <b>ni</b> alcool <b>ni</b> café.", "<b>Ni</b> le ministre <b>ni</b> son conseiller n'ont répondu."], "expl": "Double négation sans « pas ». Avec deux sujets, le verbe est généralement au pluriel."}, "Sans que + subjonctif": {"more": ["Il est parti <b>sans qu'</b>on le <b>voie</b>.", "Elle a réussi <b>sans</b> être aidée."], "expl": "« Sans que » + subjonctif avec un sujet différent. Même sujet : « sans » + infinitif."}, "Ne seul (sans pas)": {"more": ["Je <b>ne sais</b> que dire.", "Il <b>n'ose</b> lui avouer la vérité."], "expl": "Avec « savoir, pouvoir, oser, cesser », le « pas » peut être omis à l'écrit littéraire. Effet élégant, à doser."}, "Non sans": {"more": ["Elle a accepté, <b>non sans</b> hésiter.", "Il est parti <b>non sans</b> regrets."], "expl": "« Non sans » = avec. La double négation exprime une affirmation nuancée."}, "Pas le moins du monde": {"more": ["Je ne suis <b>pas le moins du monde</b> surpris.", "Cela ne le dérange <b>pas le moins du monde</b>."], "expl": "Négation emphatique : « pas du tout ». Registre soutenu, convient à l'oral face au jury."}, "Dont": {"more": ["Voici le livre <b>dont</b> je t'ai parlé.", "C'est une ville <b>dont</b> les habitants sont accueillants."], "expl": "« Dont » remplace un complément introduit par « de » : verbe, nom ou adjectif. Ne jamais l'associer à « en » dans la même relative."}, "Lequel / auquel / duquel": {"more": ["C'est la raison <b>pour laquelle</b> je suis venu.", "Le projet <b>auquel</b> je travaille est ambitieux."], "expl": "Relatif composé après une préposition. Contraction obligatoire : à + lequel = auquel, de + lequel = duquel."}, "Ce qui / ce que / ce dont": {"more": ["Dis-moi <b>ce dont</b> tu as besoin.", "Il a fait <b>ce qu'</b>on lui demandait."], "expl": "Relatifs sans antécédent : ils reprennent une idée générale. Le choix dépend de la construction du verbe."}, "Où (temps et lieu)": {"more": ["Le jour <b>où</b> je l'ai rencontré, il pleuvait.", "À l'époque <b>où</b> j'étais étudiant, tout était plus simple."], "expl": "« Où » s'emploie pour le temps comme pour le lieu. Erreur fréquente : « le jour que »."}, "Préposition + quoi": {"more": ["Il ne sait pas <b>à quoi</b> il pense.", "Prends ce livre, <b>sans quoi</b> tu l'oublieras."], "expl": "« Quoi » après une préposition reprend une chose ou une idée, jamais une personne. « Sans quoi » = sinon."}, "Gérondif de manière": {"more": ["Il a appris l'anglais <b>en regardant</b> des séries.", "<b>En arrivant</b>, j'ai vu le désordre."], "expl": "Le gérondif exprime la manière ou la simultanéité. Toujours le même sujet que la principale."}, "Participe présent cause": {"more": ["<b>Ne sachant</b> pas quoi répondre, il s'est tu.", "<b>Étant</b> malade, elle n'est pas venue."], "expl": "Le participe présent en tête exprime souvent la cause. Style écrit. Le sujet doit être celui de la principale."}, "Proposition participiale": {"more": ["<b>La nuit tombée</b>, les rues se vident.", "<b>Le délai expiré</b>, la candidature n'est plus acceptée."], "expl": "Le participe a son propre sujet. Exprime le temps ou la cause de façon très concise."}, "Tout en + participe présent": {"more": ["Il écoutait la radio <b>tout en</b> cuisinant.", "<b>Tout en</b> reconnaissant ses qualités, je reste réservé."], "expl": "« Tout en » renforce le gérondif : simultanéité, souvent avec une nuance d'opposition."}, "Une fois + participe passé": {"more": ["<b>Une fois</b> le travail <b>terminé</b>, nous sortirons.", "<b>Une fois</b> la décision <b>prise</b>, il n'a plus hésité."], "expl": "L'action est achevée avant la suivante. Participe passé accordé avec le nom."}, "Verbe → nom": {"more": ["Les prix ont baissé → <b>la baisse</b> des prix.", "On a réformé l'école → <b>la réforme</b> de l'école."], "expl": "Nominaliser permet de condenser et de reformuler sans copier le texte. Indispensable pour la synthèse."}, "Phrase → groupe nominal": {"more": ["Parce que le chômage augmente, les jeunes partent → <b>La hausse du chômage</b> pousse les jeunes au départ.", "Les gens consomment moins, donc les commerces ferment → <b>La baisse de la consommation</b> entraîne la fermeture des commerces."], "expl": "Transformer une proposition en groupe nominal donne un style dense et professionnel. Associez-le à des verbes comme « entraîner, provoquer, favoriser »."}, "Titre nominal": {"more": ["<b>Hausse</b> des loyers : <b>les étudiants</b> en difficulté.", "<b>Réforme</b> des retraites : <b>mobilisation</b> massive."], "expl": "Style télégraphique des titres de presse. Le reconnaître aide à comprendre les documents de l'épreuve."}, "Selon / d'après": {"more": ["<b>Selon</b> le premier document, la lecture recule.", "<b>D'après</b> les experts, la croissance repartira."], "expl": "Attribue une information à sa source sans la prendre à son compte. Essentiel dans la synthèse, où l'on ne donne pas son avis."}, "Conditionnel journalistique": {"more": ["Le ministre <b>aurait démissionné</b> hier soir.", "Selon la police, l'incendie <b>serait</b> d'origine criminelle."], "expl": "Le conditionnel signale une information non confirmée. Très fréquent dans la presse et dans les documents d'écoute."}, "Concordance des temps": {"more": ["Elle m'a dit qu'elle <b>viendrait</b> le lendemain.", "Il a expliqué qu'il <b>avait perdu</b> ses clés."], "expl": "Au discours indirect au passé : présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel."}, "Interrogation indirecte": {"more": ["Je me demande <b>s'</b>il viendra.", "Il voulait savoir <b>ce que</b> nous en pensions."], "expl": "L'interrogation indirecte supprime l'inversion et « est-ce que ». « Qu'est-ce que » devient « ce que »."}, "Dont l'auteur souligne…": {"more": ["Le second article, <b>dont l'auteur est</b> économiste, adopte un point de vue différent.", "L'étude, <b>dont les conclusions</b> sont alarmantes, a été publiée hier."], "expl": "La relative avec « dont » permet d'intégrer une information sur un document sans faire une nouvelle phrase."}, "Tandis que l'un…, l'autre…": {"more": ["<b>Alors que</b> le premier texte dénonce les écrans, <b>le second</b> en souligne les atouts.", "<b>Si</b> les deux documents s'accordent sur le constat, ils divergent sur les solutions."], "expl": "Confronter les documents au lieu de les résumer l'un après l'autre : c'est exactement ce que demande la consigne de la synthèse."}, "À l'heure où": {"more": ["<b>À l'heure où</b> les fake news se multiplient, l'éducation aux médias devient vitale.", "<b>À l'heure où</b> l'on parle de sobriété, la publicité incite à consommer."], "expl": "Accroche qui ancre le sujet dans l'actualité et crée souvent un paradoxe. Idéale pour la première phrase d'un exposé."}, "Il convient de / il s'agit de": {"more": ["<b>Il s'agit</b> ici <b>de</b> déterminer si le télétravail est durable.", "<b>Il convient de</b> distinguer deux types de pollution."], "expl": "Formules impersonnelles pour annoncer une démarche. « Il s'agit de » est invariable : jamais « ils s'agissent »."}, "Au terme de cette réflexion": {"more": ["<b>Au terme de</b> cette analyse, une conclusion s'impose.", "<b>En définitive</b>, la question reste ouverte."], "expl": "Marque le début de la conclusion. Le jury repère ainsi clairement la structure de l'exposé."}, "Accroche par un chiffre": {"more": ["<b>Chaque année</b>, dix millions de tonnes de nourriture sont gaspillées en France.", "<b>Près d'un</b> Français <b>sur deux</b> ne lit plus de livres."], "expl": "Un chiffre en ouverture capte l'attention. Citer la source si elle figure dans les documents."}, "Annonce du plan": {"more": ["<b>Nous verrons d'abord</b>… <b>puis</b>… <b>avant de</b>…", "<b>Mon exposé s'articulera autour de</b> deux axes."], "expl": "Le jury attend une annonce de plan claire. Deux ou trois parties suffisent."}, "Transition": {"more": ["<b>Si</b> les causes sont claires, <b>qu'en est-il des</b> solutions ?", "<b>Venons-en maintenant à</b> la deuxième partie."], "expl": "La transition résume la partie précédente et annonce la suivante. Elle montre que l'exposé est construit."}, "Ouverture finale": {"more": ["<b>On peut dès lors se demander si</b> l'école peut tout réparer.", "<b>Il serait intéressant de</b> s'interroger sur le rôle des parents."], "expl": "L'ouverture élargit le sujet vers une question voisine. Elle termine sur une note de réflexion."}, "Problématique double": {"more": ["<b>En quoi</b> le numérique transforme-t-il l'école ?", "<b>Dans quelle mesure</b> peut-on concilier croissance et écologie ?"], "expl": "Ces formulations appellent une réponse nuancée, jamais un simple oui ou non. Inversion du sujet dans la question."}, "Position nuancée": {"more": ["<b>S'il est vrai que</b> la mondialisation enrichit, elle <b>n'en</b> crée <b>pas moins</b> des inégalités.", "<b>Sans nier</b> les progrès réalisés, il reste beaucoup à faire."], "expl": "Une conclusion nuancée reconnaît les deux côtés avant de trancher. C'est ce que le jury attend au C1."}, "Si je vous comprends bien": {"more": ["<b>Si j'ai bien compris votre question</b>, vous voulez savoir si…", "<b>Vous voulez dire que</b>… ?"], "expl": "Reformuler la question du jury gagne du temps de réflexion et évite les malentendus."}, "Je me permets de nuancer": {"more": ["<b>Je nuancerais un peu ce propos</b> : …", "<b>Je ne suis pas tout à fait d'accord</b>, dans la mesure où…"], "expl": "Contredire poliment, avec des arguments, est valorisé. Le jury teste aussi votre capacité à défendre votre position."}, "Vous avez raison de souligner que… toutefois": {"more": ["<b>C'est un point très juste ; cela dit</b>, …", "<b>Je vous accorde que</b> le coût est élevé, <b>mais</b>…"], "expl": "Concéder un point au jury puis réaffirmer son idée : la structure « certes… mais » transposée à l'oral."}, "Pour rebondir sur ce que vous dites": {"more": ["<b>Pour revenir à ce que vous disiez</b>, …", "<b>Cela me fait penser à</b> un autre exemple…"], "expl": "Relier sa réponse aux propos du jury montre une vraie interaction, pas un monologue récité."}, "C'est une question délicate": {"more": ["<b>C'est une excellente question</b>, laissez-moi réfléchir un instant.", "<b>Je n'y avais pas pensé</b>, mais je dirais que…"], "expl": "Admettre qu'une question est difficile est acceptable. Le silence total ne l'est pas : ces formules remplissent la pause."}};
const EN = {"Avoir beau + infinitif": ["Means \"even if / however much\". Michel Serres uses it in the official DALF C1 demo paper.", "« Avoir beau » expresses an effort that gets no result. The main clause usually follows directly, without « mais ». « Avoir » carries the tense and person; the infinitive never changes."], "Bien que / quoique + subjonctif": ["Never the indicative after « bien que ». « Quoique » is slightly more formal.", "Concession: you admit a real fact that doesn't prevent the other one. « Bien que » and « quoique » always take the subjunctive, even when the fact is certain. With the same subject you can shorten: « bien que fatigué, il continue »."], "Quel(le)(s) que soit / soient": ["« Quel » agrees with the noun. Don't confuse it with « quelque… que » before an adjective.", "Means \"whatever / regardless of the…\". « Quel » is an adjective that agrees with the subject of « être », which comes after it. Don't confuse with « quelque… que », which comes before a noun or adjective."], "Si / aussi + adjectif + que + subjonctif": ["With « aussi » at the start, the subject can be inverted: « Aussi séduisante soit-elle… ».", "The concession is about the degree of a quality: \"however + adjective\". « Aussi surprenant que cela paraisse » (\"surprising as it may seem\") is a fixed phrase, very useful when speaking."], "Certes… il n'en reste pas moins que": ["The classic pivot of an argumentative paragraph, written or spoken.", "You first concede the opposing argument, then state your own position. This is the basic move of any nuanced paragraph, expected at C1."], "Toujours est-il que": ["Brings the discussion back to the essential fact.", "Sets aside a side debate to return to an undeniable fact. Equivalent to \"anyway, what's certain is that…\"."], "Pour autant": ["Means \"even so / that doesn't mean\". Examiners love it.", "« Pour autant » means \"for all that, even so\". It's almost always used in a negative or interrogative sentence, to qualify an expected consequence."], "Même si + indicatif": ["Common mistake: « même si » is never followed by the subjunctive or the conditional.", "« Même si » works like « si »: present, imperfect or pluperfect. Never subjunctive or conditional right after it. With the imperfect, you get a hypothetical concession."], "Malgré / en dépit de + nom": ["Avoid « malgré que » in formal writing; use « bien que » instead.", "Concession followed by a noun. « En dépit de » is more formal than « malgré ». With a verb, use « bien que » or « malgré le fait que »."], "Avoir beau… il n'empêche que": ["More spoken variant: « n'empêche que ».", "Means \"even so, that doesn't change the fact that\". Followed by the indicative. More natural in speech than in formal writing."], "Tout + adjectif / nom + que": ["Concession about a quality. « Tout » agrees before a feminine adjective starting with a consonant.", "A concession stressing a quality: \"experienced as they are…\". « Tout » only changes form before a feminine adjective starting with a consonant or aspirated « h »."], "Quelque + adjectif + que": ["« Quelque » is invariable before an adjective (it means « si »).", "Before an adjective, « quelque » is invariable (= however). Before a noun, it agrees (= whatever … that). Very formal register, valued at C2."], "Où que / qui que / quoi que": ["Don't confuse it with « quoique » (= although) written as one word.", "Concession about place, person or thing: \"wherever / whoever / whatever\". Always followed by the subjunctive."], "Il est vrai que… mais": ["A flexible way to concede before refuting.", "A phrase to acknowledge an argument before going beyond it. Formal variant of « c'est vrai que ». Vary the second connector: mais, cependant, néanmoins."], "Pour + adjectif + que": ["Literary equivalent of « si… que ».", "Literary variant of « si… que ». It instantly sounds formal. Keep it for writing or the conclusion of a presentation."], "Avoir beau à tous les temps": ["« Avoir » takes whatever tense you need: « il aura beau », « il avait beau ».", "« Avoir beau » works in every tense: the concession follows the tense of the sentence. The future announces that a coming effort will be useless."], "Loin de + infinitif": ["The subject of the infinitive must be the subject of the main clause.", "Expresses the opposite of what was expected: \"far from… it's actually the reverse\". Very effective for refuting a common belief in one sentence."], "Autant… autant…": ["Balances two observations with a symmetrical effect.", "Contrasts two ideas in a balanced way. Both clauses must have the same structure. No « que » between them."], "Alors que / tandis que": ["Contrasts two simultaneous facts.", "« Alors que » contrasts two facts; it can also express time. « Tandis que » stresses that the contrast happens at the same time. Both take the indicative."], "Au lieu de + infinitif": ["Presents a preferable alternative.", "Contrasts what is done with what should or could be done. The subject of the infinitive is the subject of the main clause."], "Contrairement à": ["Very useful for refuting a common belief in an introduction.", "Introduces a direct contrast with a person or an idea. Very useful in an introduction to challenge a common belief."], "À l'inverse / à l'opposé": ["Contrast between two examples.", "A connector contrasting two examples or trends. More formal than « par contre », which you should avoid in formal writing."], "Si… en revanche": ["Here « si » isn't hypothetical: it contrasts.", "The « si » isn't conditional: it means \"while it's true that\". The structure weighs two observations against each other."], "Tant… que…": ["An elegant way to link two areas.", "Equivalent to \"both… and…\". Both elements must be the same grammatical type."], "Dans la mesure où": ["Cause presented as a logical condition. More formal than « parce que ».", "Two meanings: cause (\"since\") or proportion (\"as far as\"). Context tells you which. Always the indicative."], "Faute de + nom / infinitif": ["Negative cause: the absence of something explains the result.", "Explains a failure by a lack of something: \"for lack of\". No article before the noun. « Faute de quoi » means \"otherwise\"."], "D'autant (plus) que": ["Adds a cause that strengthens the first one.", "Adds a reason that reinforces the previous one: \"all the more so because\". « D'autant que » alone is slightly more spoken."], "Sous prétexte que": ["The cause is presented as false or questionable.", "The speaker doubts the reason given: \"on the pretext that\". Very useful to show critical thinking in an essay."], "Participe passé composé": ["Expresses cause plus something that happened before. Written, formal style.", "Cause and prior action in one compact structure. The subject of the participle must be the subject of the main clause, otherwise the sentence is wrong."], "Puisque": ["A cause the listener already knows, presented as obvious.", "Cause presented as known or obvious to both speakers: \"since\". Don't use it to bring new information."], "Étant donné que / vu que": ["« Vu que » is more spoken.", "Objective, observable cause: \"given that\". « Étant donné » can also come before a noun: « étant donné les circonstances »."], "Du fait de / en raison de": ["Neutral, administrative register, perfect for writing.", "Neutral cause, with no positive or negative judgment: \"due to / because of\". Written, administrative or journalistic style."], "Grâce à / à cause de": ["Don't say « grâce à la crise »: the cause is negative.", "« Grâce à » for a cause with a good result (\"thanks to\"), « à cause de » for a bad result (\"because of\"). Common mistake: « grâce à la crise »."], "Non que… mais": ["Rules out a false cause before giving the real one.", "Rules out a possible cause (in the subjunctive) before giving the real one (in the indicative): \"not that…, but…\". A sign of great argumentative finesse."], "Comme + cause en tête": ["Causal « comme » always comes at the start of the sentence.", "Causal « comme » (\"as / since\") always starts the sentence and puts the cause before the consequence. Mid-sentence, use « parce que »."], "À force de": ["A repeated cause that gradually produces an effect.", "A repeated or intense cause that eventually produces an effect: \"by dint of / through constant…\". The result can be positive or negative."], "Tant (cause intensive)": ["« Tant » mid-sentence introduces an intensive cause.", "« Tant » after a clause introduces an intensive cause: \"so much did…\". Same as « tellement… que » but in reverse order."], "Si bien que": ["Always followed by the indicative, unlike « de sorte que » expressing purpose.", "A real, observed consequence: \"so that / with the result that\". Always indicative. More formal than « donc » or « alors »."], "D'où + nom": ["Very economical: a consequence without a verb.", "A consequence as a noun, with no verb: \"hence\". Very effective for condensing an idea in the synthesis."], "Au point de / au point que": ["A consequence linked to intensity.", "Consequence of an extreme degree: \"to the point of / so much that\". « Au point de » + infinitive when the subject is the same."], "Tellement / si … que": ["A consequence linked to intensity.", "Intensity (adjective or adverb) leading to a consequence: \"so… that\". « Tellement » is more spoken than « si »."], "Tant de / tellement de … que": ["Intensity about a quantity.", "Intensity about a quantity (with a noun): \"so much / so many… that\". Don't forget the « de »."], "De sorte que + indicatif": ["With the indicative: real consequence. With the subjunctive: purpose.", "With the indicative, the consequence is real (\"so that, as a result\"). Compare with purpose: « parle fort de sorte qu'on t'entende » (subjunctive)."], "C'est pourquoi / c'est la raison pour laquelle": ["More formal than « donc ».", "Introduces a consequence while clearly recalling the cause: \"that's why\". « C'est la raison pour laquelle » is more formal."], "Aussi + inversion": ["« Aussi » at the start forces inversion: an instant C2 marker in writing.", "« Aussi » at the start means \"therefore\" and requires subject inversion. With a noun subject, keep the noun and add an inverted pronoun."], "Par voie de conséquence": ["Very formal, useful in the synthesis.", "Formal, logical phrase common in administrative and legal texts: \"consequently\". It adds rigour to your reasoning."], "Assez / trop … pour que": ["Negative consequence: what cannot happen.", "« Trop… pour que »: the consequence doesn't happen (\"too… for\"). « Assez… pour que »: it does (\"enough… for\"). Subjunctive required."], "À supposer que / en admettant que": ["A hypothesis considered without fully believing it.", "A hypothesis considered for the sake of argument, without necessarily believing it: \"supposing that\". Always subjunctive."], "Au cas où + conditionnel": ["Common trap: conditional, not subjunctive.", "Plans for a possibility: \"in case\". Conditional is required after « au cas où », never the subjunctive."], "Pour peu que + subjonctif": ["\"All it takes is…\". A minimal condition.", "\"If only a little…\": a minimal condition that is enough to produce the effect. Subjunctive."], "Quand bien même + conditionnel": ["Hypothesis and concession at once: \"even if\".", "A concessive hypothesis: \"even if / even in the case that\". Conditional in both clauses."], "Inversion : dût-il": ["Fixed imperfect subjunctive. Very formal, mainly written.", "Inverted imperfect subjunctive of « devoir ». Means \"even if I / she had to\". Using it once, well placed, impresses the examiner."], "Si + plus-que-parfait": ["Regret or reproach about the past. Never the conditional after « si ».", "Hypothesis about the past that didn't happen (third conditional). Expresses regret or reproach. Never the conditional after « si »."], "Si + plus-que-parfait, conditionnel présent": ["Past condition, present consequence.", "Condition in the past, consequence visible now (mixed conditional). Very useful for analysing the effects of a past decision."], "À condition que / pourvu que": ["« À condition de + infinitive » when the subject is the same.", "« À condition que » sets a necessary condition (\"provided that\"). « Pourvu que » can also express a wish at the start of a sentence (\"let's hope\"). Subjunctive."], "À moins que (ne)": ["Expresses a negative condition: \"unless\".", "Means \"unless\". The expletive « ne » is optional but formal. « À moins de » + infinitive when the subject is the same."], "En cas de + nom": ["Noun version of « au cas où ».", "A hypothesis as a noun (\"in case of\"), very common in instructions and official texts. No article."], "Gérondif hypothétique": ["A hypothesis without « si », very smooth when speaking.", "The gerund replaces \"if we…\". It makes the sentence smoother and avoids repeating « si »."], "Sans + nom, + conditionnel passé": ["Implicit hypothesis: \"if there hadn't been\".", "Implicit hypothesis: \"without / if it hadn't been for\". With the present conditional, the hypothesis is about the present."], "Que… ou que…": ["Alternative hypotheses: the result stays the same.", "Two hypotheses with the same outcome: \"whether… or…\". Subjunctive in both."], "Inversion hypothétique": ["Very literary: means \"even if he were right\".", "Literary inversion replacing « même si ». Very rare in speech; keep it for very formal writing."], "Selon que… ou que": ["Echoes La Fontaine. Expresses alternative conditions.", "Expresses a variation depending on two cases: \"depending on whether… or…\". Indicative. An elegant replacement for « en fonction de si »."], "De peur que / de crainte que (ne)": ["The expletive « ne » isn't a negation. It marks a formal register.", "Negative purpose: you act to avoid something (\"for fear that\"). « De peur de » + infinitive when the subject is the same."], "De sorte que + subjonctif": ["With the indicative, « de sorte que » expresses consequence.", "With the subjunctive, « de sorte que » expresses purpose (\"so that\"). With the indicative, consequence: the mood changes the meaning."], "Pour que / afin que": ["Same subject: « afin de + infinitive ».", "Purpose with a different subject: subjunctive. Same subject: « pour / afin de » + infinitive. « Afin que » is more formal."], "En vue de": ["Administrative, formal register.", "Planned, often long-term purpose: \"with a view to\". Administrative register."], "Dans le but de / dans l'optique de": ["Varying how you introduce purpose enriches your writing.", "More ways to express purpose: \"with the aim of / with a view to\". « Dans l'optique de » sounds more modern and professional."], "De manière à / de façon à": ["Purpose presented as a way of acting.", "Purpose achieved through a way of acting: \"so as to\". « De manière que / de façon que » + subjunctive if the subject changes."], "Histoire de (oral)": ["Informal speech only: avoid in writing.", "Informal phrase (\"just to…\"). It shows good understanding of spoken French, but ban it from writing and the formal presentation."], "Plus… plus / moins… moins": ["Proportion: no article before « plus ».", "Proportion: both things change together (\"the more… the more\"). No article, no « que ». You can also mix: « plus… moins »."], "D'autant plus… que": ["Comparison and cause at the same time.", "Compares while explaining: the quality is reinforced by the cause that follows (\"all the more… because\"). Highly valued at C1."], "De même que… de même": ["A parallel between two ideas.", "Draws a parallel between two realities: \"just as…\". Ideal for introducing an analogy in a presentation."], "Ainsi que / à l'instar de": ["More formal than « comme ».", "« À l'instar de » = \"following the example of, like\". With « ainsi que », the verb often agrees with the first subject."], "Autant que je sache": ["« Autant que je sache »: fixed phrase in the subjunctive.", "Fixed phrase expressing caution: \"as far as I know\". Not followed by « que »."], "Tel… tel": ["Proverb-like structure; use sparingly.", "« Tel » expresses identity or comparison (\"like… like…\"). « Tel est / Telle est » at the start of a sentence is a formal way to conclude."], "Comme si + imparfait": ["Hypothetical comparison: never the conditional.", "Comparison with an imaginary situation: \"as if\". Imperfect or pluperfect, never the conditional. « Comme si de rien n'était » (\"as if nothing had happened\") is fixed."], "Dès que / aussitôt que": ["In French, use the future after « dès que » if the action is in the future.", "Immediately after: \"as soon as\". For a future action French keeps the future after « dès que », unlike English."], "Avant que (ne) + subjonctif": ["« Après que » takes the indicative, despite common incorrect usage.", "The subjunctive is required after « avant que » (\"before\"). Same subject: « avant de » + infinitive."], "Après que + indicatif": ["A prescriptive rule examiners appreciate.", "The norm requires the indicative after « après que », because the action really happened. Same subject: « après » + past infinitive."], "Depuis que / il y a… que": ["A duration that continues into the present.", "A duration lasting up to now (\"for / since\"): present tense, not the passé composé."], "Au fur et à mesure que": ["Two actions progressing in parallel.", "Two actions progress together: \"as / progressively as\". It can also stand alone: « je range au fur et à mesure »."], "À peine… que (inversion)": ["Inversion required after « à peine » at the start.", "Two actions in very quick succession: \"hardly had… when\". Inversion required after « à peine » at the start, then « que »."], "Sitôt + participe passé": ["Very formal: « aussitôt que l'accord fut signé ».", "Condensed literary version of « dès que »: \"as soon as…\". « Sitôt dit, sitôt fait » (\"no sooner said than done\") is fixed."], "Tant que / jusqu'à ce que": ["« Tant que » takes the indicative.", "« Jusqu'à ce que » marks a limit (\"until\") and takes the subjunctive. « Tant que » marks a simultaneous duration (\"as long as\") and takes the indicative."], "Ne… que": ["Restriction: \"only\". More elegant in writing.", "A more elegant restriction than « seulement » (\"only\"). The « que » goes right before the restricted element."], "Sauf / excepté / hormis": ["« Hormis » is the most formal of the three.", "Excludes one element from a group: \"except\". « Hormis » is the most formal; « excepté » agrees when placed after the noun."], "Si ce n'est": ["Restriction after a negation.", "Restriction after a negation: \"except, other than\". Very common in formal writing."], "Pour ce qui est de / quant à": ["A smooth change of topic in a synthesis.", "Moves from one topic to another: \"as for / regarding\". « Quant à » contracts: quant au, quant aux."], "Tout au plus / à tout le moins": ["\"At the very least\", very formal.", "« Tout au plus » sets a maximum (\"at most\"). « À tout le moins » sets a minimum (\"at the very least\"), often to express a reproach."], "Ce qui…, c'est…": ["Puts the key information at the end, where attention is highest.", "Highlights the final element: \"what matters is…\". « Ce qui » when the verb needs a subject, « ce que » when it needs an object."], "Non seulement…, mais encore": ["Gradation: the second element is the stronger one.", "Adds while stressing the second element: \"not only… but also\". Both elements must be the same grammatical type."], "Encore faut-il que": ["Inversion required after « encore » at the start.", "Adds a condition that qualifies what came before: \"but still, it remains to…\". Inversion required. A typical C2 structure."], "Ne serait-ce que": ["\"If only / even just\": the minimal argument is already enough.", "\"Even if it's only…\". Presents a minimum that is enough. Fixed in the conditional."], "C'est… qui / c'est… que": ["The basic tool for emphasis when speaking.", "Basic emphasis (\"it's… who / that\"). Watch the agreement: after « qui », the verb agrees with the highlighted element."], "Ce dont…, c'est": ["« Dont » for verbs built with « de ».", "For verbs built with « de » (avoir besoin de, parler de, avoir peur de). Common mistake: « ce que j'ai besoin »."], "Ce à quoi…, c'est": ["For verbs built with « à ».", "For verbs built with « à » (penser à, s'attendre à). The « à » can be repeated after « c'est »."], "Le problème, c'est que": ["Very effective in speech for ranking ideas.", "Announces the important idea: \"the problem is that…\". « L'essentiel, c'est que » takes the subjunctive because it expresses a wish."], "Dislocation": ["Typical spoken emphasis.", "Moves an element to the start or end of the sentence, then picks it up with a pronoun. Natural in speech; avoid in formal writing."], "Si… c'est (parce) que": ["Explains a cause starting from the consequence.", "Starts from an observed fact to explain it: \"if…, it's because…\". Very effective for structuring an analysis."], "Rien de tel que / il n'y a que": ["Emphasis by exclusion.", "« Rien de tel que »: nothing beats it. « Il n'y a que »: exclusivity, often with a hint of surprise (\"only you would…\")."], "Ni plus ni moins que": ["Stresses that a description is exact.", "Stresses that an (often strong) description is exact: \"nothing more, nothing less than\". Usually goes with « ne… »."], "Toujours est-il / reste que": ["Points out a problem that remains.", "« Reste que »: a difficulty remains (\"the fact remains that\"). « Reste à + infinitive »: what still needs to be done."], "Force est de constater que": ["Presents a conclusion as unavoidable. Ideal in a conclusion.", "You are forced to admit a fact, even reluctantly: \"one has to admit that\". An excellent concluding phrase."], "Il n'est pas exclu que": ["Expresses a possibility cautiously.", "Expresses a possibility cautiously (double negative): \"it can't be ruled out that\". Subjunctive required."], "Superlatif + subjonctif": ["After a superlative (le seul, le premier, le plus…), the subjunctive is the careful norm.", "After a superlative or « le seul, le premier, le dernier », the subjunctive expresses a subjective judgment. The indicative is possible for an objective fact."], "Il est probable que / il est possible que": ["Classic trap: « probable » takes the indicative, « possible » the subjunctive.", "Affirmative « probable » takes the indicative. In the negative or with « peu », it switches to the subjunctive, like « possible »."], "Sans doute / peut-être + inversion": ["Inversion after « sans doute » at the start is a C2 style marker.", "At the start of a sentence, these adverbs (\"probably / perhaps\") trigger inversion. Spoken alternative: « peut-être qu'il faut »."], "Il y a fort à parier que": ["Expresses strong probability.", "Expresses strong probability in a formal register: \"it's a safe bet that\". Indicative, often in the future."], "À mon sens / selon moi": ["Vary it: « à mes yeux », « de mon point de vue ».", "Introduces a personal opinion elegantly (\"in my view\"). Avoid repeating « je pense que »: vary with these phrases."], "Il me semble que": ["« Il semble que » (without « me ») tends to take the subjunctive.", "A softened, polite opinion: \"it seems to me that\". Takes the indicative. Useful for tactfully disagreeing with the jury."], "Je ne suis pas convaincu(e) que": ["Doubt switches to the subjunctive.", "Doubt and uncertainty trigger the subjunctive. In the affirmative (« je suis certain que »), you go back to the indicative."], "Je partage l'avis de": ["A nuanced stance, ideal for the essay.", "Positions you in relation to a document or the jury: \"I agree / disagree with…\". Essential in the essay and the discussion."], "Il est légitime de se demander si": ["Introduces a challenge tactfully.", "Raises a critical question cautiously: \"one may legitimately wonder whether\". Ideal for a research question or a closing opening."], "Autrement dit / en d'autres termes": ["Shows the jury you master your point by rephrasing it.", "Rephrases to clarify or simplify: \"in other words\". Shows the jury you're in control of what you're saying."], "Ce qui revient à dire que": ["Draws a consequence by rephrasing.", "Shows logical equivalence between two ideas: \"which amounts to saying\". « Revenir à » + noun or infinitive."], "Pour ainsi dire": ["Softens a slightly strong expression.", "Softens a strong or figurative phrase: \"so to speak\". Equivalent to « en quelque sorte »."], "Du moins": ["Corrects or narrows what was just said.", "Narrows or corrects what came before: \"at least\". At the start of a sentence, « du moins » can trigger inversion."], "Prenons l'exemple de": ["Introduces an example, spoken or written.", "Moves from an idea to a concrete example: \"let's take the example of\". A good presentation alternates general ideas and examples."], "C'est notamment le cas de": ["Moves from the general to the specific.", "Illustrates a statement with a specific case: \"this is notably the case of\". Avoids repeating « par exemple »."], "En témoigne + nom (inversion)": ["Elegant inversion: the verb agrees with the noun that follows.", "Verb first, inverted subject: the verb agrees with the following noun (\"as shown by…\"). « En attester » is a variant."], "À titre d'exemple": ["More formal than « par exemple ».", "« À titre d'exemple » introduces a numerical illustration (\"by way of example\"). « À titre indicatif » flags an approximate figure."], "Il faut que / il est essentiel que": ["Necessity: subjunctive required.", "Expressions of necessity, obligation and urgency require the subjunctive. General subject: « il faut / il est urgent de » + infinitive."], "Sentiments + subjonctif": ["Verbs of feeling take the subjunctive.", "Joy, regret, fear, surprise: subjunctive. Same subject: « je suis ravi d'être venu »."], "Penser que / ne pas penser que": ["Negation switches to the subjunctive.", "Verbs of opinion: indicative in the affirmative, subjunctive in the negative or in an inverted question (doubt)."], "Le fait que": ["Indicative possible if the fact is presented as certain.", "« Le fait que » as subject or object: often subjunctive. « Du fait que » (cause) takes the indicative."], "Subjonctif passé": ["Shows an earlier action inside a subjunctive clause.", "Past subjunctive: the action in the clause happened earlier. Formed with « avoir » or « être » in the subjunctive + past participle."], "Relative au subjonctif": ["The subjunctive expresses a desired quality, not yet real.", "The subjunctive in a relative clause shows you don't know whether it exists. With the indicative, it definitely exists."], "Subjonctif de souhait en tête": ["An oratorical turn, effective to end a spoken presentation.", "An order or wish in the third person (\"let him / may…\"). Some fixed phrases have no « que »: « vive », « soit »."], "Ne… guère": ["« Guère » = not much. Very formal.", "« Guère » = \"hardly, not much\". A formal negation that instantly lifts your register."], "Ne… nullement / aucunement": ["Categorical negation, stronger than « pas ».", "Categorical, emphatic negation: \"not in the least, by no means\". More formal than « pas du tout »."], "Ni… ni…": ["No « pas » with « ni… ni ».", "Double negation without « pas »: \"neither… nor\". With two subjects, the verb is usually plural."], "Sans que + subjonctif": ["Expletive « ne » tolerated but not required.", "« Sans que » + subjunctive with a different subject (\"without… -ing\"). Same subject: « sans » + infinitive."], "Ne seul (sans pas)": ["Literary negation without « pas » with a few verbs.", "With « savoir, pouvoir, oser, cesser », « pas » can be dropped in literary writing. An elegant effect, to use sparingly."], "Non sans": ["Double negation = nuanced affirmation.", "« Non sans » = \"not without\", i.e. with. The double negation expresses a nuanced affirmation."], "Pas le moins du monde": ["Emphatic negation, formal speech.", "Emphatic negation: \"not in the slightest\". Formal register, suitable when speaking to the jury."], "Dont": ["Replaces « de qui / duquel ». Essential at C1.", "« Dont » replaces a complement introduced by « de »: verb, noun or adjective (\"whose / of which / about which\"). Never combine it with « en » in the same clause."], "Lequel / auquel / duquel": ["The relative pronoun agrees with its antecedent.", "Compound relative after a preposition (\"which / whom\"). Required contractions: à + lequel = auquel, de + lequel = duquel."], "Ce qui / ce que / ce dont": ["Refers back to a whole idea, with no noun antecedent.", "Relatives with no antecedent (\"what\"): they refer to a general idea. The choice depends on how the verb is built."], "Où (temps et lieu)": ["« Où » also replaces a time complement.", "« Où » is used for time as well as place (\"when / where\"). Common mistake: « le jour que »."], "Préposition + quoi": ["« Quoi » refers to an idea, never a person.", "« Quoi » after a preposition refers to a thing or an idea, never a person. « Sans quoi » = \"otherwise\"."], "Gérondif de manière": ["The subject of the gerund must be that of the main verb.", "The gerund expresses manner or simultaneity (\"by / while -ing\"). Always the same subject as the main clause."], "Participe présent cause": ["Replaces « comme ils craignent ». Very written.", "A present participle at the start often expresses cause (\"not knowing…, being ill…\"). Written style. The subject must be that of the main clause."], "Proposition participiale": ["The participle has its own subject: concise, formal style.", "The participle has its own subject (\"night having fallen\"). Expresses time or cause very concisely."], "Tout en + participe présent": ["Simultaneity with a hint of contrast.", "« Tout en » strengthens the gerund: simultaneity, often with a hint of contrast (\"while also…\")."], "Une fois + participe passé": ["Immediately prior action.", "The action is completed before the next one: \"once…\". The past participle agrees with the noun."], "Verbe → nom": ["Nominalisation condenses information: essential in the synthesis.", "Turning verbs into nouns lets you condense and rephrase without copying the text. Essential for the synthesis."], "Phrase → groupe nominal": ["Replace « parce que » + clause with a noun: denser style.", "Turning a clause into a noun phrase gives a dense, professional style. Combine it with verbs like « entraîner, provoquer, favoriser »."], "Titre nominal": ["Newspaper headline style, useful for understanding the documents.", "The telegraphic style of press headlines. Recognising it helps you understand the exam documents."], "Selon / d'après": ["Essential in the synthesis to attribute an idea to a document.", "Attributes information to its source without endorsing it: \"according to\". Essential in the synthesis, where you don't give your opinion."], "Conditionnel journalistique": ["Signals caution about unconfirmed information.", "The conditional signals unconfirmed information (\"reportedly\"). Very common in the press and in listening documents."], "Concordance des temps": ["Present → imperfect, future → conditional when reporting in the past.", "In reported speech in the past: present → imperfect, passé composé → pluperfect, future → conditional."], "Interrogation indirecte": ["No inversion and no « est-ce que » in indirect questions.", "Indirect questions drop inversion and « est-ce que ». « Qu'est-ce que » becomes « ce que »."], "Dont l'auteur souligne…": ["Lets you merge two documents in the synthesis.", "A relative clause with « dont » lets you add information about a document without starting a new sentence."], "Tandis que l'un…, l'autre…": ["Key synthesis structure: compare the documents.", "Comparing the documents instead of summarising them one after the other is exactly what the synthesis instructions ask for."], "À l'heure où": ["A classic hook for an essay or presentation introduction.", "A hook that anchors the topic in current events and often creates a paradox: \"at a time when\". Ideal as the first sentence of a presentation."], "Il convient de / il s'agit de": ["Announces the plan or a step in the reasoning.", "Impersonal phrases to announce your approach: \"the point is to / it is appropriate to\". « Il s'agit de » never changes: never « ils s'agissent »."], "Au terme de cette réflexion": ["Opens the conclusion. Follow with a wider question.", "Marks the start of the conclusion (\"at the end of this analysis / ultimately\"). The jury clearly sees the structure of your presentation."], "Accroche par un chiffre": ["A statistic in the hook grabs the jury's attention immediately.", "A figure at the start grabs attention. Cite the source if it appears in the documents."], "Annonce du plan": ["The jury expects a clear outline when you speak.", "The jury expects a clear announcement of your outline. Two or three parts are enough."], "Transition": ["Links two parts: required in the presentation.", "A transition sums up the previous part and announces the next one. It shows your presentation is structured."], "Ouverture finale": ["The conclusion should open onto a new question.", "The closing question widens the topic to a related issue, ending on a reflective note."], "Problématique double": ["Ideal wording: it calls for a nuanced answer.", "These questions (\"to what extent / in what way\") call for a nuanced answer, never just yes or no. Invert the subject in the question."], "Position nuancée": ["A balanced conclusion, highly valued at C1/C2.", "A nuanced conclusion acknowledges both sides before deciding. That's what the jury expects at C1."], "Si je vous comprends bien": ["Buys time and shows you understood the question.", "Rephrasing the jury's question gives you thinking time and avoids misunderstandings."], "Je me permets de nuancer": ["Politely contradicting the jury is valued at C1.", "Disagreeing politely, with arguments, is valued. The jury is also testing your ability to defend your position."], "Vous avez raison de souligner que… toutefois": ["Concede, then defend your position.", "Concede a point to the jury, then reaffirm your idea: the spoken version of « certes… mais »."], "Pour rebondir sur ce que vous dites": ["Shows real interaction, not a monologue.", "Linking your answer to what the jury said shows real interaction, not a recited monologue."], "C'est une question délicate": ["Gives you thinking time without an awkward silence.", "Admitting a question is difficult is fine. Total silence isn't: these phrases fill the pause."]};

/* ---------- État ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};
let state = { tab: store.get("tab","structures"), level: store.get("level","all"), known: store.get("known",{}), card:0, flipped:false, rate:0.9, heard:false, checked:false, answers:{}, pe:"synthese", themeS:"all", vhome:true, exsub: store.get("exsub","train"), exType:null, exRun:null, prog: store.get("prog",{}), paused:null, blancOpen:null, oralI: store.get("oralI",0), c2oi: store.get("c2oi",0), mopen:null, exlvl: store.get("exlvl","C1"), c2i: store.get("c2i",0), checks: store.get("checks",{}), sujetI: store.get("sujetI",0), lang: store.get("lang","fr"), follow: store.get("follow",true), smode:"fiches", gram:null, glen:20, scompact: store.get("scompact",false), squiz:null, qlen:10, themeV:"all", vmode:"cartes", onlyReview:false, playing:null, drafts: store.get("drafts",{}) };
state.vsub = ["themes","expr","coll"].includes(store.get("vsub","themes")) ? store.get("vsub","themes") : "themes";
state.vcompact = store.get("vcompact",false); state.ccompact = store.get("ccompact",false);
const view = document.getElementById("view");
const byLevel = arr => arr.filter(x => state.level==="all" || x.level===state.level);
const exChip = '<span class="chip ex">exemple</span>';

/* ---------- Vues ---------- */
const themesOf = arr => [...new Set(byLevel(arr).map(x=>x.theme))];
function themeSelect(id, arr, current){
  return `<label class="filter" for="${id}"><span class="eyebrow">Thème</span>
    <select id="${id}"><option value="all">Tous les thèmes</option>${themesOf(arr).map(t=>`<option ${t===current?"selected":""}>${t}</option>`).join("")}</select></label>`;
}
const byTheme = (arr, t) => byLevel(arr).filter(x => t==="all" || x.theme===t);

function renderStructures(){
  const ESS = state.themeS==="ess";
  if(!ESS && state.themeS!=="all" && !themesOf(DATA.structures).includes(state.themeS)) state.themeS="all";
  const items = ESS ? byLevel(DATA.structures).filter(s=>s.ess) : byTheme(DATA.structures, state.themeS);
  const nEss = byLevel(DATA.structures).filter(s=>s.ess).length;
  const sel = `<label class="filter" for="theme-s"><span class="eyebrow">Thème</span>
    <select id="theme-s"><option value="all">Tous les thèmes</option><option value="ess" ${ESS?"selected":""}>★ Essentielles (${nEss})</option>${themesOf(DATA.structures).map(t=>`<option ${t===state.themeS?"selected":""}>${t}</option>`).join("")}</select></label>`;
  const modes = `<div class="subtabs" role="tablist" aria-label="Mode">${[["fiches","Fiches"],["quiz","Quiz"],["gram","Grammaire"]].map(([k,l])=>`<button role="tab" data-smode="${k}" aria-selected="${state.smode===k}">${l}</button>`).join("")}</div>`;
  const ICL = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/></svg>';
  const ILI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="18" r="1"/></svg>';
  const viewTgl = state.smode==="fiches" ? `<div class="itoggle" role="group" aria-label="Affichage des fiches"><button id="s-cards" aria-pressed="${!state.scompact}" aria-label="Fiches détaillées" title="Fiches détaillées">${ICL}</button><button id="s-compact" aria-pressed="${state.scompact}" aria-label="Vue compacte" title="Vue compacte">${ILI}</button></div>` : "";
  const langTgl = state.smode!=="gram" ? `<div class="ltoggle" role="group" aria-label="Langue des explications">${[["fr","FR"],["en","EN"]].map(([k,l])=>`<button data-lang="${k}" aria-pressed="${state.lang===k}">${l}</button>`).join("")}</div>` : "";
  const head = `<h2>Structures clés</h2>${modes}
  ${state.smode!=="gram"?sel:""}
  <div class="toolbar"><p class="sub" style="margin:0">${state.smode==="gram"?`${DATA.grammaire.length} questions : modes, relatifs, accords, inversions, cohésion.`:`${items.length} tournures${ESS?" essentielles":""} · ★ = prioritaire`}</p><div class="tools">${langTgl}${viewTgl}</div></div>`;
  const bind = () => {
    const ts=document.getElementById("theme-s"); if(ts) ts.onchange=e=>{ state.themeS=e.target.value; state.squiz=null; renderStructures(); };
    view.querySelectorAll("[data-smode]").forEach(b=>b.onclick=()=>{ state.smode=b.dataset.smode; renderStructures(); });
    view.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ state.lang=b.dataset.lang; store.set("lang",state.lang); renderStructures(); });
    const c=document.getElementById("s-compact"); if(c) c.onclick=()=>{ state.scompact=true; store.set("scompact",true); renderStructures(); };
    const cd=document.getElementById("s-cards"); if(cd) cd.onclick=()=>{ state.scompact=false; store.set("scompact",false); renderStructures(); };
  };
  if(state.smode==="quiz"){ renderSQuiz(head, items, bind); return; }
  if(state.smode==="gram"){ renderGram(head, bind); return; }
  if(state.scompact){
    let last=null;
    view.innerHTML = head + `<div class="clist">${items.map(s=>{
      const grp = (state.themeS==="all"||state.themeS==="ess") && s.theme!==last ? `<p class="eyebrow cgroup">${(last=s.theme)}</p>` : "";
      return grp+`<details class="crow">
        <summary>${lvlBtn(s)}<span class="cname">${s.name}</span>${s.ess?'<span class="star" title="Essentielle">★</span>':""}</summary>
        <div class="cbody"><div class="pattern">${s.pattern}</div><p class="example">${s.example}</p><p class="note" lang="${state.lang}">${tNote(s)}</p>${morePanel(s)}</div>
      </details>`; }).join("") || '<p class="empty">Aucune fiche pour ce niveau.</p>'}</div>`;
    bind(); bindMore(); return;
  }
  view.innerHTML = head + `<div class="stack">${items.map(s=>`
    <article class="sheet">
      <div class="meta">${lvlBtn(s)}<span class="eyebrow">${s.theme}</span>${s.ess?'<span class="star" title="Essentielle">★</span>':""}</div>
      <h3 style="margin:2px 0;font:400 1.15rem var(--f-display)">${s.name}</h3>
      <div class="pattern">${s.pattern}</div>
      <p class="example">${s.example}</p>
      <p class="note" lang="${state.lang}">${tNote(s)}</p>
      ${morePanel(s)}
    </article>`).join("") || '<p class="empty">Aucune fiche pour ce niveau.</p>'}</div>`;
  bind(); bindMore();
}
const lvlBtn = s => s.more ? `<button class="chip chip-btn" data-more="${s._i}" aria-expanded="false" aria-label="Niveau ${s.level} : voir deux autres exemples et une explication">${s.level} <span aria-hidden="true">＋</span></button>` : `<span class="chip">${s.level}</span>`;
const morePanel = s => s.more ? `<button class="more-link" data-more="${s._i}" aria-expanded="false">＋ 2 exemples et une explication</button>
  <div class="more" id="more-${s._i}" hidden>
    <p class="eyebrow" style="margin:0 0 6px">Autres exemples</p>
    <ul class="more-ex">${s.more.map(e=>`<li class="example">${e}</li>`).join("")}</ul>
    <p class="eyebrow" style="margin:10px 0 4px">${state.lang==="en"?"Explanation":"Explication"}</p>
    <p style="margin:0" lang="${state.lang}">${tExpl(s)}</p>
  </div>` : "";
function bindMore(){
  view.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",e=>{
    e.preventDefault(); e.stopPropagation();
    const i=b.dataset.more, panel=document.getElementById("more-"+i); if(!panel) return;
    const det=panel.closest("details"); if(det && !det.open){ det.open=true; panel.hidden=false; }
    else panel.hidden=!panel.hidden;
    view.querySelectorAll(`[data-more="${i}"]`).forEach(x=>{ x.setAttribute("aria-expanded", String(!panel.hidden)); if(x.classList.contains("more-link")) x.textContent = panel.hidden ? "＋ 2 exemples et une explication" : "－ Masquer"; });
  }));
}

/* Test de grammaire C1 */
function renderGram(head, bind){
  if(!state.gram || state.gram.len!==state.glen) state.gram = { len:state.glen, qs:shuffle(DATA.grammaire).slice(0,state.glen), i:0, score:0, picked:null, missed:[] };
  const G=state.gram, lens=`<div class="row" role="group" aria-label="Nombre de questions" style="margin-bottom:10px"><span class="eyebrow">Questions</span>${[10,20,40].map(n=>`<button class="btn" data-glen="${n}" style="padding:4px 10px;${state.glen===n?'border-color:var(--encre);color:var(--encre)':''}">${n}</button>`).join("")}</div>`;
  const intro="";
  const bindG=()=>{ bind(); view.querySelectorAll("[data-glen]").forEach(b=>b.onclick=()=>{ state.glen=+b.dataset.glen; state.gram=null; renderStructures(); }); };
  if(G.i>=G.qs.length){
    const pts=[...new Set(G.missed.map(q=>q.pt))];
    view.innerHTML = head + intro + lens + `<div class="sheet"><div class="eyebrow">Résultat</div>
      <div class="word" style="font-variant-numeric:tabular-nums">${G.score} / ${G.qs.length}</div>
      ${pts.length?`<p class="note" style="margin:4px 0 6px">Points à revoir :</p><ul style="padding-left:18px;margin:0 0 12px">${pts.map(p=>`<li>${p}</li>`).join("")}</ul>`:'<p class="note">Sans faute.</p>'}
      <button class="btn primary" id="g-new">Nouveau test</button></div>`;
    bindG(); document.getElementById("g-new").onclick=()=>{ state.gram=null; renderStructures(); }; return;
  }
  const q=G.qs[G.i], done=G.picked!==null;
  view.innerHTML = head + intro + lens + `
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="counter">Question ${G.i+1} / ${G.qs.length}</span><span class="counter" style="color:var(--ok)">${G.score} bonne(s)</span></div>
  <div class="sheet">
    <div class="meta"><span class="eyebrow">${done?q.pt:"Grammaire C1"}</span></div>
    <p class="qprompt">${q.q.replace(/……….|………./g,"<span class='gap'>……</span>")}</p>
    <div class="stack" style="gap:8px">${q.opts.map((o,j)=>`<button class="qopt ${done?(j===q.a?"right":(G.picked===j?"wrong":"")):""}" data-o="${j}" ${done?"disabled":""}>${String.fromCharCode(65+j)}. ${o}</button>`).join("")}</div>
    ${done?`<p class="note" style="margin:12px 0 0">${q.ex}</p><div class="row" style="margin-top:12px"><button class="btn primary" id="g-next">${G.i+1<G.qs.length?"Suivant":"Voir le résultat"}</button></div>`:""}
  </div>`;
  bindG();
  view.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.o; G.picked=j; if(j===q.a) G.score++; else G.missed.push(q); renderStructures(); });
  const n=document.getElementById("g-next"); if(n) n.onclick=()=>{ G.i++; G.picked=null; renderStructures(); };
}

/* Quiz des structures : retrouver la tournure manquante */
const firstBold = s => { const m=s.example.match(/<b>(.*?)<\/b>/); return m ? m[1].trim() : null; };
function renderSQuiz(head, pool, bind){
  pool = pool.filter(firstBold);
  if(pool.length<4){ view.innerHTML = head+'<p class="empty">Pas assez de fiches dans ce thème pour un quiz. Choisissez « Tous les thèmes » ou « Essentielles ».</p>'; bind(); return; }
  const key = state.level+"|"+state.themeS;
  if(!state.squiz || state.squiz.key!==key){
    const qs = shuffle(pool).slice(0,10).map(s=>{
      const ans = firstBold(s);
      const others = shuffle(byLevel(DATA.structures).filter(o=>o!==s && firstBold(o) && firstBold(o).toLowerCase()!==ans.toLowerCase())).slice(0,3).map(firstBold);
      const prompt = s.example.replace(/<b>.*?<\/b>/, "<span class='gap'>……</span>").replace(/<\/?b>/g,"");
      return { s, prompt, opts: shuffle([{t:ans,ok:true},...others.map(t=>({t,ok:false}))]) };
    });
    state.squiz = { key, qs, i:0, score:0, picked:null, missed:[] };
  }
  const Q = state.squiz;
  if(Q.i>=Q.qs.length){
    view.innerHTML = head + `<div class="sheet"><div class="eyebrow">Résultat</div>
      <div class="word" style="font-variant-numeric:tabular-nums">${Q.score} / ${Q.qs.length}</div>
      ${Q.missed.length?`<p class="note" style="margin:4px 0 6px">À retravailler :</p><ul style="padding-left:18px;margin:0 0 12px">${Q.missed.map(s=>`<li><b>${s.name}</b> · <span class="note">${s.pattern}</span></li>`).join("")}</ul>`:'<p class="note">Sans faute.</p>'}
      <button class="btn primary" id="sq-new">Nouveau quiz</button></div>`;
    bind(); document.getElementById("sq-new").onclick=()=>{ state.squiz=null; renderStructures(); }; return;
  }
  const q = Q.qs[Q.i], done = Q.picked!==null;
  view.innerHTML = head + `
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <span class="counter">Question ${Q.i+1} / ${Q.qs.length}</span><span class="counter" style="color:var(--ok)">${Q.score} bonne(s)</span></div>
  <div class="sheet">
    <div class="meta"><span class="chip">${q.s.level}</span><span class="eyebrow">Complétez avec la bonne tournure</span></div>
    <p class="qprompt">${q.prompt}</p>
    <div class="stack" style="gap:8px">${q.opts.map((o,j)=>`<button class="qopt ${done?(o.ok?"right":(Q.picked===j?"wrong":"")):""}" data-o="${j}" ${done?"disabled":""}>${o.t}</button>`).join("")}</div>
    ${done?`<p class="note" style="margin:12px 0 0"><b>${q.s.name}</b> · ${tNote(q.s)}</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="sq-next">${Q.i+1<Q.qs.length?"Suivant":"Voir le résultat"}</button></div>`:""}
  </div>`;
  bind();
  view.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.o; Q.picked=j; if(q.opts[j].ok) Q.score++; else Q.missed.push(q.s); renderStructures(); });
  const n=document.getElementById("sq-next"); if(n) n.onclick=()=>{ Q.i++; Q.picked=null; renderStructures(); };
}

/* ---------- Vocabulaire : sous-onglets Thèmes / Expressions / Collocations ---------- */
const VSUBS = [["themes","Thèmes"],["expr","Expressions"],["coll","Collocations"]];
const vsubBar = () => `<div class="subtabs" role="tablist" aria-label="Sections du vocabulaire">${VSUBS.map(([k,l])=>`<button role="tab" data-vsub="${k}" aria-selected="${state.vsub===k}">${l}</button>`).join("")}</div>`;
const bindVsub = () => view.querySelectorAll("[data-vsub]").forEach(b=>b.onclick=()=>{
  state.vsub=b.dataset.vsub; store.set("vsub",state.vsub);
  state.quiz=null; state.card=0; state.flipped=false; CS.quiz=null; CS.card=0; CS.flipped=false;
  render(); window.scrollTo(0,0); });
const ICON_CARDS = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/></svg>';
const ICON_LIST = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="18" r="1"/></svg>';
const viewToggle = (idCards, idCompact, compact) => `<div class="itoggle" role="group" aria-label="Affichage de la liste"><button id="${idCards}" aria-pressed="${!compact}" aria-label="Fiches détaillées" title="Fiches détaillées">${ICON_CARDS}</button><button id="${idCompact}" aria-pressed="${compact}" aria-label="Vue compacte" title="Vue compacte">${ICON_LIST}</button></div>`;
const isExprV = v => v.theme==="Expressions";
const vPool = () => DATA.vocab.filter(v => state.vsub==="expr" ? isExprV(v) : !isExprV(v));
const knownChip = '<span class="chip" style="background:var(--ok-soft);color:var(--ok)">acquis</span>';

function renderVocab(){
  if(state.vsub==="coll"){ renderColloc(); return; }
  const expr = state.vsub==="expr", pool = vPool();
  if(expr) state.themeV="all";
  else if(state.themeV!=="all" && !themesOf(pool).includes(state.themeV)) state.themeV="all";
  const home = state.vhome && !expr;
  let items = byTheme(pool, state.themeV);
  if(state.onlyReview) items = items.filter(x=>!state.known[x.word]);
  const all = byTheme(pool, state.themeV), known = all.filter(x=>state.known[x.word]).length;
  const top = `<h2>Vocabulaire</h2>${vsubBar()}`;
  if(home){
    const lv = byLevel(pool), tile=(t,label,arr,cls="")=>{ const k=arr.filter(x=>state.known[x.word]).length;
      return `<button class="vtile ${cls}" data-vt="${t}"><b>${label}</b><span class="counter">${arr.length} mots · ${k} acquis</span><div class="progress"><i style="width:${arr.length?k/arr.length*100:0}%"></i></div></button>`; };
    view.innerHTML = top + `<p class="sub">${lv.length} mots et locutions. Choisissez un thème.</p>
    <div class="vgrid">${tile("all","Tous les thèmes",lv,"all")}${themesOf(pool).map(t=>tile(t,t,lv.filter(x=>x.theme===t))).join("")}</div>`;
    view.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>{ state.themeV=b.dataset.vt; state.vhome=false; state.card=0; state.flipped=false; state.quiz=null; renderVocab(); window.scrollTo(0,0); });
    bindVsub();
    return;
  }
  const title = expr ? "Expressions" : (state.themeV==="all"?"Tous les thèmes":state.themeV);
  const back = expr ? "" : `<div class="row" style="margin-top:4px;align-items:center"><button class="btn" id="v-back" style="padding:6px 12px">← Thèmes</button></div>`;
  const tgl = state.vmode==="liste" ? `<div class="tools">${viewToggle("v-cards","v-compact",state.vcompact)}</div>` : "";
  const head = `${top}${back}
  <h3 style="margin:12px 0 0;font:400 1.15rem var(--f-display)">${title}</h3>
  <div class="toolbar" style="margin-top:4px"><p class="sub" style="margin:0">${all.length} ${expr?"expressions":"mots et locutions"}, avec registre, définition et exemple.</p>${tgl}</div>
  <div class="row" style="margin-bottom:12px;align-items:flex-end">
    <div class="row" role="group" aria-label="Affichage">
      ${[["cartes","Cartes"],["liste","Liste"],["quiz","Quiz"]].map(([k,l])=>`<button class="btn" data-mode="${k}" style="padding:6px 12px;${state.vmode===k?'border-color:var(--encre);color:var(--encre)':''}">${l}</button>`).join("")}
    </div>
  </div>
  <div class="row" style="margin-bottom:12px">
    <div class="progress" aria-label="Mots acquis"><i style="width:${all.length?known/all.length*100:0}%"></i></div>
    <span class="counter">${known} / ${all.length} acquis</span>
  </div>`;
  const bind = () => {
    const bk=document.getElementById("v-back"); if(bk) bk.onclick=()=>{ state.vhome=true; renderVocab(); window.scrollTo(0,0); };
    view.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ state.vmode=b.dataset.mode; renderVocab(); });
    const c1=document.getElementById("v-cards"); if(c1) c1.onclick=()=>{ state.vcompact=false; store.set("vcompact",false); renderVocab(); };
    const c2=document.getElementById("v-compact"); if(c2) c2.onclick=()=>{ state.vcompact=true; store.set("vcompact",true); renderVocab(); };
    bindVsub();
  };

  if(state.vmode==="quiz"){ renderQuiz(head, all, bind); return; }
  if(state.vmode==="liste"){
    if(state.vcompact){
      view.innerHTML = head + `<div class="clist">${all.map(v=>`<details class="crow">
        <summary><span class="chip">${v.level}</span><span class="cname">${v.word}</span>${state.known[v.word]?knownChip:""}</summary>
        <div class="cbody"><p class="eyebrow" style="margin:0 0 4px">${v.theme} · ${v.reg}</p><p style="margin:0 0 6px">${v.def}</p><p class="example note" style="margin:0">« ${v.ex} »</p></div>
      </details>`).join("") || '<p class="empty">Aucun mot pour ce niveau.</p>'}</div>`;
    } else {
      view.innerHTML = head + `<div class="stack">${all.map(v=>`
        <div class="sheet" style="padding-block:12px">
          <div class="meta"><span class="chip">${v.level}</span><span class="eyebrow">${v.reg}</span>${state.known[v.word]?knownChip:""}</div>
          <b style="font:400 1.1rem var(--f-display)">${v.word}</b>
          <p style="margin:2px 0">${v.def}</p><p class="example note" style="margin:0">« ${v.ex} »</p>
        </div>`).join("")}</div>`;
    }
    bind(); return;
  }

  if(!items.length){
    view.innerHTML = head + `<p class="empty">Tous les mots de ce thème sont acquis. <button class="btn" id="v-resetk" style="margin-left:6px">Tout revoir</button></p>`;
    bind();
    document.getElementById("v-resetk").onclick=()=>{ all.forEach(x=>delete state.known[x.word]); store.set("known",state.known); renderVocab(); };
    return;
  }
  if(state.card>=items.length) state.card=0;
  const v = items[state.card];
  view.innerHTML = head + `
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <span class="counter">${state.card+1} / ${items.length}</span>
    <label class="note" style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="only-review" ${state.onlyReview?"checked":""}> Seulement les mots à revoir</label>
  </div>
  <div class="sheet card" id="flash" tabindex="0" role="button" aria-label="Retourner la carte">
    <div class="meta"><span class="chip">${v.level}</span><span class="eyebrow">${v.theme} · ${v.reg}</span></div>
    ${state.flipped
      ? `<div class="word" style="font-size:1.2rem">${v.word}</div><p style="margin:4px 0 8px">${v.def}</p><p class="example">« ${v.ex} »</p>`
      : `<div class="word">${v.word}</div><span class="hint">Touchez pour la définition</span>`}
  </div>
  <div class="row" style="margin-top:12px">
    <button class="btn" id="v-again">À revoir</button>
    <button class="btn good" id="v-known">Je savais</button>
    <button class="btn" id="v-shuffle" style="margin-left:auto">Mélanger</button>
  </div>`;
  bind();
  const flip=()=>{ state.flipped=!state.flipped; renderVocab(); };
  document.getElementById("flash").onclick=flip;
  document.getElementById("flash").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); } };
