</nav>

<script>
/* ---------- Contenu (exemples, à remplacer) ---------- */
const DATA = {
  structures: [
    { level:"C1", theme:"Concession", name:"Avoir beau + infinitif", ess:true,
      pattern:"Sujet + avoir beau + infinitif, + proposition",
      example:"<b>On a beau</b> multiplier les campagnes de sensibilisation, les comportements évoluent lentement.",
      note:"Équivaut à « même si ». Michel Serres l'emploie dans le sujet de démonstration du DALF C1." },
    { level:"C1", theme:"Concession", name:"Bien que / quoique + subjonctif", ess:true,
      pattern:"Bien que / Quoique + sujet + verbe au subjonctif",
      example:"<b>Bien qu'</b>elle <b>soit</b> diplômée, elle peine à trouver un emploi stable.",
      note:"Jamais d'indicatif après « bien que ». « Quoique » est un peu plus soutenu." },
    { level:"C1", theme:"Concession", name:"Quel(le)(s) que soit / soient", ess:true,
      pattern:"Quel + que + être au subjonctif + nom",
      example:"<b>Quelles que soient</b> les mesures adoptées, il faudra en évaluer les effets.",
      note:"« Quel » s'accorde avec le nom. À distinguer de « quelque… que » devant un adjectif." },
    { level:"C2", theme:"Concession", name:"Si / aussi + adjectif + que + subjonctif",
      pattern:"Si (aussi) + adjectif + que + sujet + subjonctif",
      example:"<b>Si séduisante que soit</b> cette idée, elle se heurte à la réalité du terrain.",
      note:"Avec « aussi » en tête, le sujet peut s'inverser : « Aussi séduisante soit-elle… »." },
    { level:"C1", theme:"Concession", name:"Certes… il n'en reste pas moins que", ess:true,
      pattern:"Certes, + concession ; il n'en reste (demeure) pas moins que + indicatif",
      example:"<b>Certes</b>, le numérique facilite l'accès au savoir ; <b>il n'en reste pas moins qu'</b>il creuse certaines inégalités.",
      note:"Le pivot classique d'un paragraphe argumentatif à l'écrit comme à l'oral." },
    { level:"C2", theme:"Concession", name:"Toujours est-il que",
      pattern:"Constat nuancé ; toujours est-il que + indicatif",
      example:"Les chiffres font débat ; <b>toujours est-il que</b> le problème demeure entier.",
      note:"Sert à ramener au fait essentiel après une discussion." },
    { level:"C2", theme:"Concession", name:"Pour autant", ess:true,
      pattern:"Proposition ; sujet + verbe + (ne…) pas pour autant",
      example:"La situation s'améliore ; elle n'est <b>pas pour autant</b> réglée.",
      note:"Signifie « malgré cela ». Très apprécié des correcteurs." },
    { level:"C1", theme:"Opposition", name:"Loin de + infinitif", ess:true,
      pattern:"Loin de + infinitif (passé), + proposition",
      example:"<b>Loin de résoudre</b> la crise, cette mesure l'a aggravée.",
      note:"Le sujet de l'infinitif doit être celui de la principale." },
    { level:"C2", theme:"Opposition", name:"Autant… autant…",
      pattern:"Autant + proposition 1, autant + proposition 2",
      example:"<b>Autant</b> la première partie convainc, <b>autant</b> la seconde laisse perplexe.",
      note:"Met deux constats en balance, avec un effet de symétrie." },
    { level:"C1", theme:"Cause", name:"Dans la mesure où", ess:true,
      pattern:"Dans la mesure où + indicatif",
      example:"<b>Dans la mesure où</b> les ressources sont limitées, il faut faire des choix.",
      note:"Cause présentée comme une condition logique. Plus soutenu que « parce que »." },
    { level:"C1", theme:"Cause", name:"Faute de + nom / infinitif", ess:true,
      pattern:"Faute de + nom (sans article) / infinitif",
      example:"<b>Faute de moyens</b>, le projet a été abandonné.",
      note:"Cause négative : c'est l'absence de quelque chose qui explique le résultat." },
    { level:"C1", theme:"Cause", name:"D'autant (plus) que", ess:true,
      pattern:"Proposition, d'autant plus que + indicatif",
      example:"La réforme est contestée, <b>d'autant plus qu'</b>elle n'a fait l'objet d'aucune concertation.",
      note:"Ajoute une cause qui renforce la première." },
    { level:"C1", theme:"Cause", name:"Sous prétexte que",
      pattern:"Sous prétexte que + indicatif",
      example:"Certains refusent de trier leurs déchets <b>sous prétexte que</b> cela ne changerait rien.",
      note:"La cause est présentée comme fausse ou contestable." },
    { level:"C1", theme:"Cause", name:"Participe passé composé",
      pattern:"Ayant / Étant + participe passé, + proposition",
      example:"<b>N'ayant pas été consultés</b>, les syndicats ont appelé à la grève.",
      note:"Exprime la cause avec une antériorité. Style écrit et soutenu." },
    { level:"C1", theme:"Conséquence", name:"Si bien que", ess:true,
      pattern:"Proposition, si bien que + indicatif",
      example:"Les loyers ont flambé, <b>si bien que</b> de nombreux jeunes quittent la ville.",
      note:"Toujours suivi de l'indicatif, contrairement à « de sorte que » exprimant le but." },
    { level:"C1", theme:"Conséquence", name:"D'où + nom",
      pattern:"Proposition, d'où + nom",
      example:"Les contrôles se sont multipliés, <b>d'où</b> une nette baisse des infractions.",
      note:"Très économique : une conséquence sans verbe." },
    { level:"C1", theme:"Conséquence", name:"Au point de / au point que",
      pattern:"Au point de + infinitif / au point que + indicatif",
      example:"La pollution s'est aggravée <b>au point que</b> la circulation a dû être restreinte.",
      note:"Conséquence liée à une intensité." },
    { level:"C1", theme:"Hypothèse", name:"À supposer que / en admettant que", ess:true,
      pattern:"À supposer que + subjonctif",
      example:"<b>À supposer que</b> la croissance <b>revienne</b>, les inégalités ne disparaîtront pas pour autant.",
      note:"Hypothèse envisagée sans y croire tout à fait." },
    { level:"C1", theme:"Hypothèse", name:"Au cas où + conditionnel",
      pattern:"Au cas où + conditionnel",
      example:"<b>Au cas où</b> les négociations <b>échoueraient</b>, une grève serait envisagée.",
      note:"Piège fréquent : conditionnel, et non subjonctif." },
    { level:"C2", theme:"Hypothèse", name:"Pour peu que + subjonctif",
      pattern:"Pour peu que + subjonctif",
      example:"<b>Pour peu qu'</b>on y consacre les moyens nécessaires, la transition est possible.",
      note:"« Il suffit que… pour que ». Une condition minimale." },
    { level:"C2", theme:"Hypothèse", name:"Quand bien même + conditionnel",
      pattern:"Quand bien même + conditionnel, + conditionnel",
      example:"<b>Quand bien même</b> l'État <b>investirait</b> massivement, le problème <b>persisterait</b>.",
      note:"Hypothèse et concession à la fois : « même si »." },
    { level:"C2", theme:"Hypothèse", name:"Inversion : dût-il",
      pattern:"Dût-il / Dussé-je + infinitif, + proposition",
      example:"<b>Dût-il</b> en coûter à l'État, cette réforme reste indispensable.",
      note:"Subjonctif imparfait figé. Très soutenu, surtout à l'écrit." },
    { level:"C1", theme:"But", name:"De peur que / de crainte que (ne)", ess:true,
      pattern:"De peur que + (ne explétif) + subjonctif",
      example:"Le gouvernement a reporté la réforme <b>de peur que</b> la contestation <b>ne s'étende</b>.",
      note:"Le « ne » explétif n'est pas une négation. Il marque un registre soutenu." },
    { level:"C1", theme:"But", name:"De sorte que + subjonctif",
      pattern:"De sorte que + subjonctif (but)",
      example:"Il faut simplifier les démarches <b>de sorte que</b> chacun <b>puisse</b> y accéder.",
      note:"Avec l'indicatif, « de sorte que » exprime la conséquence." },
    { level:"C1", theme:"Mise en relief", name:"Ce qui…, c'est…", ess:true,
      pattern:"Ce qui / Ce que + proposition, c'est + nom / que…",
      example:"<b>Ce qui</b> frappe dans ce débat, <b>c'est</b> l'absence totale de chiffres.",
      note:"Met l'information principale en fin de phrase, là où l'attention est maximale." },
    { level:"C1", theme:"Mise en relief", name:"Non seulement…, mais encore", ess:true,
      pattern:"Non seulement + A, mais (encore / aussi) + B",
      example:"Cette mesure est <b>non seulement</b> coûteuse, <b>mais encore</b> inefficace.",
      note:"Gradation : le second élément est le plus fort." },
    { level:"C2", theme:"Mise en relief", name:"Encore faut-il que",
      pattern:"Constat ; encore faut-il que + subjonctif",
      example:"Les lois existent ; <b>encore faut-il qu'</b>elles <b>soient</b> appliquées.",
      note:"Inversion obligatoire après « encore » en tête de phrase." },
    { level:"C2", theme:"Mise en relief", name:"Ne serait-ce que",
      pattern:"Ne serait-ce que + nom / pour + infinitif",
      example:"Cette réforme s'impose, <b>ne serait-ce que</b> pour des raisons budgétaires.",
      note:"« Au moins, ne fût-ce que » : l'argument minimal suffit déjà." },
    { level:"C1", theme:"Modalisation", name:"Force est de constater que", ess:true,
      pattern:"Force est de constater / reconnaître que + indicatif",
      example:"<b>Force est de constater que</b> les objectifs n'ont pas été atteints.",
      note:"Présente une conclusion comme inévitable. Idéal en conclusion." },
    { level:"C1", theme:"Modalisation", name:"Il n'est pas exclu que",
      pattern:"Il n'est pas exclu que + subjonctif",
      example:"<b>Il n'est pas exclu que</b> le gouvernement <b>revienne</b> sur sa décision.",
      note:"Exprime une possibilité avec prudence." },
    { level:"C1", theme:"Modalisation", name:"Superlatif + subjonctif",
      pattern:"Le / la plus + adjectif + qui / que + subjonctif",
      example:"C'est la mesure la plus ambitieuse qui <b>ait</b> jamais <b>été</b> prise.",
      note:"Après un superlatif (le seul, le premier, le plus…), le subjonctif est la norme soignée." },
    { level:"C1", theme:"Introduire / conclure", name:"À l'heure où", ess:true,
      pattern:"À l'heure où + indicatif, + problématique",
      example:"<b>À l'heure où</b> l'intelligence artificielle s'invite partout, la question de sa régulation devient urgente.",
      note:"Accroche classique d'une introduction d'exposé ou d'essai." },
    { level:"C1", theme:"Introduire / conclure", name:"Il convient de / il s'agit de",
      pattern:"Il convient de + infinitif",
      example:"<b>Il convient</b> d'abord <b>de</b> définir ce que l'on entend par « bonheur ».",
      note:"Annonce le plan ou une étape de la réflexion." },
    { level:"C1", theme:"Introduire / conclure", name:"Au terme de cette réflexion",
      pattern:"Au terme de / En définitive, + bilan",
      example:"<b>Au terme de cette réflexion</b>, il apparaît que le travail ne suffit pas au bonheur.",
      note:"Ouvre la conclusion. À compléter par une ouverture." },
    {"level": "C1", "theme": "Concession", "name": "Même si + indicatif", "pattern": "Même si + indicatif (jamais de subjonctif)", "example": "<b>Même si</b> le projet <b>est</b> coûteux, il reste nécessaire.", "note": "Erreur fréquente : « même si » ne prend jamais le subjonctif ni le conditionnel après lui."},
    {"level": "C1", "theme": "Concession", "name": "Malgré / en dépit de + nom", "pattern": "Malgré / En dépit de + nom", "example": "<b>En dépit des</b> critiques, le gouvernement maintient sa réforme.", "note": "« Malgré que » est à éviter à l'écrit soutenu ; préférez « bien que »."},
    {"level": "C1", "theme": "Concession", "name": "Avoir beau… il n'empêche que", "pattern": "Proposition ; il n'empêche que + indicatif", "example": "Les experts sont prudents ; <b>il n'empêche que</b> les signaux sont inquiétants.", "note": "Variante plus orale : « n'empêche que »."},
    {"level": "C1", "theme": "Concession", "name": "Tout + adjectif / nom + que", "pattern": "Tout + adjectif / nom + que + indicatif", "example": "<b>Tout</b> ministre <b>qu'</b>il est, il doit respecter la loi.", "note": "Concession portant sur une qualité. « Tout » s'accorde devant un adjectif féminin commençant par une consonne."},
    {"level": "C2", "theme": "Concession", "name": "Quelque + adjectif + que", "pattern": "Quelque + adjectif + que + subjonctif", "example": "<b>Quelque</b> brillants <b>qu'</b>ils <b>soient</b>, ces arguments ne convainquent pas.", "note": "« Quelque » est invariable devant un adjectif (il signifie « si »)."},
    {"level": "C2", "theme": "Concession", "name": "Où que / qui que / quoi que", "pattern": "Où que / Qui que / Quoi que + subjonctif", "example": "<b>Quoi qu'</b>on en <b>dise</b>, la lecture reste essentielle.", "note": "À ne pas confondre avec « quoique » (bien que) en un mot."},
    {"level": "C1", "theme": "Concession", "name": "Il est vrai que… mais", "pattern": "Il est vrai que + indicatif, mais…", "example": "<b>Il est vrai que</b> le télétravail isole, <b>mais</b> il libère aussi du temps.", "note": "Formule souple pour concéder avant de réfuter."},
    {"level": "C2", "theme": "Concession", "name": "Pour + adjectif + que", "pattern": "Pour + adjectif + que + subjonctif", "example": "<b>Pour</b> ambitieuse <b>qu'</b>elle <b>soit</b>, cette loi reste insuffisante.", "note": "Équivalent littéraire de « si… que »."},
    {"level": "C2", "theme": "Concession", "name": "Avoir beau à tous les temps", "pattern": "Sujet + a beau + infinitif / « Il a beau dire »", "example": "Le gouvernement <b>a beau</b> multiplier les annonces, la confiance ne revient pas.", "note": "Le verbe « avoir » se conjugue au temps voulu : « il aura beau », « il avait beau »."},
    {"level": "C1", "theme": "Opposition", "name": "Alors que / tandis que", "pattern": "Proposition, alors que / tandis que + indicatif", "example": "Les métropoles se développent, <b>tandis que</b> les campagnes se vident.", "note": "Oppose deux faits simultanés."},
    {"level": "C1", "theme": "Opposition", "name": "Au lieu de + infinitif", "pattern": "Au lieu de + infinitif, + proposition", "example": "<b>Au lieu de</b> sanctionner, il faudrait prévenir.", "note": "Présente une alternative jugée préférable."},
    {"level": "C1", "theme": "Opposition", "name": "Contrairement à", "ess": true, "pattern": "Contrairement à + nom, + proposition", "example": "<b>Contrairement aux</b> idées reçues, les jeunes lisent beaucoup.", "note": "Très utile pour réfuter une idée reçue en introduction."},
    {"level": "C1", "theme": "Opposition", "name": "À l'inverse / à l'opposé", "pattern": "Proposition. À l'inverse, + proposition", "example": "La France centralise ; <b>à l'inverse</b>, l'Allemagne est fédérale.", "note": "Comparaison par contraste entre deux exemples."},
    {"level": "C2", "theme": "Opposition", "name": "Si… en revanche", "pattern": "Si + indicatif, + en revanche…", "example": "<b>Si</b> l'idée séduit, sa mise en œuvre, <b>en revanche</b>, pose problème.", "note": "Le « si » n'est pas ici hypothétique : il oppose."},
    {"level": "C2", "theme": "Opposition", "name": "Tant… que…", "pattern": "Tant sur le plan A que sur le plan B", "example": "Cette crise est grave, <b>tant</b> sur le plan social <b>que</b> sur le plan économique.", "note": "Coordination élégante de deux domaines."},
    {"level": "C1", "theme": "Cause", "name": "Puisque", "pattern": "Puisque + indicatif", "example": "<b>Puisque</b> tout le monde est d'accord, passons au vote.", "note": "Cause connue de l'interlocuteur, présentée comme évidente."},
    {"level": "C1", "theme": "Cause", "name": "Étant donné que / vu que", "ess": true, "pattern": "Étant donné que + indicatif", "example": "<b>Étant donné que</b> les délais sont courts, il faut agir vite.", "note": "« Vu que » est plus oral."},
    {"level": "C1", "theme": "Cause", "name": "Du fait de / en raison de", "pattern": "Du fait de / En raison de + nom", "example": "<b>En raison de</b> la grève, les trains sont supprimés.", "note": "Registre neutre et administratif, parfait à l'écrit."},
    {"level": "C1", "theme": "Cause", "name": "Grâce à / à cause de", "pattern": "Grâce à (cause positive) / À cause de (cause négative) + nom", "example": "<b>Grâce à</b> la vaccination, la maladie a reculé.", "note": "Ne dites pas « grâce à la crise » : la cause est négative."},
    {"level": "C1", "theme": "Cause", "name": "Non que… mais", "pattern": "Non que + subjonctif, mais (parce que) + indicatif", "example": "Il a refusé, <b>non qu'</b>il <b>soit</b> contre, <b>mais parce qu'</b>il manque de temps.", "note": "Écarte une fausse cause avant de donner la vraie."},
    {"level": "C2", "theme": "Cause", "name": "Comme + cause en tête", "pattern": "Comme + indicatif, + proposition (en début de phrase)", "example": "<b>Comme</b> les négociations avaient échoué, la grève fut votée.", "note": "« Comme » causal se place toujours en tête de phrase."},
    {"level": "C2", "theme": "Cause", "name": "À force de", "pattern": "À force de + infinitif / nom", "example": "<b>À force de</b> reporter la réforme, on l'a rendue impossible.", "note": "Cause répétée qui produit un effet progressif."},
    {"level": "C2", "theme": "Cause", "name": "Tant (cause intensive)", "pattern": "Proposition, tant + proposition", "example": "Le pays est paralysé, <b>tant</b> les grèves se multiplient.", "note": "« Tant » en milieu de phrase introduit une cause intensive."},
    {"level": "C1", "theme": "Conséquence", "name": "Tellement / si … que", "pattern": "Si / Tellement + adjectif + que + indicatif", "example": "La situation est <b>si</b> tendue <b>que</b> le dialogue est rompu.", "note": "Conséquence liée à une intensité."},
    {"level": "C1", "theme": "Conséquence", "name": "Tant de / tellement de … que", "pattern": "Tant de + nom + que + indicatif", "example": "Il y a <b>tant de</b> candidats <b>que</b> la sélection est rude.", "note": "Intensité portant sur une quantité."},
    {"level": "C1", "theme": "Conséquence", "name": "De sorte que + indicatif", "pattern": "Proposition, de sorte que + indicatif (conséquence)", "example": "Le budget a été réduit, <b>de sorte que</b> plusieurs postes ont été supprimés.", "note": "Avec l'indicatif : conséquence réelle. Avec le subjonctif : but."},
    {"level": "C1", "theme": "Conséquence", "name": "C'est pourquoi / c'est la raison pour laquelle", "pattern": "Constat. C'est pourquoi + proposition", "example": "Les ressources s'épuisent ; <b>c'est la raison pour laquelle</b> il faut changer.", "note": "Plus soutenu que « donc »."},
    {"level": "C2", "theme": "Conséquence", "name": "Aussi + inversion", "pattern": "Constat. Aussi + verbe + sujet (inversé)", "example": "Les délais sont serrés ; <b>aussi faut-il</b> agir sans attendre.", "note": "« Aussi » en tête impose l'inversion : marque immédiate d'un C2 à l'écrit."},
    {"level": "C2", "theme": "Conséquence", "name": "Par voie de conséquence", "pattern": "Constat ; par voie de conséquence, + proposition", "example": "Les loyers augmentent ; <b>par voie de conséquence</b>, les familles s'éloignent.", "note": "Très soutenu, utile dans la synthèse."},
    {"level": "C2", "theme": "Conséquence", "name": "Assez / trop … pour que", "pattern": "Trop + adjectif + pour que + subjonctif", "example": "Le sujet est <b>trop</b> sensible <b>pour qu'</b>on le <b>traite</b> à la légère.", "note": "Conséquence négative : ce qui ne peut pas arriver."},
    {"level": "C1", "theme": "Hypothèse", "name": "Si + plus-que-parfait", "ess": true, "pattern": "Si + plus-que-parfait, + conditionnel passé", "example": "<b>Si</b> l'État <b>avait investi</b> plus tôt, la crise <b>aurait été</b> évitée.", "note": "Regret ou reproche sur le passé. Jamais de conditionnel après « si »."},
    {"level": "C1", "theme": "Hypothèse", "name": "Si + plus-que-parfait, conditionnel présent", "pattern": "Si + plus-que-parfait, + conditionnel présent", "example": "<b>Si</b> elle <b>avait étudié</b> le droit, elle <b>serait</b> avocate aujourd'hui.", "note": "Condition passée, conséquence présente."},
    {"level": "C1", "theme": "Hypothèse", "name": "À condition que / pourvu que", "ess": true, "pattern": "À condition que + subjonctif", "example": "Le projet réussira <b>à condition que</b> chacun s'y <b>implique</b>.", "note": "« À condition de + infinitif » si le sujet est le même."},
    {"level": "C1", "theme": "Hypothèse", "name": "À moins que (ne)", "pattern": "À moins que + (ne explétif) + subjonctif", "example": "La réforme sera adoptée, <b>à moins que</b> l'opposition ne la <b>bloque</b>.", "note": "Exprime une condition négative : « sauf si »."},
    {"level": "C1", "theme": "Hypothèse", "name": "En cas de + nom", "pattern": "En cas de + nom (sans article)", "example": "<b>En cas de</b> doute, consultez un professionnel.", "note": "Version nominale de « au cas où »."},
    {"level": "C1", "theme": "Hypothèse", "name": "Gérondif hypothétique", "pattern": "En + participe présent, + conditionnel", "example": "<b>En investissant</b> davantage, on <b>réduirait</b> les inégalités.", "note": "Une hypothèse sans « si », très fluide à l'oral."},
    {"level": "C2", "theme": "Hypothèse", "name": "Sans + nom, + conditionnel passé", "pattern": "Sans + nom, + conditionnel passé", "example": "<b>Sans</b> cette aide, l'entreprise <b>aurait fait</b> faillite.", "note": "Hypothèse implicite : « s'il n'y avait pas eu »."},
    {"level": "C2", "theme": "Hypothèse", "name": "Que… ou que…", "pattern": "Que + subjonctif ou que + subjonctif, + proposition", "example": "<b>Qu'</b>on le <b>veuille</b> ou non, le numérique s'impose.", "note": "Hypothèses alternatives : le résultat ne change pas."},
    {"level": "C2", "theme": "Hypothèse", "name": "Inversion hypothétique", "pattern": "Verbe au conditionnel + sujet inversé, (que) + conditionnel", "example": "<b>Aurait-il</b> raison <b>que</b> cela ne changerait rien.", "note": "Très littéraire : équivaut à « même s'il avait raison »."},
    {"level": "C2", "theme": "Hypothèse", "name": "Selon que… ou que", "pattern": "Selon que + indicatif ou que + indicatif", "example": "<b>Selon que</b> vous serez riche <b>ou</b> pauvre, la justice vous traitera différemment.", "note": "Écho à La Fontaine. Exprime une alternative de conditions."},
    {"level": "C1", "theme": "But", "name": "Pour que / afin que", "ess": true, "pattern": "Pour que / Afin que + subjonctif", "example": "Il faut simplifier la loi <b>afin que</b> chacun la <b>comprenne</b>.", "note": "Si le sujet est le même : « afin de + infinitif »."},
    {"level": "C1", "theme": "But", "name": "En vue de", "pattern": "En vue de + nom / infinitif", "example": "Des travaux ont été engagés <b>en vue de</b> la rénovation du quartier.", "note": "Registre administratif et soutenu."},
    {"level": "C1", "theme": "But", "name": "Dans le but de / dans l'optique de", "pattern": "Dans l'optique de + infinitif", "example": "<b>Dans l'optique de</b> réduire les émissions, la ville limite la circulation.", "note": "Varier les introducteurs de but enrichit la copie."},
    {"level": "C2", "theme": "But", "name": "De manière à / de façon à", "pattern": "De manière à + infinitif", "example": "Il a reformulé sa question <b>de manière à</b> lever toute ambiguïté.", "note": "But présenté comme une manière d'agir."},
    {"level": "C2", "theme": "But", "name": "Histoire de (oral)", "pattern": "Histoire de + infinitif (familier)", "example": "On a fait une pause, <b>histoire de</b> souffler un peu.", "note": "À réserver à l'oral informel : à éviter à l'écrit."},
    {"level": "C1", "theme": "Mise en relief", "name": "C'est… qui / c'est… que", "ess": true, "pattern": "C'est + élément + qui / que + proposition", "example": "<b>C'est</b> l'État <b>qui</b> doit montrer l'exemple.", "note": "L'outil de base pour insister à l'oral."},
    {"level": "C1", "theme": "Mise en relief", "name": "Ce dont…, c'est", "pattern": "Ce dont + proposition, c'est + nom", "example": "<b>Ce dont</b> les jeunes ont besoin, <b>c'est</b> de perspectives.", "note": "« Dont » pour les verbes construits avec « de »."},
    {"level": "C1", "theme": "Mise en relief", "name": "Ce à quoi…, c'est", "pattern": "Ce à quoi + proposition, c'est + nom", "example": "<b>Ce à quoi</b> il faut réfléchir, <b>c'est</b> la place de l'humain.", "note": "Pour les verbes construits avec « à »."},
    {"level": "C1", "theme": "Mise en relief", "name": "Le problème, c'est que", "pattern": "Le problème / L'essentiel / Le plus grave, c'est que + indicatif", "example": "<b>Le plus inquiétant, c'est que</b> personne ne réagit.", "note": "Très efficace à l'oral pour hiérarchiser."},
    {"level": "C1", "theme": "Mise en relief", "name": "Dislocation", "pattern": "Pronom / nom détaché + reprise", "example": "Ce projet, je <b>le</b> soutiens sans réserve.", "note": "Mise en relief typique de l'oral."},
    {"level": "C2", "theme": "Mise en relief", "name": "Si… c'est (parce) que", "pattern": "Si + indicatif, c'est (parce) que + indicatif", "example": "<b>Si</b> la réforme échoue, <b>c'est qu'</b>elle a été mal préparée.", "note": "Explique une cause en partant de la conséquence."},
    {"level": "C2", "theme": "Mise en relief", "name": "Rien de tel que / il n'y a que", "pattern": "Rien de tel que + nom / infinitif pour…", "example": "<b>Rien de tel que</b> la lecture <b>pour</b> enrichir son vocabulaire.", "note": "Mise en valeur par exclusion."},
    {"level": "C2", "theme": "Mise en relief", "name": "Ni plus ni moins que", "pattern": "… ni plus ni moins que + nom", "example": "Ce projet <b>n'</b>est <b>ni plus ni moins qu'</b>une révolution.", "note": "Insiste sur l'exactitude d'une qualification."},
    {"level": "C2", "theme": "Mise en relief", "name": "Toujours est-il / reste que", "pattern": "Reste que + indicatif", "example": "L'idée est séduisante. <b>Reste que</b> son coût est exorbitant.", "note": "Rappelle un problème qui demeure."},
    {"level": "C1", "theme": "Comparaison", "name": "Plus… plus / moins… moins", "pattern": "Plus + proposition, plus + proposition", "example": "<b>Plus</b> on attend, <b>plus</b> la situation se dégrade.", "note": "Proportion : pas d'article devant « plus »."},
    {"level": "C1", "theme": "Comparaison", "name": "D'autant plus… que", "pattern": "D'autant plus + adjectif + que + indicatif", "example": "Cette réforme est <b>d'autant plus</b> urgente <b>que</b> la dette explose.", "note": "Comparaison et cause à la fois."},
    {"level": "C1", "theme": "Comparaison", "name": "De même que… de même", "pattern": "De même que + proposition, (de même) + proposition", "example": "<b>De même que</b> l'eau, l'air est un bien commun.", "note": "Parallèle entre deux idées."},
    {"level": "C1", "theme": "Comparaison", "name": "Ainsi que / à l'instar de", "pattern": "À l'instar de + nom, + proposition", "example": "<b>À l'instar de</b> ses voisins, la France a légiféré.", "note": "Plus soutenu que « comme »."},
    {"level": "C1", "theme": "Comparaison", "name": "Autant que je sache", "pattern": "Autant que + subjonctif (formule figée)", "example": "<b>Autant que</b> je <b>sache</b>, rien n'a été décidé.", "note": "« Autant que je sache » : formule figée au subjonctif."},
    {"level": "C2", "theme": "Comparaison", "name": "Tel… tel", "pattern": "Tel + nom, tel + nom", "example": "<b>Tel</b> père, <b>tel</b> fils.", "note": "Structure proverbiale, à utiliser avec parcimonie."},
    {"level": "C2", "theme": "Comparaison", "name": "Comme si + imparfait", "pattern": "Comme si + imparfait / plus-que-parfait", "example": "Il parle <b>comme si</b> rien ne s'<b>était passé</b>.", "note": "Comparaison hypothétique : jamais de conditionnel."},
    {"level": "C1", "theme": "Temps", "name": "Dès que / aussitôt que", "pattern": "Dès que + indicatif (futur antérieur si antériorité)", "example": "<b>Dès que</b> la loi <b>sera votée</b>, elle s'appliquera.", "note": "En français, futur après « dès que » si l'action est future."},
    {"level": "C1", "theme": "Temps", "name": "Avant que (ne) + subjonctif", "pattern": "Avant que + (ne explétif) + subjonctif", "example": "Il faut agir <b>avant qu'</b>il ne <b>soit</b> trop tard.", "note": "« Après que » prend l'indicatif, contrairement à l'usage courant fautif."},
    {"level": "C1", "theme": "Temps", "name": "Après que + indicatif", "pattern": "Après que + indicatif", "example": "<b>Après que</b> la décision <b>a été prise</b>, les protestations ont éclaté.", "note": "Règle prescriptive appréciée des correcteurs."},
    {"level": "C1", "theme": "Temps", "name": "Depuis que / il y a… que", "pattern": "Cela fait / Il y a + durée + que + présent", "example": "<b>Cela fait</b> dix ans <b>que</b> le débat dure.", "note": "Durée qui se prolonge jusqu'au présent."},
    {"level": "C1", "theme": "Temps", "name": "Au fur et à mesure que", "pattern": "Au fur et à mesure que + indicatif", "example": "<b>Au fur et à mesure que</b> la ville grandit, les problèmes s'accumulent.", "note": "Progression parallèle de deux actions."},
    {"level": "C2", "theme": "Temps", "name": "À peine… que (inversion)", "pattern": "À peine + verbe + sujet inversé…, que + proposition", "example": "<b>À peine</b> la loi <b>était-elle</b> votée <b>qu'</b>on la contestait.", "note": "Inversion obligatoire après « à peine » en tête."},
    {"level": "C2", "theme": "Temps", "name": "Sitôt + participe passé", "pattern": "Sitôt + participe passé, + proposition", "example": "<b>Sitôt</b> l'accord <b>signé</b>, les tensions ont repris.", "note": "Très soutenu : « aussitôt que l'accord fut signé »."},
    {"level": "C2", "theme": "Temps", "name": "Tant que / jusqu'à ce que", "pattern": "Jusqu'à ce que + subjonctif", "example": "Les négociations continueront <b>jusqu'à ce qu'</b>un accord <b>soit</b> trouvé.", "note": "« Tant que » prend l'indicatif."},
    {"level": "C1", "theme": "Restriction", "name": "Ne… que", "pattern": "Ne + verbe + que + élément", "example": "Cette mesure <b>ne</b> concerne <b>que</b> 10 % des ménages.", "note": "Restriction : « seulement ». Plus élégant à l'écrit."},
    {"level": "C1", "theme": "Restriction", "name": "Sauf / excepté / hormis", "pattern": "Hormis + nom, + proposition", "example": "<b>Hormis</b> quelques exceptions, tous les élèves ont réussi.", "note": "« Hormis » est le plus soutenu des trois."},
    {"level": "C1", "theme": "Restriction", "name": "Si ce n'est", "pattern": "Proposition négative, si ce n'est + nom", "example": "Il n'a rien changé, <b>si ce n'est</b> le nom du programme.", "note": "Restriction après une négation."},
    {"level": "C2", "theme": "Restriction", "name": "Pour ce qui est de / quant à", "pattern": "Quant à + nom, + proposition", "example": "<b>Quant aux</b> jeunes, ils semblent les plus touchés.", "note": "Change de sujet en douceur dans une synthèse."},
    {"level": "C2", "theme": "Restriction", "name": "Tout au plus / à tout le moins", "pattern": "À tout le moins, + proposition", "example": "Il faudrait, <b>à tout le moins</b>, consulter les habitants.", "note": "« Au minimum », très soutenu."},
    {"level": "C1", "theme": "Discours rapporté", "name": "Selon / d'après", "ess": true, "pattern": "Selon / D'après + source, + indicatif", "example": "<b>Selon</b> l'Insee, le chômage a reculé.", "note": "Indispensable dans la synthèse pour attribuer une idée à un document."},
    {"level": "C1", "theme": "Discours rapporté", "name": "Conditionnel journalistique", "pattern": "Sujet + conditionnel (information non confirmée)", "example": "Le gouvernement <b>envisagerait</b> une hausse des taxes.", "note": "Marque la prudence face à une information non vérifiée."},
    {"level": "C1", "theme": "Discours rapporté", "name": "Concordance des temps", "ess": true, "pattern": "Il a dit que + imparfait / plus-que-parfait / conditionnel", "example": "Il <b>a affirmé que</b> la crise <b>était</b> terminée et qu'elle ne <b>reviendrait</b> pas.", "note": "Présent → imparfait, futur → conditionnel au passé."},
    {"level": "C1", "theme": "Discours rapporté", "name": "Interrogation indirecte", "pattern": "Se demander si / ce que / pourquoi + indicatif", "example": "L'auteur <b>se demande si</b> l'école peut tout résoudre.", "note": "Pas d'inversion ni de « est-ce que » dans l'interrogation indirecte."},
    {"level": "C2", "theme": "Discours rapporté", "name": "Dont l'auteur souligne…", "pattern": "Document + qui / dont + verbe de discours", "example": "Le premier texte, <b>dont l'auteur souligne</b> les risques, adopte un ton alarmiste.", "note": "Permet de fusionner deux documents dans la synthèse."},
    {"level": "C2", "theme": "Discours rapporté", "name": "Tandis que l'un…, l'autre…", "ess": true, "pattern": "Tandis que le document 1 + verbe, le document 2 + verbe", "example": "<b>Tandis que</b> le premier article insiste sur les coûts, <b>le second</b> met en avant les bénéfices.", "note": "Structure clé de la synthèse : confronter les documents."},
    {"level": "C1", "theme": "Subjonctif", "name": "Il faut que / il est essentiel que", "ess": true, "pattern": "Il est essentiel / indispensable que + subjonctif", "example": "<b>Il est indispensable que</b> l'État <b>prenne</b> ses responsabilités.", "note": "Nécessité : subjonctif obligatoire."},
    {"level": "C1", "theme": "Subjonctif", "name": "Sentiments + subjonctif", "pattern": "Je regrette / crains / me réjouis que + subjonctif", "example": "<b>Je regrette que</b> le débat <b>soit</b> si polarisé.", "note": "Les verbes de sentiment entraînent le subjonctif."},
    {"level": "C1", "theme": "Subjonctif", "name": "Penser que / ne pas penser que", "ess": true, "pattern": "Je pense que + indicatif / Je ne pense pas que + subjonctif", "example": "<b>Je ne pense pas que</b> cette mesure <b>soit</b> suffisante.", "note": "La négation fait basculer vers le subjonctif."},
    {"level": "C1", "theme": "Subjonctif", "name": "Le fait que", "pattern": "Le fait que + subjonctif (souvent)", "example": "<b>Le fait que</b> les jeunes <b>votent</b> moins inquiète les élus.", "note": "Indicatif possible si le fait est présenté comme certain."},
    {"level": "C2", "theme": "Subjonctif", "name": "Subjonctif passé", "pattern": "Que + avoir / être au subjonctif + participe passé", "example": "Je doute qu'il <b>ait compris</b> l'enjeu.", "note": "Marque l'antériorité dans une subordonnée au subjonctif."},
    {"level": "C2", "theme": "Subjonctif", "name": "Relative au subjonctif", "pattern": "Nom indéfini + qui / que + subjonctif", "example": "Nous cherchons une solution qui <b>soit</b> à la fois juste et efficace.", "note": "Le subjonctif exprime une qualité recherchée, pas encore réelle."},
    {"level": "C2", "theme": "Subjonctif", "name": "Subjonctif de souhait en tête", "pattern": "Que + subjonctif (ordre, souhait)", "example": "<b>Que</b> chacun <b>prenne</b> ses responsabilités !", "note": "Tournure oratoire, efficace en conclusion d'oral."},
    {"level": "C1", "theme": "Nominalisation", "name": "Verbe → nom", "pattern": "Le fait d'augmenter → l'augmentation", "example": "<b>L'augmentation</b> des prix a pesé sur la consommation.", "note": "La nominalisation condense l'information : essentiel en synthèse."},
    {"level": "C1", "theme": "Nominalisation", "name": "Phrase → groupe nominal", "pattern": "Les prix ont augmenté, donc… → La hausse des prix entraîne…", "example": "<b>La flambée des loyers</b> entraîne <b>l'exode</b> des familles.", "note": "Remplacez « parce que » + phrase par un nom : style plus dense."},
    {"level": "C2", "theme": "Nominalisation", "name": "Titre nominal", "pattern": "Nom + complément, sans verbe", "example": "<b>Fermeture</b> des écoles : <b>la colère</b> des parents.", "note": "Le style des titres de presse, utile pour comprendre les documents."},
    {"level": "C1", "theme": "Participe & gérondif", "name": "Gérondif de manière", "pattern": "En + participe présent", "example": "C'est <b>en lisant</b> la presse qu'on enrichit son vocabulaire.", "note": "Le sujet du gérondif doit être celui du verbe principal."},
    {"level": "C1", "theme": "Participe & gérondif", "name": "Participe présent cause", "pattern": "Participe présent, + proposition", "example": "<b>Craignant</b> une hausse des prix, les ménages épargnent.", "note": "Remplace « comme ils craignent ». Très écrit."},
    {"level": "C1", "theme": "Participe & gérondif", "name": "Proposition participiale", "pattern": "Nom + participe, + proposition", "example": "<b>Le budget adopté</b>, les travaux pourront commencer.", "note": "Sujet propre au participe : style concis et soutenu."},
    {"level": "C2", "theme": "Participe & gérondif", "name": "Tout en + participe présent", "pattern": "Tout en + participe présent", "example": "Il critique la réforme <b>tout en</b> reconnaissant ses mérites.", "note": "Simultanéité avec une nuance d'opposition."},
    {"level": "C2", "theme": "Participe & gérondif", "name": "Une fois + participe passé", "pattern": "Une fois + participe passé, + proposition", "example": "<b>Une fois</b> la décision <b>prise</b>, il faut l'assumer.", "note": "Antériorité immédiate."},
    {"level": "C1", "theme": "Négation soutenue", "name": "Ne… guère", "pattern": "Ne + verbe + guère", "example": "Les résultats ne sont <b>guère</b> encourageants.", "note": "« Guère » = pas beaucoup. Très soutenu."},
    {"level": "C1", "theme": "Négation soutenue", "name": "Ne… nullement / aucunement", "pattern": "Ne + verbe + nullement", "example": "Il <b>n'</b>est <b>nullement</b> question de renoncer.", "note": "Négation catégorique, plus forte que « pas »."},
    {"level": "C1", "theme": "Négation soutenue", "name": "Ni… ni…", "pattern": "Ne + verbe + ni A ni B", "example": "Cette mesure <b>n'</b>est <b>ni</b> juste <b>ni</b> efficace.", "note": "Pas de « pas » avec « ni… ni »."},
    {"level": "C1", "theme": "Négation soutenue", "name": "Sans que + subjonctif", "pattern": "Sans que + subjonctif", "example": "La loi est passée <b>sans que</b> personne ne s'en <b>aperçoive</b>.", "note": "« Ne » explétif toléré, mais pas obligatoire."},
    {"level": "C2", "theme": "Négation soutenue", "name": "Ne seul (sans pas)", "pattern": "Ne + pouvoir / savoir / oser / cesser + infinitif", "example": "Je <b>ne saurais</b> vous dire combien ce sujet me tient à cœur.", "note": "Négation littéraire sans « pas » avec quelques verbes."},
    {"level": "C2", "theme": "Négation soutenue", "name": "Non sans", "pattern": "Non sans + nom / infinitif", "example": "Il a accepté, <b>non sans</b> réticence.", "note": "Double négation = affirmation nuancée."},
    {"level": "C2", "theme": "Négation soutenue", "name": "Pas le moins du monde", "pattern": "Ne… pas le moins du monde", "example": "Cela ne m'étonne <b>pas le moins du monde</b>.", "note": "Négation emphatique, à l'oral soutenu."},
    {"level": "C1", "theme": "Pronoms relatifs", "name": "Dont", "ess": true, "pattern": "Nom + dont + proposition (complément en « de »)", "example": "C'est une réforme <b>dont</b> on parle beaucoup.", "note": "Remplace « de qui / duquel ». Indispensable au C1."},
    {"level": "C1", "theme": "Pronoms relatifs", "name": "Lequel / auquel / duquel", "pattern": "Préposition + lequel / auquel / duquel", "example": "C'est un problème <b>auquel</b> il faut répondre.", "note": "Le relatif s'accorde avec l'antécédent."},
    {"level": "C1", "theme": "Pronoms relatifs", "name": "Ce qui / ce que / ce dont", "pattern": "Ce qui / ce que / ce dont + proposition", "example": "Il a dit <b>ce que</b> tout le monde pensait.", "note": "Reprend une idée entière, sans antécédent nominal."},
    {"level": "C2", "theme": "Pronoms relatifs", "name": "Où (temps et lieu)", "pattern": "Nom de temps + où + proposition", "example": "À une époque <b>où</b> tout s'accélère, il faut savoir ralentir.", "note": "« Où » remplace aussi un complément de temps."},
    {"level": "C2", "theme": "Pronoms relatifs", "name": "Préposition + quoi", "pattern": "Préposition + quoi (idée neutre)", "example": "Il faut des moyens, faute de <b>quoi</b> rien ne changera.", "note": "« Quoi » reprend une idée, jamais une personne."},
    {"level": "C1", "theme": "Introduire / conclure", "name": "Accroche par un chiffre", "pattern": "Selon + source, + chiffre frappant. + problématique", "example": "<b>Selon l'OMS</b>, un adolescent sur cinq souffre d'anxiété. Faut-il incriminer les écrans ?", "note": "Une accroche chiffrée capte immédiatement l'attention du jury."},
    {"level": "C1", "theme": "Introduire / conclure", "name": "Annonce du plan", "ess": true, "pattern": "Dans un premier temps…, puis…, enfin…", "example": "<b>Dans un premier temps</b>, nous verrons les causes ; <b>puis</b> nous examinerons les solutions.", "note": "Le jury attend une annonce de plan claire à l'oral."},
    {"level": "C1", "theme": "Introduire / conclure", "name": "Transition", "ess": true, "pattern": "Après avoir + participe passé, + intéressons-nous à…", "example": "<b>Après avoir</b> examiné les causes, <b>intéressons-nous</b> aux solutions.", "note": "Relie deux parties : obligatoire dans l'exposé."},
    {"level": "C1", "theme": "Introduire / conclure", "name": "Ouverture finale", "ess": true, "pattern": "Reste à savoir si / On peut dès lors se demander si…", "example": "<b>Reste à savoir si</b> les citoyens accepteront ces efforts.", "note": "La conclusion doit ouvrir sur une nouvelle question."},
    {"level": "C2", "theme": "Introduire / conclure", "name": "Problématique double", "pattern": "Dans quelle mesure + question ?", "example": "<b>Dans quelle mesure</b> le numérique transforme-t-il notre rapport au savoir ?", "note": "Formulation idéale : elle appelle une réponse nuancée."},
    {"level": "C2", "theme": "Introduire / conclure", "name": "Position nuancée", "pattern": "Si… il n'en demeure pas moins que…", "example": "<b>Si</b> le télétravail présente des avantages, <b>il n'en demeure pas moins qu'</b>il doit être encadré.", "note": "Conclusion équilibrée, très appréciée au C1/C2."},
    {"level": "C1", "theme": "Reformulation", "name": "Autrement dit / en d'autres termes", "ess": true, "pattern": "Idée. Autrement dit, + reformulation", "example": "La dette atteint 110 % du PIB. <b>Autrement dit</b>, le pays doit plus que ce qu'il produit en un an.", "note": "Montre au jury que vous maîtrisez votre propos en le reformulant."},
    {"level": "C1", "theme": "Reformulation", "name": "Ce qui revient à dire que", "pattern": "Proposition, ce qui revient à dire que + indicatif", "example": "Les salaires stagnent et les prix montent, <b>ce qui revient à dire que</b> le pouvoir d'achat baisse.", "note": "Tire une conséquence par reformulation."},
    {"level": "C2", "theme": "Reformulation", "name": "Pour ainsi dire", "pattern": "Proposition, pour ainsi dire, + suite", "example": "Le débat est, <b>pour ainsi dire</b>, clos avant d'avoir commencé.", "note": "Atténue une expression un peu forte."},
    {"level": "C2", "theme": "Reformulation", "name": "Du moins", "pattern": "Affirmation, du moins + inversion possible", "example": "C'est la version officielle, <b>du moins</b> celle qu'on nous présente.", "note": "Corrige ou restreint ce qui vient d'être dit."},
    {"level": "C1", "theme": "Illustration", "name": "Prenons l'exemple de", "ess": true, "pattern": "Prenons l'exemple de + nom", "example": "<b>Prenons l'exemple de</b> la Finlande, où l'école a été entièrement repensée.", "note": "Introduit un exemple à l'oral comme à l'écrit."},
    {"level": "C1", "theme": "Illustration", "name": "C'est notamment le cas de", "pattern": "Idée générale. C'est notamment le cas de + nom", "example": "Plusieurs secteurs peinent à recruter. <b>C'est notamment le cas de</b> la restauration.", "note": "Passe du général au particulier."},
    {"level": "C2", "theme": "Illustration", "name": "En témoigne + nom (inversion)", "pattern": "En témoigne / En témoignent + nom", "example": "Le télétravail s'est installé durablement. <b>En témoigne</b> la baisse des surfaces de bureaux.", "note": "Inversion élégante : le verbe s'accorde avec le nom qui suit."},
    {"level": "C2", "theme": "Illustration", "name": "À titre d'exemple", "pattern": "À titre d'exemple / d'illustration, + proposition", "example": "<b>À titre d'exemple</b>, un tiers des repas servis à la cantine est jeté.", "note": "Plus soutenu que « par exemple »."},
    {"level": "C1", "theme": "Modalisation", "name": "Il est probable que / il est possible que", "ess": true, "pattern": "Il est probable que + indicatif / Il est possible que + subjonctif", "example": "<b>Il est possible que</b> la réforme <b>soit</b> reportée.", "note": "Piège classique : « probable » prend l'indicatif, « possible » le subjonctif."},
    {"level": "C2", "theme": "Modalisation", "name": "Sans doute / peut-être + inversion", "pattern": "Sans doute + verbe + sujet inversé", "example": "<b>Sans doute faut-il</b> repenser notre rapport au travail.", "note": "L'inversion après « sans doute » en tête est une marque de style C2."},
    {"level": "C2", "theme": "Modalisation", "name": "Il y a fort à parier que", "pattern": "Il y a fort à parier que + indicatif", "example": "<b>Il y a fort à parier que</b> le sujet reviendra dans le débat.", "note": "Exprime une forte probabilité."},
    {"level": "C1", "theme": "Exprimer son avis", "name": "À mon sens / selon moi", "ess": true, "pattern": "À mon sens, + indicatif", "example": "<b>À mon sens</b>, l'école doit d'abord apprendre à apprendre.", "note": "Varier : « à mes yeux », « de mon point de vue »."},
    {"level": "C1", "theme": "Exprimer son avis", "name": "Il me semble que", "pattern": "Il me semble que + indicatif", "example": "<b>Il me semble que</b> cette mesure manque d'ambition.", "note": "« Il semble que » (sans « me ») prend plutôt le subjonctif."},
    {"level": "C1", "theme": "Exprimer son avis", "name": "Je ne suis pas convaincu(e) que", "pattern": "Je ne suis pas convaincu(e) que + subjonctif", "example": "<b>Je ne suis pas convaincue que</b> la gratuité <b>suffise</b>.", "note": "Le doute fait basculer vers le subjonctif."},
    {"level": "C1", "theme": "Exprimer son avis", "name": "Je partage l'avis de", "pattern": "Je partage (en partie) l'avis de + nom, + nuance", "example": "<b>Je partage en partie l'avis de</b> l'auteur, mais…", "note": "Prise de position nuancée, idéale pour l'essai."},
    {"level": "C2", "theme": "Exprimer son avis", "name": "Il est légitime de se demander si", "pattern": "Il est légitime de se demander si + indicatif", "example": "<b>Il est légitime de se demander si</b> la croissance est encore souhaitable.", "note": "Introduit une remise en question avec tact."},
    {"level": "C1", "theme": "Débat avec le jury", "name": "Si je vous comprends bien", "ess": true, "pattern": "Si je vous comprends bien, + reformulation de la question", "example": "<b>Si je vous comprends bien</b>, vous me demandez si ces mesures sont réalistes ?", "note": "Gagne du temps et montre que vous avez compris la question."},
    {"level": "C1", "theme": "Débat avec le jury", "name": "Je me permets de nuancer", "pattern": "Je me permets de nuancer ce point : + argument", "example": "<b>Je me permets de nuancer</b> ce point : les chiffres varient selon les régions.", "note": "Contredire le jury poliment est apprécié au C1."},
    {"level": "C1", "theme": "Débat avec le jury", "name": "Vous avez raison de souligner que… toutefois", "pattern": "Vous avez raison de souligner que + indicatif ; toutefois…", "example": "<b>Vous avez raison de souligner que</b> le coût est élevé ; <b>toutefois</b>, l'inaction coûterait davantage.", "note": "Concéder puis défendre sa position."},
    {"level": "C1", "theme": "Débat avec le jury", "name": "Pour rebondir sur ce que vous dites", "pattern": "Pour rebondir sur + nom / ce que vous dites, + idée", "example": "<b>Pour rebondir sur</b> votre remarque, j'ajouterais que…", "note": "Montre une vraie interaction, pas un monologue."},
    {"level": "C2", "theme": "Débat avec le jury", "name": "C'est une question délicate", "pattern": "C'est une question délicate / complexe ; + réponse nuancée", "example": "<b>C'est une question délicate</b>, mais je dirais que…", "note": "Laisse le temps de réfléchir sans silence gênant."},
    {"level": "C1", "theme": "Chiffres & évolution", "name": "S'élever à / atteindre", "pattern": "Le nombre de + nom + s'élève à / atteint + chiffre", "example": "Le nombre de demandeurs d'emploi <b>s'élève à</b> trois millions.", "note": "Évite « il y a » et « est de » : verbes précis attendus pour présenter un chiffre.", "more": ["Le budget de la culture <b>atteint</b> désormais 4 milliards d'euros.", "Les pertes <b>se chiffrent à</b> plusieurs millions."], "expl": "Dans la synthèse, il faut reformuler les chiffres des documents sans recopier la phrase. Ces verbes donnent un chiffre de façon neutre et précise. « Se chiffrer à » s'emploie surtout pour des sommes ou des pertes.", "note_en": "Avoid « il y a » and « est de »: precise verbs are expected when giving a figure.", "expl_en": "In the synthesis you must restate figures without copying the sentence. These verbs (\"amount to, reach, total\") present a number neutrally and precisely. « Se chiffrer à » is mainly used for sums or losses."},
    {"level": "C1", "theme": "Chiffres & évolution", "name": "Avoisiner / frôler", "pattern": "Sujet + avoisine / frôle + chiffre", "example": "Le taux de chômage <b>avoisine</b> les 8 %.", "note": "Pour un chiffre approximatif, plus soutenu que « environ ».", "more": ["L'inflation <b>frôle</b> les 6 % sur un an.", "La participation <b>avoisinait</b> à peine 40 %."], "expl": "« Avoisiner » = être proche de, sans nuance. « Frôler » suggère qu'on est juste en dessous d'un seuil important, souvent inquiétant. Les deux évitent l'adverbe « environ ».", "note_en": "For an approximate figure, more formal than « environ ».", "expl_en": "« Avoisiner » = to be close to, neutral. « Frôler » suggests being just below an important (often worrying) threshold. Both avoid the adverb « environ »."},
    {"level": "C1", "theme": "Chiffres & évolution", "name": "Ne cesser de + infinitif", "pattern": "Sujet + ne cesse(nt) de + infinitif", "example": "Les prix de l'immobilier <b>ne cessent d'</b>augmenter.", "note": "Exprime une évolution continue, avec une nuance d'insistance.", "more": ["Le nombre d'utilisateurs <b>ne cesse de</b> croître.", "Leurs conditions de travail <b>n'ont cessé de</b> se dégrader."], "expl": "Construction sans « pas » : c'est une tournure soutenue. Elle insiste sur la continuité d'une évolution, souvent préoccupante.", "note_en": "Expresses continuous change, with a note of insistence.", "expl_en": "Built without « pas », which makes it formal. It stresses that a trend keeps going (\"keeps rising, has steadily worsened\"), often a worrying one.", "ess": true},
    {"level": "C1", "theme": "Chiffres & évolution", "name": "Enregistrer une hausse / une baisse", "pattern": "Sujet + enregistre / connaît + une hausse / une baisse + de + chiffre", "example": "Les ventes de vélos <b>ont enregistré une hausse de</b> 20 %.", "note": "Formule journalistique précise pour décrire une variation.", "more": ["Le secteur <b>connaît un net recul</b> depuis deux ans.", "La natalité <b>a marqué une légère baisse</b> l'an dernier."], "expl": "Variez les noms (hausse, progression, bond, recul, chute, repli) et les adjectifs (net, léger, sensible, spectaculaire) pour nuancer l'ampleur.", "note_en": "Precise journalistic phrasing for describing a change.", "expl_en": "Vary the nouns (hausse, progression, bond, recul, chute, repli) and adjectives (net, léger, sensible, spectaculaire) to convey how big the change is."},
    {"level": "C1", "theme": "Chiffres & évolution", "name": "Proportions : un sur trois, la moitié", "pattern": "Près de / Plus de + un + nom + sur + nombre", "example": "<b>Près d'un</b> jeune <b>sur trois</b> déclare se sentir seul.", "note": "Transforme un pourcentage en formule parlante.", "more": ["<b>Plus de la moitié</b> des foyers sont équipés.", "<b>Seul un quart</b> des déchets est recyclé."], "expl": "Reformuler « 33 % » en « un sur trois » est une technique de reformulation appréciée dans la synthèse. Avec « la moitié de », l'accord se fait souvent avec le complément au pluriel.", "note_en": "Turns a percentage into a striking phrase.", "expl_en": "Rephrasing \"33 %\" as \"one in three\" is a valued reformulation technique in the synthesis. With « la moitié de », the verb often agrees with the plural complement.", "ess": true},
    {"level": "C1", "theme": "Jugement & sentiment", "name": "Il me paraît + adjectif + de / que", "pattern": "Il me paraît / semble + adjectif + de + infinitif", "example": "<b>Il me paraît</b> indispensable <b>de</b> former les enseignants au numérique.", "note": "Formule un jugement de valeur avec mesure.", "more": ["<b>Il me semble</b> regrettable <b>que</b> les élèves ne <b>soient</b> pas consultés.", "<b>Il serait</b> illusoire <b>de</b> croire que tout s'arrangera seul."], "expl": "L'adjectif porte le jugement : indispensable, regrettable, illusoire, judicieux, inacceptable. Avec « que », le subjonctif suit souvent, car on exprime une appréciation.", "note_en": "Expresses a value judgment with restraint.", "expl_en": "The adjective carries the judgment: indispensable, regrettable, illusoire, judicieux, inacceptable. With « que », the subjunctive often follows because you are expressing an evaluation."},
    {"level": "C1", "theme": "Jugement & sentiment", "name": "Être loin de + infinitif", "pattern": "Sujet + est loin de + infinitif / d'être + adjectif", "example": "Cette solution <b>est loin d'être</b> la meilleure.", "note": "Jugement négatif atténué, élégant à l'écrit.", "more": ["Le problème <b>est loin d'être</b> réglé.", "Les résultats <b>sont loin de</b> refléter les efforts fournis."], "expl": "Plus nuancé qu'une négation directe (« ce n'est pas la meilleure »). Très utile pour critiquer sans agressivité dans une lettre formelle.", "note_en": "A softened negative judgment, elegant in writing.", "expl_en": "More nuanced than a direct negative (\"it's not the best\"). Very useful for criticising without aggression in a formal letter."},
    {"level": "C1", "theme": "Jugement & sentiment", "name": "Faire craindre / laisser espérer", "pattern": "Sujet + fait craindre / laisse espérer + nom", "example": "Le développement de l'IA <b>fait craindre</b> la disparition de nombreux métiers.", "note": "Exprime un sentiment de façon impersonnelle.", "more": ["Ces premiers résultats <b>laissent espérer</b> une amélioration.", "Cette décision <b>suscite</b> de vives <b>inquiétudes</b>."], "expl": "Ces verbes expriment une émotion sans « je », ce qui convient au registre écrit. Associez-les à des noms comme inquiétude, espoir, indignation.", "note_en": "Expresses a feeling impersonally.", "expl_en": "These verbs express an emotion without \"I\", which suits formal writing. Pair them with nouns like inquiétude, espoir, indignation."},
    {"level": "C2", "theme": "Jugement & sentiment", "name": "On ne saurait trop + infinitif", "pattern": "On ne saurait trop + infinitif", "example": "<b>On ne saurait trop</b> insister sur l'importance de la prévention.", "note": "Insistance très soutenue : « on n'insistera jamais assez ».", "more": ["<b>On ne saurait</b> réduire ce débat à une question d'argent.", "<b>Je ne saurais</b> approuver une telle mesure."], "expl": "« Ne saurait » (conditionnel de savoir, sans « pas ») signifie « ne peut pas ». Tournure élégante de refus ou d'insistance, idéale dans une lettre ou une conclusion.", "note_en": "Very formal emphasis: \"one cannot stress enough\".", "expl_en": "« Ne saurait » (conditional of savoir, without « pas ») means \"cannot\". An elegant way to refuse or insist, ideal in a letter or a conclusion."},
    {"level": "C1", "theme": "Proposer des solutions", "name": "Il conviendrait de / il serait souhaitable que", "pattern": "Il conviendrait de + infinitif / Il serait souhaitable que + subjonctif", "example": "<b>Il conviendrait de</b> limiter la publicité destinée aux enfants.", "note": "Propose une solution au conditionnel, avec politesse.", "more": ["<b>Il serait souhaitable que</b> les communes <b>investissent</b> dans les pistes cyclables.", "<b>Il faudrait</b> avant tout informer les familles."], "expl": "Le conditionnel rend la proposition moins autoritaire. Indispensable dans l'essai pour proposer sans imposer.", "note_en": "Proposes a solution politely, in the conditional.", "expl_en": "The conditional makes the proposal less authoritarian. Essential in the essay to suggest without imposing.", "ess": true},
    {"level": "C1", "theme": "Proposer des solutions", "name": "Avoir tout intérêt à", "pattern": "Sujet + aurait / a tout intérêt à + infinitif", "example": "Les entreprises <b>auraient tout intérêt à</b> former leurs salariés.", "note": "Recommande en montrant l'avantage pour la personne concernée.", "more": ["Les jeunes <b>ont tout intérêt à</b> se former au numérique.", "L'État <b>gagnerait à</b> simplifier les démarches."], "expl": "Argument très persuasif : on montre que la solution profite à celui qui doit agir. « Gagner à + infinitif » a le même sens.", "note_en": "Recommends by showing the benefit to the person concerned.", "expl_en": "Very persuasive: you show that the solution benefits whoever has to act (\"would do well to\"). « Gagner à + infinitive » means the same."},
    {"level": "C1", "theme": "Proposer des solutions", "name": "Une piste serait de", "pattern": "Une piste / Une solution consisterait à + infinitif", "example": "<b>Une piste serait de</b> taxer les emballages plastiques.", "note": "Introduit une proposition parmi d'autres.", "more": ["<b>Une solution consisterait à</b> rendre les transports gratuits.", "<b>Pourquoi ne pas</b> généraliser l'expérience ?"], "expl": "Présente une idée comme une possibilité, ce qui montre de la nuance. La question rhétorique « Pourquoi ne pas… ? » est efficace en fin d'argument.", "note_en": "Introduces one proposal among others.", "expl_en": "Presents an idea as one possibility, which shows nuance. The rhetorical question « Pourquoi ne pas… ? » works well at the end of an argument."},
    {"level": "C1", "theme": "Lettre formelle", "name": "Formule d'appel", "pattern": "Madame, Monsieur, / Monsieur le Maire, / Madame la Ministre,", "example": "<b>Monsieur le Maire,</b>", "note": "Toujours suivie d'une virgule, sans « cher » dans une lettre officielle.", "more": ["<b>Madame la Directrice,</b>", "<b>Madame, Monsieur,</b>"], "expl": "On reprend le titre de la fonction du destinataire. Si on ne le connaît pas : « Madame, Monsieur ». « Cher Monsieur » est réservé aux relations plus proches.", "note_en": "Always followed by a comma, without « cher » in an official letter.", "expl_en": "Use the recipient's title (\"Mr Mayor, Madam Minister\"). If you don't know who it is: « Madame, Monsieur ». « Cher Monsieur » is for closer relationships."},
    {"level": "C1", "theme": "Lettre formelle", "name": "Annoncer l'objet de la lettre", "pattern": "Je me permets de vous écrire au sujet de + nom", "example": "<b>Je me permets de vous écrire au sujet du</b> projet de fermeture de la bibliothèque.", "note": "Première phrase d'une lettre ouverte ou formelle.", "more": ["<b>C'est avec inquiétude que j'ai appris</b> votre intention de supprimer ce service.", "<b>Par la présente, je souhaite</b> attirer votre attention sur…"], "expl": "L'introduction de la lettre dit qui écrit, pourquoi, et quelle est sa position. Montrez tout de suite que vous avez compris la situation de la consigne.", "note_en": "First sentence of an open or formal letter.", "expl_en": "The letter's introduction says who is writing, why, and what their position is. Show right away that you understood the situation in the instructions."},
    {"level": "C1", "theme": "Lettre formelle", "name": "Solliciter poliment", "pattern": "Je vous prie de bien vouloir + infinitif", "example": "<b>Je vous prie de bien vouloir</b> reconsidérer votre décision.", "note": "Demande formelle et respectueuse, typique de la conclusion.", "more": ["<b>Je vous serais reconnaissant(e) de</b> bien vouloir me recevoir.", "<b>Je me tiens à votre disposition pour</b> en discuter."], "expl": "« Je vous serais reconnaissant(e) » s'accorde avec l'auteur de la lettre. Ces formules rendent la demande ferme mais polie.", "note_en": "A formal, respectful request, typical of the conclusion.", "expl_en": "« Je vous serais reconnaissant(e) » agrees with the letter's writer. These phrases make the request firm but polite."},
    {"level": "C1", "theme": "Lettre formelle", "name": "Formule de politesse finale", "pattern": "Veuillez agréer, + formule d'appel, + l'expression de mes salutations distinguées.", "example": "<b>Veuillez agréer, Monsieur le Maire, l'expression de mes salutations distinguées.</b>", "note": "Reprend exactement la formule d'appel du début.", "more": ["<b>Je vous prie d'agréer, Madame, Monsieur, mes salutations respectueuses.</b>", "<b>Dans l'attente de votre réponse, veuillez recevoir…</b>"], "expl": "La formule d'appel du début est répétée entre virgules. Évitez « cordialement » dans une lettre officielle : il est réservé aux courriels.", "note_en": "Repeats the exact opening salutation.", "expl_en": "The opening salutation is repeated between commas. Avoid « cordialement » in an official letter: it's for emails.", "ess": true},
    {"level": "C1", "theme": "Cohésion", "name": "Reprise par un synonyme (anaphore)", "pattern": "Nom → synonyme / terme générique / pronom", "example": "Le télétravail s'est généralisé. <b>Cette pratique</b> divise pourtant les managers.", "note": "Évite les répétitions, critère noté dans l'essai.", "more": ["Les scooters électriques envahissent les trottoirs. <b>Ces engins</b> inquiètent les piétons.", "Le ministre a annoncé une réforme. <b>Celle-ci</b> entrera en vigueur en janvier."], "expl": "On reprend une idée par un démonstratif + nom plus général (ce phénomène, cette mesure, ce dispositif) ou par un pronom (celui-ci, ce dernier). Le texte devient fluide et sans répétitions.", "note_en": "Avoids repetition, which is graded in the essay.", "expl_en": "You refer back to an idea with a demonstrative + more general noun (ce phénomène, cette mesure, ce dispositif) or a pronoun (celui-ci, ce dernier). The text flows without repetition.", "ess": true},
    {"level": "C1", "theme": "Cohésion", "name": "Construction détachée", "pattern": "Nom, apposition, + verbe", "example": "<b>Mesure phare du gouvernement</b>, la gratuité des transports divise les élus.", "note": "Ajoute une information sans nouvelle phrase.", "more": ["<b>Longtemps marginal</b>, le vélo s'impose en ville.", "Le revenu universel, <b>idée ancienne</b>, revient dans le débat."], "expl": "L'apposition (nom ou adjectif détaché par des virgules) condense l'information. Si le sujet est un pronom, l'apposition se place avant : « Épuisés, ils ont abandonné ».", "note_en": "Adds information without a new sentence.", "expl_en": "An apposition (noun or adjective set off by commas) condenses information. If the subject is a pronoun, the apposition goes before it: « Épuisés, ils ont abandonné »."},
    {"level": "C2", "theme": "Cohésion", "name": "Inversion après un complément", "pattern": "Complément en tête + verbe + sujet", "example": "<b>À ces difficultés s'ajoutent</b> des problèmes de financement.", "note": "Inversion élégante qui relie les idées.", "more": ["<b>De cette crise est née</b> une prise de conscience.", "<b>Restent</b> les questions de sécurité."], "expl": "Quand un complément de lieu ou de point de départ ouvre la phrase, le sujet nominal peut passer après le verbe. Cela crée un enchaînement fluide avec la phrase précédente.", "note_en": "Elegant inversion that links ideas.", "expl_en": "When a complement of place or origin opens the sentence, a noun subject can move after the verb (\"to these difficulties are added…\"). It creates a smooth link with the previous sentence."},
    {"level": "C2", "theme": "Cohésion", "name": "Passif impersonnel", "pattern": "Il + se + verbe pronominal / Il + être + participe + nom", "example": "<b>Il s'est vendu</b> moins de livres papier l'an dernier.", "note": "Met l'accent sur l'action plutôt que sur l'agent.", "more": ["<b>Il a été décidé</b> de reporter la réforme.", "<b>Il se crée</b> chaque année des milliers d'entreprises."], "expl": "Le sujet « il » est vide, le vrai sujet suit le verbe. Tournure administrative et journalistique très utile pour varier les structures.", "note_en": "Focuses on the action rather than who does it.", "expl_en": "The subject « il » is empty; the real subject follows the verb (\"fewer books were sold\"). An administrative, journalistic structure very useful for varying sentences."},
    {"level": "C1", "theme": "Cohésion", "name": "Infinitif sujet", "pattern": "Infinitif + complément + verbe", "example": "<b>Réduire</b> sa consommation de viande <b>s'impose</b> comme une nécessité.", "note": "Une phrase qui commence par un verbe à l'infinitif.", "more": ["<b>Apprendre</b> une langue <b>demande</b> de la patience.", "<b>Interdire</b> les écrans <b>ne résoudrait</b> rien."], "expl": "L'infinitif joue le rôle d'un nom sujet. Structure concise et variée, qui évite « le fait de ».", "note_en": "A sentence starting with an infinitive as its subject.", "expl_en": "The infinitive acts as a noun subject (\"Reducing meat consumption is becoming a necessity\"). Concise and varied, it avoids « le fait de »."},
    {"level": "C1", "theme": "Cohésion", "name": "Veiller à ce que / tenir à ce que", "pattern": "Veiller / Tenir / S'attendre à ce que + subjonctif", "example": "Il faut <b>veiller à ce que</b> les tâches <b>soient</b> réparties équitablement.", "note": "Verbes en « à » suivis d'une proposition : « à ce que ».", "more": ["Je <b>tiens à ce que</b> chacun <b>puisse</b> s'exprimer.", "On <b>s'attend à ce que</b> les prix <b>baissent</b>."], "expl": "Quand un verbe construit avec « à » est suivi d'une proposition, on insère « ce que ». Le subjonctif suit, car on exprime une volonté ou une attente.", "note_en": "Verbs with « à » followed by a clause: « à ce que ».", "expl_en": "When a verb built with « à » is followed by a clause, insert « ce que ». The subjunctive follows because it expresses a wish or expectation."},
    {"level": "C1", "theme": "Registres de langue", "name": "La négation complète", "pattern": "Familier : sujet + verbe + pas / Soutenu : sujet + ne + verbe + pas", "example": "À l'écrit, on écrit : « Je <b>ne</b> sais <b>pas</b> » et non « Je sais pas ».", "note": "Oublier le « ne » à l'écrit fait immédiatement baisser le registre.", "more": ["Familier : « C'est pas grave. » → Soutenu : « Ce <b>n'</b>est <b>pas</b> grave. »", "Familier : « Y a plus rien. » → Soutenu : « Il <b>n'</b>y a plus rien. »"], "expl": "À l'oral courant, le « ne » disparaît très souvent ; à l'écrit et à l'exposé, il est obligatoire. Le passage de l'un à l'autre est l'une des différences de registre les plus visibles pour un correcteur.", "note_en": "Dropping « ne » in writing instantly lowers the register.", "expl_en": "In everyday speech « ne » very often disappears; in writing and in the formal presentation it is required. This is one of the register differences an examiner notices most.", "ess": true},
    {"level": "C1", "theme": "Registres de langue", "name": "Trois façons de poser une question", "pattern": "Familier : intonation / Courant : est-ce que / Soutenu : inversion", "example": "Soutenu : « <b>Faut-il</b> interdire les écrans à l'école ? »", "note": "Le registre de la question doit correspondre à celui du texte.", "more": ["Familier : « Tu viens quand ? » → Courant : « Quand <b>est-ce que</b> tu viens ? » → Soutenu : « Quand <b>viens-tu</b> ? »", "Avec un nom sujet : « Le gouvernement <b>a-t-il</b> raison ? »"], "expl": "Dans une problématique ou une question rhétorique écrite, utilisez toujours l'inversion. Avec un nom sujet, on garde le nom et on ajoute un pronom inversé (« le gouvernement a-t-il »).", "note_en": "The register of a question must match the register of the text.", "expl_en": "In a research question or a written rhetorical question, always use inversion. With a noun subject, keep the noun and add an inverted pronoun (« le gouvernement a-t-il »)."},
    {"level": "C1", "theme": "Registres de langue", "name": "« On » ou « nous »", "pattern": "Courant : on / Soutenu : nous ou tournure impersonnelle", "example": "Soutenu : « <b>Nous</b> devons repenser notre rapport au travail. »", "note": "« On » est très fréquent à l'oral ; à l'écrit, préférez « nous » ou l'impersonnel.", "more": ["Familier : « On a vu que c'était compliqué. » → Soutenu : « <b>Il est apparu</b> que la situation était complexe. »", "Courant : « On peut se demander si… » → Soutenu : « <b>Il convient de</b> se demander si… »"], "expl": "« On » n'est pas une faute, mais son usage répété donne un ton oral. Dans l'essai, « nous » associe le lecteur ; l'impersonnel donne un ton objectif.", "note_en": "« On » is very common in speech; in writing prefer « nous » or an impersonal construction.", "expl_en": "« On » isn't wrong, but repeating it sounds spoken. In the essay, « nous » includes the reader; impersonal phrasing sounds objective."},
    {"level": "C1", "theme": "Registres de langue", "name": "« Ça » ou « cela »", "pattern": "Familier / courant : ça / Soutenu : cela, ceci", "example": "Soutenu : « <b>Cela</b> explique en partie la baisse de la natalité. »", "note": "« Ça » est à bannir de l'écrit soutenu.", "more": ["Familier : « Ça sert à rien. » → Soutenu : « <b>Cela</b> ne sert à rien. »", "Soutenu : « <b>Ceci</b> étant dit, la question reste ouverte. »"], "expl": "« Ça » est la forme orale de « cela ». « Ceci » annonce ce qui suit, « cela » reprend ce qui précède, même si l'usage courant les confond.", "note_en": "« Ça » should be banned from formal writing.", "expl_en": "« Ça » is the spoken form of « cela ». « Ceci » announces what follows and « cela » refers back, even if everyday usage mixes them up."},
    {"level": "C1", "theme": "Registres de langue", "name": "Vocabulaire familier → soutenu", "pattern": "Mot familier → équivalent courant ou soutenu", "example": "Familier : « un boulot » → Soutenu : « <b>un emploi</b> ».", "note": "Remplacer le vocabulaire familier est indispensable à l'écrit.", "more": ["« bosser » → <b>travailler</b> ; « galérer » → <b>rencontrer des difficultés</b> ; « un truc » → <b>un élément, un aspect</b>.", "« plein de » → <b>de nombreux</b> ; « super important » → <b>essentiel, primordial</b>."], "expl": "Les mots familiers sont normaux à l'oral entre amis, mais ils coûtent des points à l'écrit et devant le jury. Préparez une liste de remplacements pour les mots que vous utilisez spontanément.", "note_en": "Replacing informal vocabulary is essential in writing.", "expl_en": "Informal words are normal among friends, but they cost points in writing and in front of the jury. Keep a list of replacements for the words you use spontaneously."},
    {"level": "C2", "theme": "Registres de langue", "name": "Le passé simple", "pattern": "Sujet + passé simple (récit écrit)", "example": "Le projet <b>fut</b> abandonné quelques mois plus tard.", "note": "Temps du récit écrit, à reconnaître et à savoir employer au C2.", "more": ["La réforme <b>suscita</b> une vive opposition.", "Ils <b>vinrent</b>, <b>virent</b> et <b>repartirent</b> sans rien changer."], "expl": "Absent de l'oral, le passé simple domine dans les récits historiques et littéraires. Au C2, il peut donner du relief à un éditorial ou à un discours qui raconte.", "note_en": "The narrative tense of written French; recognise it and use it at C2.", "expl_en": "Absent from speech, the passé simple dominates historical and literary narratives. At C2 it can add weight to an editorial or speech that tells a story."},
    {"level": "C1", "theme": "Intensité & appréciation", "name": "Graduer l'intensité", "pattern": "Adverbe d'intensité + adjectif", "example": "Cette mesure est <b>particulièrement</b> efficace.", "note": "Variez les adverbes pour nuancer au lieu de répéter « très ».", "more": ["La situation est <b>extrêmement</b> préoccupante.", "Le résultat est <b>relativement</b> décevant."], "expl": "Échelle à retenir : légèrement < assez < plutôt < fort / bien < particulièrement < extrêmement < infiniment. Choisir l'adverbe précis montre une maîtrise de la nuance.", "note_en": "Vary adverbs to add nuance instead of repeating « très ».", "expl_en": "Scale to remember: légèrement < assez < plutôt < fort / bien < particulièrement < extrêmement < infiniment. Picking the precise adverb shows control of nuance."},
    {"level": "C1", "theme": "Intensité & appréciation", "name": "Adjectifs gradués", "pattern": "Remplacer « très + adjectif » par un adjectif plus fort", "example": "Au lieu de « très important » : <b>primordial, capital, crucial</b>.", "note": "Un adjectif fort vaut mieux que « très » + adjectif faible.", "more": ["Au lieu de « très mauvais » : <b>désastreux, catastrophique, déplorable</b>.", "Au lieu de « très bon » : <b>remarquable, excellent, exemplaire</b>."], "expl": "Les adjectifs forts (on dit « extrêmes ») ne se combinent pas avec « très » : on ne dit pas « très primordial ». C'est une erreur fréquente même chez les bons candidats.", "note_en": "A strong adjective beats « très » + a weak adjective.", "expl_en": "Strong (\"extreme\") adjectives can't be combined with « très »: you don't say « très primordial ». A common mistake even among strong candidates.", "ess": true},
    {"level": "C2", "theme": "Intensité & appréciation", "name": "Des plus + adjectif", "pattern": "Nom + des plus + adjectif pluriel", "example": "Une situation <b>des plus délicates</b>.", "note": "« Extrêmement », avec un style recherché.", "more": ["Un choix <b>des plus judicieux</b>.", "Ce débat est <b>des plus complexes</b>."], "expl": "L'adjectif se met généralement au pluriel, car on compare avec « les plus délicates de toutes ». Tournure élégante, typique de l'écrit soutenu.", "note_en": "\"Extremely\", in a refined style.", "expl_en": "The adjective usually goes in the plural, because it compares with \"the most delicate of all\". An elegant phrase typical of formal writing."},
    {"level": "C2", "theme": "Intensité & appréciation", "name": "On ne peut plus + adjectif", "pattern": "On ne peut plus + adjectif", "example": "Sa réponse était <b>on ne peut plus claire</b>.", "note": "Exprime le degré maximal : « tout à fait, extrêmement ».", "more": ["Le contexte est <b>on ne peut plus favorable</b>.", "Une décision <b>pour le moins surprenante</b>."], "expl": "« On ne peut plus » marque l'intensité maximale. « Pour le moins » fait l'inverse : il atténue en apparence un jugement critique, avec ironie.", "note_en": "Expresses the highest degree: \"couldn't be more…\".", "expl_en": "« On ne peut plus » marks maximum intensity. « Pour le moins » does the opposite: it seemingly softens a critical judgment, often ironically (\"to say the least\")."},
    {"level": "C2", "theme": "Subjonctif imparfait", "name": "Reconnaître le subjonctif imparfait", "pattern": "Que + il fût / il eût / il fît / il vînt…", "example": "Il fallait qu'il <b>fût</b> présent.", "note": "À reconnaître dans les textes littéraires, sans obligation de l'employer.", "more": ["Bien qu'elle <b>eût</b> raison, personne ne l'écouta.", "On exigea qu'il <b>vînt</b> sur-le-champ."], "expl": "Dans la langue actuelle, on le remplace par le subjonctif présent (« il fallait qu'il soit présent »). Il apparaît surtout à la 3e personne du singulier, avec un accent circonflexe. Le reconnaître évite des contresens en compréhension écrite au C2.", "note_en": "Recognise it in literary texts; you don't have to use it.", "expl_en": "Modern French replaces it with the present subjunctive (« il fallait qu'il soit présent »). It mostly appears in the 3rd person singular, with a circumflex accent. Recognising it avoids misreadings in C2 reading comprehension."},
    {"level": "C2", "theme": "Subjonctif imparfait", "name": "Reconnaître le subjonctif plus-que-parfait", "pattern": "Que + il eût + participe passé / il fût + participe passé", "example": "Il regrettait qu'elle <b>eût quitté</b> la ville.", "note": "Équivalent littéraire du subjonctif passé.", "more": ["Il <b>eût fallu</b> agir plus tôt.", "Qui l'<b>eût cru</b> ?"], "expl": "Il peut aussi avoir la valeur d'un conditionnel passé, surtout dans des formules figées : « il eût fallu » = il aurait fallu, « qui l'eût cru » = qui l'aurait cru.", "note_en": "Literary equivalent of the past subjunctive.", "expl_en": "It can also work as a past conditional, especially in fixed phrases: « il eût fallu » = il aurait fallu, « qui l'eût cru » = who would have thought."},
    {"level": "C2", "theme": "Temps", "name": "Ne… pas plus tôt… que", "pattern": "Sujet + n'avoir / n'être + pas plus tôt + participe passé + que + proposition", "example": "Il <b>n'</b>avait <b>pas plus tôt</b> annoncé la réforme <b>que</b> les syndicats appelaient à la grève.", "note": "Antériorité immédiate, avec un effet de surprise.", "more": ["Elle <b>n'</b>était <b>pas plus tôt</b> arrivée <b>que</b> le téléphone sonnait.", "Le texte <b>n'</b>a <b>pas plus tôt</b> été publié <b>qu'</b>il a suscité la polémique."], "expl": "Équivaut à « à peine… que », sans inversion. La seconde action suit immédiatement la première. Ne pas confondre avec « plutôt » (préférence) : ici, « plus tôt » s'écrit en deux mots.", "note_en": "Immediate succession, with a sense of surprise.", "expl_en": "Equivalent to « à peine… que » (\"no sooner… than\"), without inversion. The second action immediately follows the first. Don't confuse with « plutôt » (preference): here « plus tôt » is two words."}
