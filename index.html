  grammaire: [{"q": "Réduire la place de la voiture en ville s'avère plus complexe qu'on ne le pense. Quel est le sujet de « s'avère » ?", "opts": ["La voiture", "La ville", "Réduire", "On"], "a": 2, "pt": "Phrase infinitive", "ex": "L'infinitif « réduire » (avec ses compléments) joue le rôle d'un nom : c'est lui le sujet du verbe « s'avère »."}, {"q": "La direction annoncera sa décision après que les salariés ………. leur avis.", "opts": ["aient donné", "auraient donné", "auront donné", "donnent"], "a": 2, "pt": "Après que + indicatif", "ex": "« Après que » exprime un fait réel et accompli : il se construit avec l'indicatif. Ici, l'action est future et antérieure à « annoncera » : futur antérieur."}, {"q": "La gratuité des transports est une question ………. les élus se divisent.", "opts": ["dont", "sur laquelle", "à laquelle", "où"], "a": 1, "pt": "Relatives complexes", "ex": "On se divise « sur » une question : la préposition « sur » + lequel accordé avec « question » donne « sur laquelle »."}, {"q": "Je regrette que le gouvernement ne ………. pas les associations avant de légiférer.", "opts": ["a consulté", "ait consulté", "aurait consulté", "consultait"], "a": 1, "pt": "Subjonctif passé", "ex": "« Regretter que » impose le subjonctif. L'action est antérieure au regret : subjonctif passé (« ait consulté »)."}, {"q": "« La loi existe, encore il faudrait l'appliquer. » Cette phrase est-elle correcte ?", "opts": ["Oui", "Non"], "a": 1, "pt": "Inversion après « encore »", "ex": "En tête de proposition, « encore » au sens de « mais il reste que » entraîne l'inversion : « encore faudrait-il l'appliquer »."}, {"q": "………., la réforme des retraites a mobilisé des milliers de manifestants.", "opts": ["Contestée par les syndicats", "Les syndicats l'ayant contestée", "Vivement débattue au Parlement", "Les trois réponses sont correctes"], "a": 3, "pt": "Constructions détachées", "ex": "Une apposition (participe ou proposition participiale) peut ouvrir la phrase, tant qu'elle se rapporte logiquement au sujet ou possède son propre sujet. Les trois versions sont correctes."}, {"q": "Les plateformes de livraison recrutent des coursiers indépendants. ………. ne bénéficient d'aucune protection sociale.", "opts": ["Ceux-ci", "Celles-ci", "Ces dernières", "Les autres"], "a": 0, "pt": "Anaphores", "ex": "Le pronom reprend « coursiers » (masculin pluriel), les personnes qui ne sont pas protégées. « Celles-ci / ces dernières » renverraient aux plateformes, ce qui change le sens."}, {"q": "En France, ………. chaque année des milliers de vélos électriques. Quelle forme est la plus formelle ?", "opts": ["on vend", "ils vendent", "il se vend", "nous vendons"], "a": 2, "pt": "Passif impersonnel", "ex": "« Il se vend » est un passif impersonnel : le vrai sujet suit le verbe. C'est la tournure la plus formelle, typique de la presse et des rapports."}, {"q": "« Rares sont les étudiants qui lisent encore la presse papier. » Quel procédé est utilisé ?", "opts": ["Une inversion avec mise en relief", "Une construction détachée", "Un passif impersonnel", "Une anaphore"], "a": 0, "pt": "Inversion et mise en relief", "ex": "L'adjectif attribut placé en tête (« rares sont… ») entraîne l'inversion du sujet et met l'information en relief. Même construction : « Nombreux sont… »."}, {"q": "La ville cherche un prestataire qui ………. capable de gérer les déchets sans polluer.", "opts": ["est", "soit", "serait", "sera"], "a": 1, "pt": "Mode dans la relative", "ex": "On ne sait pas encore si ce prestataire existe : la relative exprime une qualité recherchée, d'où le subjonctif."}, {"q": "« Tout en dénonçant les dérives des réseaux sociaux, l'auteur reconnaît leur utilité. » Quel lien unit les deux parties ?", "opts": ["La simultanéité", "La concession", "La simultanéité et la concession", "La cause"], "a": 2, "pt": "Simultanéité", "ex": "« Tout en + participe présent » marque deux actions simultanées et, souvent, une nuance d'opposition : ici, critiquer et reconnaître à la fois."}, {"q": "Les parents doivent veiller ………. leurs enfants ne passent pas trop de temps devant les écrans.", "opts": ["que", "à ce que", "à que", "ce que"], "a": 1, "pt": "Prépositions + ce que", "ex": "Le verbe se construit avec « à » (veiller à quelque chose). Devant une proposition, on insère « ce que » : « veiller à ce que » + subjonctif."}, {"q": "Quelle phrase convient le mieux à un écrit formel ?", "opts": ["Pourquoi pas des cantines 100 % bio ?", "Des cantines 100 % bio, ce serait top pour la santé.", "Généraliser les cantines biologiques améliorerait la santé des élèves.", "On pourrait faire des cantines bio, non ?"], "a": 2, "pt": "Registre formel", "ex": "Le registre formel évite les questions familières, la dislocation et les mots familiers (« top »). La phrase infinitive au conditionnel est la plus soutenue."}, {"q": "Le gouvernement a supprimé la taxe d'habitation. ………. a été saluée par les propriétaires.", "opts": ["Cette mesure", "Ce désastre", "Cette catastrophe", "Ce scandale"], "a": 0, "pt": "Anaphore résumante", "ex": "Le nom qui reprend la phrase précédente doit être neutre ou cohérent avec le jugement : « cette mesure » convient, les autres contredisent « saluée »."}, {"q": "Les vaccins ? Les infirmiers les ont ………. aux patients dès lundi.", "opts": ["faits administrés", "fait administrer", "faits administrer", "fait administrés"], "a": 1, "pt": "Accord avec faire + infinitif", "ex": "Le participe passé « fait » suivi d'un infinitif reste toujours invariable. L'infinitif ne s'accorde pas."}, {"q": "Voici le projet ………. je vous ai parlé et ………. nous comptons beaucoup.", "opts": ["que / auquel", "dont / sur lequel", "duquel / où", "dont / lequel"], "a": 1, "pt": "Relatifs composés", "ex": "On parle « de » quelque chose (dont) et on compte « sur » quelque chose (sur lequel)."}, {"q": "Ces start-up recherchent des profils capables de maîtriser plusieurs…", "opts": ["savoir-faire", "savoirs-faire", "savoir-faires", "savoirs-faires"], "a": 0, "pt": "Pluriel des noms composés", "ex": "« Savoir-faire » est formé de deux verbes : il est invariable."}, {"q": "Quelle phrase est incorrecte ?", "opts": ["Longtemps négligé, le recyclage du plastique progresse enfin.", "Le recyclage, longtemps négligé, progresse enfin.", "Longtemps négligée, le recyclage du plastique progresse enfin.", "Négligé pendant des années, le recyclage progresse."], "a": 2, "pt": "Accord de l'apposition", "ex": "L'apposition s'accorde avec le nom qu'elle complète : « recyclage » est masculin, donc « négligé »."}, {"q": "Si l'État ………. investi dans les hôpitaux, nous ………. éviter cette crise.", "opts": ["avait / aurions pu", "aurait / avions pu", "a / pourrions", "avait eu / aurions"], "a": 0, "pt": "Irréel du passé", "ex": "Hypothèse sur le passé : « si » + plus-que-parfait, puis conditionnel passé. Jamais de conditionnel après « si »."}, {"q": "« Si les jeunes votent moins, c'est qu'ils se sentent ignorés. » Quelle est la valeur de « si » ?", "opts": ["Hypothèse", "Cause expliquée", "Condition", "Opposition"], "a": 1, "pt": "Valeurs de « si »", "ex": "Ici « si » ne pose pas d'hypothèse : il part d'un fait réel pour en donner l'explication (« si… c'est que / parce que »)."}, {"q": "Quelques mois ………., l'association avait déjà ouvert un premier centre.", "opts": ["plus tôt", "plutôt", "plus-tôt", "plutôt que"], "a": 0, "pt": "Plus tôt / plutôt", "ex": "« Plus tôt » (en deux mots) exprime le temps : avant. « Plutôt » (en un mot) exprime la préférence."}, {"q": "………. si la réforme serait maintenue.", "opts": ["Ils se demandaient", "Ils se demandaient-ils", "Est-ce qu'ils se demandaient", "Se demandaient ils"], "a": 0, "pt": "Interrogation indirecte", "ex": "L'interrogation indirecte suit l'ordre normal sujet-verbe, sans inversion ni « est-ce que ». Le conditionnel exprime un futur dans le passé."}, {"q": "Ces voitures électriques coûtent encore beaucoup trop…", "opts": ["cher", "chères", "chèrement", "chers"], "a": 0, "pt": "Adjectif employé comme adverbe", "ex": "Dans « coûter cher », « cher » est un adjectif employé comme adverbe : il reste invariable. Même chose pour « voir clair », « parler fort », « sentir bon »."}, {"q": "Quelle phrase est la plus correcte ?", "opts": ["C'est les jeunes qui votent le moins.", "Ce sont les jeunes qui votent le moins.", "C'est les jeunes qui vote le moins.", "Ce sont les jeunes qui vote le moins."], "a": 1, "pt": "Accord de la mise en relief", "ex": "À l'écrit soigné, « c'est » devient « ce sont » devant un nom pluriel, et le verbe après « qui » s'accorde avec ce nom."}, {"q": "Le tourisme spatial n'est pas une priorité ; nous devrions plutôt l'envisager…", "opts": ["à long terme", "de long terme", "au long terme", "en long terme"], "a": 0, "pt": "Expressions de temps", "ex": "L'expression figée est « à long terme » (de même : à court terme, à moyen terme)."}, {"q": "Cette chercheuse est ………. reconnue dans son domaine.", "opts": ["toute", "tout", "tous", "toutes"], "a": 1, "pt": "Accord de « tout » adverbe", "ex": "Devant un adjectif féminin commençant par une voyelle ou un « h » muet, « tout » adverbe reste invariable : « tout reconnue »."}, {"q": "« Vous auriez dû consulter les habitants avant de fermer l'école. » Cette phrase exprime…", "opts": ["un souhait", "un reproche", "une hypothèse", "une information non confirmée"], "a": 1, "pt": "Conditionnel passé", "ex": "Le conditionnel passé de « devoir » exprime un reproche sur une action passée qui n'a pas été faite."}, {"q": "Notre santé dépend largement ………. nous mangeons.", "opts": ["de ce que", "de quoi", "ce que", "à ce que"], "a": 0, "pt": "Préposition + ce que", "ex": "On dépend « de » quelque chose. Devant une proposition, on écrit « de ce que »."}, {"q": "« Je sais combien d'articles ils ont lus, mais pas combien ils en ont écrits. » Combien d'erreurs ?", "opts": ["Aucune", "Une", "Deux", "Trois"], "a": 1, "pt": "Accord avec « en »", "ex": "Avec le pronom « en », le participe passé reste invariable : « ils en ont écrit ». « Lus » est correct, car le complément « combien d'articles » est placé avant."}, {"q": "Quant aux étudiants, la plupart ………. la hausse des frais d'inscription.", "opts": ["refuse", "refusent", "refusons", "refusez"], "a": 1, "pt": "Accord avec « la plupart »", "ex": "Après « la plupart (des…) », le verbe s'accorde au pluriel, même si le complément est sous-entendu."}, {"q": "Quelle forme est correcte ?", "opts": ["Bien qu'il est fatigué", "Bien qu'il soit fatigué", "Bien qu'il serait fatigué", "Bien qu'il sera fatigué"], "a": 1, "pt": "Bien que + subjonctif", "ex": "« Bien que » exige toujours le subjonctif, même quand le fait est certain."}, {"q": "« Tandis que les ventes de livres papier reculent, les livres audio progressent. » On ne peut pas remplacer « tandis que » par…", "opts": ["alors que", "pendant que", "puisque", "mais"], "a": 2, "pt": "Connecteurs d'opposition", "ex": "« Alors que », « pendant que » (simultanéité) et une reformulation avec « mais » gardent le sens. « Puisque » exprime la cause et change totalement le sens."}, {"q": "Elle est ………. de la nouvelle agence de communication.", "opts": ["le directeur", "la directrice", "la directeure", "le directrice"], "a": 1, "pt": "Féminisation des noms de métiers", "ex": "Les noms de métiers se féminisent : directeur → directrice, auteur → autrice ou auteure, chef → cheffe."}, {"q": "Les jeunes parents peuvent choisir entre un congé parental ………. une réduction du temps de travail.", "opts": ["ou", "et", "soit", "ni"], "a": 1, "pt": "Choisir entre… et…", "ex": "La construction correcte est « choisir entre A et B ». « Entre A ou B » est une faute fréquente."}, {"q": "Pendant la crise, les commerçants n'ont pu prendre ………. vacances.", "opts": ["aucunes", "aucune", "aucun", "nulles"], "a": 0, "pt": "Déterminants quantitatifs", "ex": "« Aucun » se met au pluriel seulement devant un nom toujours pluriel, comme « vacances », « frais » ou « obsèques » : « aucunes vacances »."}, {"q": "Dès que la sonde ………. ses analyses, elle transmettra les données.", "opts": ["aura terminé", "termine", "terminera", "ait terminé"], "a": 0, "pt": "Antériorité dans le futur", "ex": "L'action de terminer est achevée avant « transmettra » : futur antérieur après « dès que »."}, {"q": "« Les salariés comme les dirigeants ………. favorables au télétravail. »", "opts": ["est", "sont", "soit", "était"], "a": 1, "pt": "Accord avec deux sujets", "ex": "Avec « comme » qui ajoute un élément (= et), le verbe s'accorde au pluriel avec les deux sujets."}, {"q": "« Plusieurs pays misent sur l'éolien et le nucléaire. Ce dernier reste pourtant contesté. » Que reprend « ce dernier » ?", "opts": ["L'éolien", "Le nucléaire", "Plusieurs pays", "L'éolien et le nucléaire"], "a": 1, "pt": "Anaphore « ce dernier »", "ex": "« Ce dernier » reprend toujours le dernier nom mentionné, ici « le nucléaire »."}, {"q": "Toutes les solutions ont été étudiées, ………. la suppression pure et simple du service.", "opts": ["y compris", "y comprise", "comprise", "inclue"], "a": 0, "pt": "Y compris", "ex": "Placé avant le nom, « y compris » est invariable. Placé après (« la suppression y comprise »), il s'accorderait."}, {"q": "Il est probable que le chômage ………. l'an prochain.", "opts": ["baisse", "baissera", "baissât", "ait baissé"], "a": 1, "pt": "Probable / possible", "ex": "« Il est probable que » se construit avec l'indicatif, à la différence de « il est possible que », qui prend le subjonctif."}],
  vocab: [
    { level:"C1", theme:"Argumentation", word:"étayer", reg:"soutenu", def:"Appuyer une idée par des preuves ou des exemples.", ex:"Elle étaie sa thèse par de nombreuses données chiffrées." },
    { level:"C1", theme:"Argumentation", word:"nuancer", reg:"courant", def:"Rendre un propos moins catégorique en y ajoutant des réserves.", ex:"Il convient de nuancer ce constat." },
    { level:"C1", theme:"Argumentation", word:"réfuter", reg:"soutenu", def:"Démontrer qu'une affirmation est fausse.", ex:"L'auteur réfute point par point les arguments adverses." },
    { level:"C1", theme:"Argumentation", word:"corroborer", reg:"soutenu", def:"Confirmer par de nouveaux éléments.", ex:"Les derniers chiffres corroborent cette analyse." },
    { level:"C1", theme:"Argumentation", word:"prôner", reg:"soutenu", def:"Recommander vivement, défendre une idée.", ex:"Certains économistes prônent la décroissance." },

    { level:"C2", theme:"Argumentation", word:"battre en brèche", reg:"soutenu", def:"Attaquer, ébranler une idée ou une institution.", ex:"Cette étude bat en brèche l'idée selon laquelle les jeunes ne lisent plus." },

    { level:"C1", theme:"Registre soutenu", word:"de surcroît", reg:"soutenu", def:"En plus, de plus.", ex:"Le projet est coûteux et, de surcroît, mal conçu." },
    { level:"C1", theme:"Registre soutenu", word:"néanmoins", reg:"soutenu", def:"Pourtant, malgré cela.", ex:"La tâche est ardue ; elle n'est néanmoins pas impossible." },

    {"level": "C1", "theme": "Figures de style", "word": "une comparaison", "reg": "courant", "def": "Rapprochement de deux éléments avec un outil (comme, tel, pareil à, semblable à).", "ex": "La ville, comme une ruche, ne dort jamais."},

    {"level": "C1", "theme": "Figures de style", "word": "une antithèse (figure)", "reg": "soutenu", "def": "Rapprochement de deux idées opposées dans une même phrase.", "ex": "Le numérique rapproche les lointains et éloigne les proches."},

    {"level": "C1", "theme": "Figures de style", "word": "une gradation", "reg": "soutenu", "def": "Suite de termes d'intensité croissante ou décroissante.", "ex": "Cette réforme inquiète, indigne, révolte."},
    {"level": "C1", "theme": "Figures de style", "word": "une personnification", "reg": "courant", "def": "Fait de prêter des traits humains à une chose ou une idée.", "ex": "La crise frappe à la porte des ménages."},

    {"level": "C1", "theme": "Types de textes", "word": "un rapport", "reg": "courant", "def": "Document qui présente une situation et propose des recommandations à un décideur.", "ex": "Le rapport recommande trois mesures prioritaires."}

    c2: {"epreuves": [{"name": "Compréhension et production orales", "pts": 50, "desc": "Écoute d'un document enregistré (2 écoutes), 1 h de préparation, puis compte rendu, argumentation et débat avec le jury (30 min)."}, {"name": "Compréhension et production écrites", "pts": 50, "desc": "Dossier de documents d'environ 2 000 mots, puis rédaction d'un texte structuré d'au moins 700 mots (3 h 30)."}], "sujets": ["Rédigez un éditorial pour un quotidien national : « Faut-il encore croire au progrès technique ? »", "Vous êtes chargé(e) de mission dans une collectivité. Rédigez un rapport au conseil régional sur l'opportunité de rendre les transports en commun gratuits.", "Rédigez le discours que vous prononcerez à l'ouverture d'un colloque sur l'avenir des langues régionales.", "Rédigez un article pour une revue de société : le télétravail a-t-il changé notre rapport au temps et à l'espace ?", "Rédigez une lettre ouverte au ministre de la Culture sur la place des écrans dans l'accès des jeunes à la culture.", "Rédigez un éditorial : « L'intelligence artificielle menace-t-elle la création artistique ? »", "Rédigez un rapport destiné au conseil d'administration d'une université sur la suppression des notes en première année.", "Rédigez un article pour un magazine de vulgarisation : la conquête spatiale privée est-elle une chance ou un danger ?"]},
    methode: {"synthese": {"label": "Synthèse", "temps": "≈ 1 h 30 (lecture 45 min + rédaction 45 min) · 200 à 240 mots · 12,5 points", "steps": [["Planifier", ["Lisez tous les documents une première fois, sans noter, pour trouver le thème commun.", "Formulez la problématique : la question à laquelle les documents répondent ensemble.", "Relevez les idées essentielles en notes, dans un tableau avec une colonne par document. Laissez de côté les exemples secondaires.", "Un tableau pratique : une ligne par idée du premier document, et pour chaque autre document trois colonnes : idée commune, idée opposée, idée nouvelle.", "Comparez : quelles idées se répètent, se complètent, s'opposent ou se nuancent ?", "Construisez un plan en 2 ou 3 parties à partir de ces regroupements, jamais dans l'ordre des documents.", "Fixez un budget de mots : environ 40 pour l'introduction, 90 à 100 par partie."]], ["Rédiger", ["Ajoutez un titre si la consigne le demande.", "Introduction courte : le thème, les documents en une phrase, la problématique. La conclusion n'est pas obligatoire.", "Un paragraphe par idée essentielle, une ligne vide entre les parties.", "Reformulez tout : nouveaux mots, nouvelle construction de phrase. Gardez seulement les mots-clés sans synonyme.", "Attribuez les idées à leur source (selon, d'après, l'auteur souligne…) et confrontez les documents dans la même phrase.", "Aucune opinion personnelle, aucune idée qui ne soit pas dans les documents.", "La conclusion est facultative. Si vous en faites une, deux phrases qui reprennent l'idée directrice suffisent."]], ["Réviser", ["Comptez les mots : entre 200 et 240. Hors de la fourchette, la note baisse.", "Vérifiez qu'aucun groupe de mots n'est recopié des documents.", "Vérifiez que les documents sont croisés, pas résumés l'un après l'autre.", "Relisez l'orthographe, les accords et la ponctuation."]]], "check": ["200 à 240 mots", "Problématique dans l'introduction", "Plan personnel, pas l'ordre des documents", "Documents confrontés", "Tout est reformulé", "Aucune opinion personnelle", "Orthographe et accords relus"]}, "essai": {"label": "Essai argumenté", "temps": "≈ 45 min à 1 h · 250 mots minimum · 12,5 points (gardez 10 min pour relire les deux textes)", "steps": [["Planifier", ["Analysez la consigne : qui écrivez-vous, à qui, quel type de texte, dans quel but ?", "Quatre positions possibles : adhérer à la thèse des documents, la contester, confronter le pour et le contre, ou l'accepter en concédant certains points.", "Prenez position clairement, en restant nuancé.", "Cherchez des arguments et surtout des exemples précis, tirés de votre expérience. Vous pouvez reprendre quelques éléments des documents.", "Plan en 2 ou 3 parties, 2 ou 3 arguments par partie. Peu d'arguments, mais bien développés."]], ["Rédiger", ["Respectez la mise en page du type de texte demandé (voir ci-dessous).", "Introduction : le contexte, le problème, votre position, l'annonce du plan.", "Chaque argument : une idée, une explication, un exemple.", "Reliez les arguments par des connecteurs variés et marquez les transitions entre les parties.", "Évitez les répétitions : reprenez les idées par des synonymes ou des pronoms.", "Conclusion : le bilan de votre position, puis une ouverture ou une demande (pour une lettre)."]], ["Réviser", ["Comptez les mots : au moins 250 (une tolérance d'environ 10 % existe, mais ne comptez pas dessus).", "Le destinataire et le registre sont-ils respectés du début à la fin ?", "Variez les phrases : subordonnées, relatives, mises en relief.", "Relisez les erreurs fréquentes : accords, subjonctif, prépositions."]]], "check": ["250 mots ou plus", "Type de texte et destinataire respectés", "Position claire et nuancée", "Chaque argument a un exemple", "Connecteurs variés et transitions", "Conclusion avec ouverture ou demande", "Pas de répétitions"]}, "types": [["Lettre ouverte / formelle", "Lieu et date, objet, formule d'appel (« Monsieur le Maire, »), introduction qui dit pourquoi on écrit, formule de politesse finale qui reprend l'appel, signature."], ["Article de presse", "Un titre accrocheur, éventuellement un chapeau (deux lignes de résumé), puis un développement en paragraphes. Pas de « je » excessif."], ["Contribution à un forum", "Un titre ou une réponse à un message, une adresse directe aux autres participants, un ton engagé mais respectueux, un pseudonyme en signature."], ["Courrier des lecteurs", "Adressé au journal, il réagit à un article précis : rappelez-le en introduction, puis donnez votre point de vue."]], "co": {"label": "Compréhension de l'oral", "temps": "≈ 40 min · 25 points", "steps": [["Avant l'écoute", ["Lisez toutes les questions pendant le temps prévu : elles donnent le thème et le plan du document.", "Soulignez les mots-clés de chaque question (qui, pourquoi, quelle conséquence…).", "Préparez la colonne de brouillon : une ligne par question.", "Repérez le type de chaque question (choix multiple, vrai / faux, réponse à rédiger) : cela vous dit quoi écouter."]], ["Pendant l'écoute", ["Première écoute du document long : notez des mots, pas des phrases. Repérez la structure et l'opinion de chaque intervenant.", "Les questions suivent en général l'ordre du document.", "Documents courts : une seule écoute, alors concentrez-vous sur les questions précises (chiffres, attitude, but du message).", "Première écoute : répondez au crayon, puis confirmez à l'encre pendant la pause. Le jour de l'examen, seules les réponses à l'encre sont corrigées.", "Si une question vous bloque, passez à la suivante sans vous arrêter.", "Deuxième écoute : concentrez-vous sur les questions restées sans réponse."]], ["Après l'écoute", ["Répondez en phrases courtes et complètes. L'orthographe n'est pas notée si la réponse reste compréhensible.", "Reformulez avec vos mots : la réponse doit montrer que vous avez compris, pas recopier un mot entendu.", "Ne laissez aucune case vide : une réponse partielle peut rapporter des points."]]], "check": ["Toutes les questions lues avant l'écoute", "Chaque réponse est une phrase claire", "Aucune case vide", "Les chiffres et les noms sont notés"]}, "ce": {"label": "Compréhension des écrits", "temps": "≈ 50 min · 25 points", "steps": [["Survoler", ["Lisez le titre, le chapeau, la source et la date : ils annoncent le thème et le point de vue.", "Lisez les questions avant le texte pour savoir quoi chercher.", "Identifiez le type de texte : article d'opinion, reportage, essai, entretien."]], ["Lire en profondeur", ["Repérez l'idée principale de chaque paragraphe et notez-la dans la marge.", "Distinguez l'idée essentielle, l'exemple et l'opinion de l'auteur.", "Repérez les connecteurs : ils montrent l'enchaînement des idées (cause, opposition, concession)."]], ["Répondre", ["Vrai / faux : la justification doit citer exactement la phrase du texte, sinon la réponse vaut 0.", "Questions « avec vos propres mots » : ne recopiez jamais le texte, reformulez.", "Vocabulaire en contexte : relisez la phrase entière avant de choisir le sens."]]], "check": ["Chaque vrai / faux a sa citation exacte", "Les reformulations ne recopient pas le texte", "Toutes les questions ont une réponse"]}, "po": {"label": "Production orale", "temps": "1 h de préparation · 30 min · 25 points", "steps": [["Préparer (1 h)", ["Répartissez l'heure : environ 35 min de lecture, 15 min pour le plan, 10 min pour prévoir les questions et objections du jury.", "Lisez les documents et dégagez le thème et une problématique.", "Construisez un plan en 2 ou 3 parties, avec 3 ou 4 idées principales en tout.", "Ajoutez vos propres idées et exemples : l'exposé n'est pas un résumé des documents.", "Notez des mots-clés, pas un texte rédigé : vous ne devez pas lire."]], ["Exposé (8 à 10 min)", ["Introduction : une accroche, le thème, la problématique, l'annonce du plan.", "Développez chaque partie avec des exemples, et marquez les transitions.", "Conclusion : une réponse nuancée à la problématique, puis une ouverture.", "Regardez le jury, parlez à un rythme posé.", "Choisissez votre ton (prudent, neutre ou engagé) et gardez-le du début à la fin."]], ["Débat (15 à 20 min)", ["Écoutez la question jusqu'au bout, reformulez-la si besoin.", "Défendez votre position avec des arguments, nuancez sans vous contredire.", "Vous pouvez être en désaccord avec le jury, poliment et avec des arguments.", "Si vous ne savez pas, dites-le et proposez une piste de réflexion.", "Adaptez votre intonation : posée pour nuancer, ferme pour affirmer une certitude."]]], "check": ["Problématique claire", "Plan annoncé", "Idées personnelles en plus des documents", "Notes en mots-clés, pas de lecture", "Conclusion avec ouverture"]}, "c2oral": {"label": "Compréhension et production orales", "temps": "1 h de préparation · 30 min · 50 points", "steps": [["Écouter et préparer (1 h)", ["Le document sonore est écouté deux fois : notez sa structure, les idées principales et la position de chaque intervenant.", "Préparez d'abord un compte rendu fidèle et organisé du document.", "Dégagez une problématique et construisez votre propre argumentation sur le sujet."]], ["Monologue", ["Présentez le compte rendu : le thème, les idées essentielles, les points de vue, sans les lister dans l'ordre chronologique.", "Enchaînez sur votre argumentation : position claire, arguments hiérarchisés, exemples variés.", "Soignez les transitions : au C2, l'auditeur doit suivre sans effort."]], ["Débat", ["Le jury discute votre position et peut vous contredire.", "Argumentez avec souplesse : nuancez, concédez, reformulez.", "Montrez la richesse et la précision de votre langue, sans artifice."]]], "check": ["Compte rendu fidèle et organisé", "Position personnelle claire", "Transitions nettes", "Exemples précis et variés"]}, "c2ecrit": {"label": "Compréhension et production écrites", "temps": "3 h 30 · au moins 700 mots · 50 points", "steps": [["Comprendre le dossier", ["Lisez le dossier de documents (environ 2 000 mots) et dégagez le plan et l'enchaînement des idées de chacun.", "Sélectionnez seulement les informations utiles à la position que vous allez défendre.", "Lisez attentivement la consigne : genre de texte (article, éditorial, rapport, discours, lettre), destinataire, objectif."]], ["Construire", ["Choisissez une ligne directrice claire et tenez-la jusqu'au bout.", "Plan en 2 ou 3 grandes parties, chacune avec plusieurs arguments.", "Mêlez les informations du dossier et vos propres connaissances et réflexions."]], ["Rédiger et réviser", ["Respectez les codes du genre demandé (titre, chapeau, intertitres, formules).", "Adoptez un ton engagé et un registre adapté au destinataire.", "Comptez les mots : au moins 700.", "Gardez 20 minutes pour relire la langue : accords, subjonctif, ponctuation."]]], "check": ["Au moins 700 mots", "Genre et destinataire respectés", "Ligne directrice tenue du début à la fin", "Dossier exploité et idées personnelles", "Relecture de la langue faite"]}},

    sujetsEssai: ["Votre ville veut interdire les voitures dans le centre. Vous écrivez au maire une lettre ouverte pour donner votre avis.", "Le lycée de votre quartier envisage d'interdire totalement le téléphone portable. Vous écrivez un article pour le journal de l'établissement.", "Un magazine lance un débat : « Faut-il instaurer une journée sans viande dans les cantines ? ». Vous participez au forum en ligne du magazine.", "Votre entreprise propose de passer à la semaine de quatre jours. Vous écrivez au directeur des ressources humaines pour défendre votre position.", "Un journal publie une tribune affirmant que le tourisme de masse doit être limité par des quotas. Vous rédigez un courrier des lecteurs.", "Votre commune veut fermer la dernière librairie indépendante pour construire un parking. Vous écrivez une lettre ouverte au conseil municipal.", "Un site d'information demande : « L'intelligence artificielle doit-elle entrer dans les écoles ? ». Vous rédigez une contribution argumentée.", "Le gouvernement envisage de rendre le service civique obligatoire pour les 18-25 ans. Vous écrivez à votre député pour donner votre avis.", "Un magazine consacre un dossier aux dépenses publiques pour la conquête spatiale. Vous rédigez un article : cet argent serait-il mieux utilisé ailleurs ?", "Votre université veut supprimer les cours de langues régionales faute de budget. Vous écrivez au président de l'université.", "Un forum de parents débat : « Faut-il limiter le temps d'écran des enfants par la loi ? ». Vous donnez votre point de vue.", "Une grande enseigne de votre ville organise un « Black Friday » géant. Vous écrivez un article pour un blog de consommation responsable.", "Votre mairie propose d'installer des jardins partagés à la place d'un terrain vague. Vous écrivez au maire pour soutenir ou critiquer le projet.", "Un journal titre : « Les jeunes ne veulent plus travailler ». Vous réagissez dans un courrier des lecteurs.", "Votre association de quartier envisage de créer une colocation entre étudiants et personnes âgées. Vous écrivez un article pour le bulletin du quartier.", "Le ministère propose de rendre la réparation des objets électroniques moins chère par une aide de l'État. Vous participez à une consultation publique en ligne."],

      text:"Longtemps jugée démodée, la réparation d'objets connaît un regain d'intérêt. Dans les repair cafés, des bénévoles aident chaque samedi les habitants à remettre en état grille-pains, vélos ou téléphones. Pour les organisateurs, l'enjeu dépasse l'économie : il s'agit de recréer du lien entre voisins et de lutter contre l'obsolescence programmée. Reste que ces initiatives peinent encore à toucher les plus jeunes, davantage habitués à remplacer qu'à réparer.",

  ecoute: [
    { level:"C1", theme:"Environnement", type:"Flash d'information", title:"La sobriété énergétique, contrainte ou chance ?",
      text:"Depuis plusieurs années, la sobriété énergétique s'impose dans le débat public. Si certains y voient une contrainte imposée par la crise, d'autres estiment qu'elle constitue au contraire une occasion de repenser nos modes de vie. Selon une récente enquête, près de deux Français sur trois déclarent avoir baissé le chauffage cet hiver, mais seuls un tiers d'entre eux envisagent de maintenir ces efforts sur la durée. Pour les spécialistes, l'enjeu est donc moins de convaincre que d'ancrer de nouvelles habitudes. Reste à savoir si les mesures annoncées suffiront à infléchir durablement les comportements.",
      questions:[
        { q:"Quelles sont les deux façons de percevoir la sobriété évoquées ?", a:"Comme une contrainte liée à la crise, ou comme une occasion de repenser nos modes de vie." },
        { q:"Quel décalage l'enquête met-elle en évidence ?", a:"Beaucoup ont baissé le chauffage (deux sur trois), mais peu comptent continuer sur la durée (un tiers)." },
        { q:"Quel est l'enjeu selon les spécialistes ?", a:"Moins convaincre que faire durer les nouvelles habitudes." } ] },
    { level:"C1", theme:"Société", type:"Chronique", title:"Le grand retour des jeux de société",
      text:"On les croyait relégués au fond des placards, détrônés par les écrans. Pourtant, les jeux de société connaissent un véritable engouement : le marché a progressé de près de cinquante pour cent en dix ans. Dans les grandes villes, les bars à jeux se multiplient et affichent complet le week-end. Comment expliquer ce succès ? Pour les sociologues, il répond à un besoin de se retrouver autour d'une table, loin des notifications. Le jeu devient un prétexte pour recréer du lien, entre amis comme en famille. Paradoxe amusant : bon nombre de ces jeux sont découverts… grâce aux réseaux sociaux.",
      questions:[
        { q:"Quel chiffre illustre le succès des jeux de société ?", a:"Le marché a progressé de près de 50 % en dix ans." },
        { q:"Quel besoin ce succès traduit-il selon les sociologues ?", a:"Le besoin de se retrouver ensemble, sans écrans, et de recréer du lien." },
        { q:"Quel paradoxe la chronique souligne-t-elle ?", a:"Beaucoup de ces jeux sont découverts grâce aux réseaux sociaux, c'est-à-dire aux écrans." } ] },
    { level:"C1", theme:"Travail", type:"Reportage", title:"La semaine de quatre jours à l'essai",
      text:"Dans cette entreprise nantaise de cent vingt salariés, on ne travaille plus le vendredi depuis un an. Le volume horaire, lui, n'a pas changé : les journées sont simplement plus longues. Le bilan, selon la direction, est encourageant. L'absentéisme a reculé et les candidatures spontanées ont doublé. Tous les salariés ne partagent cependant pas cet enthousiasme. Certains parents évoquent des journées épuisantes et des difficultés à récupérer leurs enfants à l'école. Les syndicats, eux, réclament une véritable réduction du temps de travail, et non une simple réorganisation de la semaine.",
      questions:[
        { q:"Le temps de travail total a-t-il diminué ? Justifiez.", a:"Non : le volume horaire est le même, les journées sont seulement plus longues." },
        { q:"Citez deux effets positifs relevés par la direction.", a:"Moins d'absentéisme et deux fois plus de candidatures spontanées." },
        { q:"Que reprochent les syndicats à ce dispositif ?", a:"Ce n'est qu'une réorganisation de la semaine, pas une vraie réduction du temps de travail." } ] },
    { level:"C1", theme:"Éducation", type:"Débat", title:"Le téléphone portable à l'école",
      text:"Faut-il bannir totalement le téléphone portable des établissements scolaires ? Pour ses partisans, l'interdiction améliore la concentration et réduit le harcèlement en ligne pendant la journée. Plusieurs collèges qui l'ont expérimentée observent des cours de récréation plus animées et des élèves qui se parlent davantage. Ses détracteurs rappellent toutefois que le téléphone peut être un outil pédagogique précieux, à condition d'en encadrer l'usage. Ils jugent surtout illusoire de vouloir protéger les adolescents en les privant d'un objet qu'ils retrouveront dès la sortie. Mieux vaudrait, selon eux, leur apprendre à s'en servir avec discernement.",
      questions:[
        { q:"Quels sont les deux bénéfices avancés par les partisans de l'interdiction ?", a:"Une meilleure concentration et moins de harcèlement en ligne pendant la journée." },
        { q:"Pourquoi les détracteurs jugent-ils l'interdiction « illusoire » ?", a:"Parce que les élèves retrouvent leur téléphone dès la sortie ; mieux vaut leur apprendre à bien l'utiliser." } ] },
    { level:"C2", theme:"Sciences", type:"Éditorial", title:"L'intelligence artificielle au chevet des patients",
      text:"Que l'intelligence artificielle soit capable de détecter certains cancers plus tôt que l'œil humain, nul ne le conteste plus. Encore faut-il s'interroger sur ce que cette prouesse fait à la relation de soin. Car un diagnostic n'est pas une simple donnée : il s'énonce, il s'explique, il s'accompagne. Déléguer à la machine l'analyse des images, soit ; lui abandonner la parole, certainement pas. Le risque n'est pas tant l'erreur algorithmique, que l'on peut corriger, que l'effacement progressif du médecin derrière l'écran. Quand bien même les performances de ces outils continueraient de progresser, la confiance du patient, elle, ne se programme pas.",
      questions:[
        { q:"Sur quel point l'auteur dit-il qu'il n'y a plus de débat ?", a:"L'IA peut détecter certains cancers plus tôt que l'œil humain." },
        { q:"Quelle distinction l'auteur fait-il entre ce qu'on peut confier à la machine et ce qu'on doit garder ?", a:"On peut lui confier l'analyse des images, mais pas l'annonce et l'explication du diagnostic au patient." },
        { q:"Quel est, selon lui, le principal risque ?", a:"Pas l'erreur de l'algorithme, mais la disparition progressive du médecin dans la relation de soin." } ] },
    { level:"C2", theme:"Culture", type:"Tribune", title:"Faut-il rendre les musées gratuits ?",
      text:"La gratuité des musées passe volontiers pour la condition même de la démocratisation culturelle. L'idée est généreuse ; elle n'en est pas moins discutable. Les expériences menées ces dernières décennies montrent en effet que la gratuité attire surtout… ceux qui venaient déjà. Le prix du billet est rarement le premier obstacle : c'est le sentiment de ne pas être à sa place qui retient les publics éloignés de la culture. Dès lors, supprimer le tarif sans repenser l'accueil, la médiation et les horaires reviendrait à mettre la charrue avant les bœufs. Si la gratuité a un sens, ce n'est qu'au sein d'une politique plus ambitieuse.",
      questions:[
        { q:"Quelle est la thèse de l'auteur sur la gratuité ?", a:"Elle est généreuse mais insuffisante : seule, elle ne démocratise pas la culture." },
        { q:"Quel est, selon lui, le vrai frein pour les publics éloignés ?", a:"Le sentiment de ne pas être à sa place, plus que le prix." },
        { q:"Que signifie ici « mettre la charrue avant les bœufs » ?", a:"Supprimer le prix avant d'avoir amélioré l'accueil, la médiation et les horaires : agir dans le mauvais ordre." } ] },
    { level:"C2", theme:"Langue", type:"Entretien", title:"Les langues régionales, un patrimoine en sursis",
      text:"Le breton, l'occitan ou l'alsacien ne sont plus guère transmis au sein des familles. Pour la linguiste interrogée, le processus est connu : une langue dominante s'impose d'abord par la pression sociale et économique, puis vient une génération bilingue, avant que la langue minoritaire ne soit plus parlée que par les anciens. Faut-il pour autant parler de fatalité ? Pas nécessairement. L'exemple des écoles immersives montre qu'une langue peut retrouver des locuteurs, pour peu qu'on lui offre un usage quotidien. Mais ces initiatives, rappelle-t-elle, restent fragiles, faute d'un véritable statut juridique.",
      questions:[
        { q:"Quelles sont les trois étapes de la disparition d'une langue décrites par la linguiste ?", a:"La pression d'une langue dominante, puis une génération bilingue, puis une langue parlée seulement par les anciens." },
        { q:"La linguiste est-elle pessimiste ? Justifiez.", a:"Pas totalement : les écoles immersives montrent qu'une langue peut regagner des locuteurs si elle est utilisée au quotidien." },
        { q:"Pourquoi ces initiatives restent-elles fragiles ?", a:"Parce que ces langues n'ont pas de véritable statut juridique." } ] },
    {"level": "C1", "theme": "Santé", "type": "Flash d'information", "title": "Le sommeil des adolescents en chute libre", "text": "Selon une étude publiée ce matin, les adolescents dorment en moyenne une heure de moins qu'il y a vingt ans. En cause, principalement, l'usage des écrans le soir : près de la moitié des collégiens interrogés reconnaissent consulter leur téléphone après minuit. Les conséquences sont loin d'être anodines : troubles de l'attention, irritabilité, baisse des résultats scolaires. Les chercheurs recommandent de ne plus utiliser d'écran une heure avant le coucher. Certains établissements envisagent même de décaler l'heure d'entrée en classe, une mesure déjà expérimentée avec succès aux États-Unis.", "questions": [{"q": "Quelle évolution l'étude met-elle en évidence ?", "a": "Les adolescents dorment une heure de moins en moyenne qu'il y a vingt ans."}, {"q": "Citez deux conséquences du manque de sommeil mentionnées.", "a": "Au choix : troubles de l'attention, irritabilité, baisse des résultats scolaires."}, {"q": "Quelle mesure certains établissements envisagent-ils ?", "a": "Décaler l'heure d'entrée en classe, comme aux États-Unis."}]},
    {"level": "C1", "theme": "Ville", "type": "Reportage", "title": "Le vélo à la conquête des villes", "text": "Il y a dix ans, on ne croisait que quelques cyclistes téméraires sur ces grands boulevards. Aujourd'hui, aux heures de pointe, les pistes cyclables sont saturées. La pandémie a joué un rôle d'accélérateur : de nombreuses pistes provisoires ont été pérennisées. Pour les commerçants, le bilan est plus contrasté. Certains se réjouissent d'une clientèle de proximité plus nombreuse ; d'autres déplorent la disparition des places de stationnement et une baisse de leur chiffre d'affaires. La mairie, elle, assume son choix et promet de nouveaux aménagements d'ici la fin du mandat.", "questions": [{"q": "Quel rôle la pandémie a-t-elle joué ?", "a": "Elle a accéléré le mouvement : des pistes provisoires sont devenues permanentes."}, {"q": "Pourquoi le bilan est-il « contrasté » pour les commerçants ?", "a": "Certains gagnent des clients de proximité, d'autres perdent du chiffre d'affaires à cause de la disparition des places de parking."}, {"q": "Quelle est la position de la mairie ?", "a": "Elle assume son choix et promet d'autres aménagements avant la fin du mandat."}]},
    {"level": "C1", "theme": "Consommation", "type": "Chronique", "title": "La seconde main, nouvelle norme ?", "text": "Acheter d'occasion n'a plus rien d'honteux. Vêtements, meubles, téléphones : le marché de la seconde main progresse trois fois plus vite que celui du neuf. Les plateformes en ligne y sont pour beaucoup, mais les motivations des acheteurs sont variées. Les uns cherchent avant tout à faire des économies, les autres à réduire leur impact environnemental. Paradoxe toutefois : certains spécialistes observent que la revente facile encourage… à acheter davantage. On achète un vêtement en sachant qu'on pourra le revendre, ce qui alimente, au bout du compte, la surconsommation que l'on prétendait combattre.", "questions": [{"q": "Quel chiffre illustre le succès de la seconde main ?", "a": "Ce marché progresse trois fois plus vite que celui du neuf."}, {"q": "Quelles sont les deux motivations principales des acheteurs ?", "a": "Faire des économies et réduire leur impact environnemental."}, {"q": "Expliquez le paradoxe soulevé par les spécialistes.", "a": "La facilité de revente pousse à acheter plus, ce qui entretient la surconsommation qu'on voulait éviter."}]},
    {"level": "C1", "theme": "Travail", "type": "Interview", "title": "Les jeunes et la quête de sens", "text": "Les jeunes diplômés seraient de moins en moins attirés par les grandes entreprises. Pour cette sociologue du travail, il ne faut pas y voir un rejet du travail en soi. Ce que recherchent ces jeunes, explique-t-elle, c'est une cohérence entre leurs valeurs et leur activité professionnelle. Le salaire reste important, mais il n'est plus le seul critère. L'utilité sociale, l'impact écologique de l'entreprise ou encore la possibilité de télétravailler pèsent désormais dans leurs choix. Elle met néanmoins en garde contre une vision trop homogène : cette quête de sens concerne surtout les jeunes les plus diplômés, qui ont le luxe de pouvoir choisir.", "questions": [{"q": "Selon la sociologue, les jeunes rejettent-ils le travail ? Justifiez.", "a": "Non : ils veulent une cohérence entre leurs valeurs et leur activité."}, {"q": "Citez deux critères qui comptent désormais en plus du salaire.", "a": "Au choix : l'utilité sociale, l'impact écologique de l'entreprise, la possibilité de télétravailler."}, {"q": "Quelle limite la sociologue apporte-t-elle à son analyse ?", "a": "Cette quête de sens concerne surtout les jeunes très diplômés, qui peuvent se permettre de choisir."}]},
    {"level": "C2", "theme": "Société", "type": "Éditorial", "title": "L'injonction au bonheur", "text": "Jamais sans doute une époque n'aura autant parlé de bonheur. Livres de développement personnel, applications de méditation, coachs en tous genres : le bien-être est devenu une industrie florissante. Il y aurait de quoi se réjouir, si cette profusion ne dissimulait une injonction pesante. Car à force de présenter le bonheur comme le fruit d'un effort individuel, on finit par rendre chacun responsable de son malheur. Le chômeur n'aurait pas assez « travaillé sur lui-même », le salarié épuisé manquerait de « résilience ». Ce faisant, on évacue commodément les causes collectives de la souffrance : conditions de travail, précarité, solitude. Le bonheur, décidément, n'est pas qu'une affaire privée.", "questions": [{"q": "Quels exemples l'auteur donne-t-il de « l'industrie » du bien-être ?", "a": "Les livres de développement personnel, les applications de méditation et les coachs."}, {"q": "Pourquoi parle-t-il d'une « injonction pesante » ?", "a": "Parce qu'en faisant du bonheur un effort individuel, on rend chacun responsable de son propre malheur."}, {"q": "Quelle est la thèse défendue dans la conclusion ?", "a": "Le bonheur dépend aussi de causes collectives (travail, précarité, solitude) : ce n'est pas qu'une affaire privée."}]},
    {"level": "C2", "theme": "Numérique", "type": "Conférence", "title": "Les algorithmes et le débat démocratique", "text": "On accuse volontiers les réseaux sociaux d'enfermer leurs utilisateurs dans des bulles où ne circulent que des opinions semblables. La réalité est plus subtile. Plusieurs travaux récents montrent que les internautes sont, en fait, exposés à des points de vue variés. Le problème tient moins à l'absence de contradiction qu'à la manière dont elle se présente. Les algorithmes privilégient les contenus qui suscitent des réactions fortes, si bien que l'on rencontre surtout la version la plus caricaturale du camp adverse. Loin de favoriser le dialogue, cette exposition polarise davantage. Autrement dit, ce n'est pas tant l'isolement qui menace le débat que la caricature.", "questions": [{"q": "Quelle idée reçue le conférencier remet-il en cause ?", "a": "L'idée que les réseaux sociaux enferment les utilisateurs dans des bulles d'opinions identiques."}, {"q": "Selon lui, quel est le véritable problème ?", "a": "Les algorithmes mettent en avant les contenus les plus extrêmes : on ne voit que la caricature du camp adverse."}, {"q": "Quelle conséquence cette exposition a-t-elle sur le débat ?", "a": "Elle accroît la polarisation au lieu de favoriser le dialogue."}]},
    {"level": "C2", "theme": "Environnement", "type": "Débat", "title": "Faut-il renoncer à l'avion ?", "text": "Pour les uns, renoncer à l'avion relève de la cohérence élémentaire : comment prétendre lutter contre le dérèglement climatique en multipliant les week-ends à l'autre bout de l'Europe ? Pour les autres, culpabiliser les voyageurs revient à se tromper de cible. Le transport aérien ne représenterait qu'une part modeste des émissions mondiales, et c'est d'abord l'industrie qu'il faudrait décarboner. Entre ces deux positions, une voie médiane se dessine : réserver l'avion aux trajets pour lesquels il n'existe pas d'alternative crédible, tout en investissant massivement dans le train de nuit. Encore faut-il que le prix du billet suive : aujourd'hui, le train reste souvent plus cher que l'avion.", "questions": [{"q": "Quel argument avancent les partisans du renoncement à l'avion ?", "a": "La cohérence : on ne peut pas prétendre lutter contre le réchauffement tout en prenant souvent l'avion."}, {"q": "Que répondent leurs opposants ?", "a": "Que l'aérien pèse peu dans les émissions mondiales et que c'est l'industrie qu'il faut décarboner en priorité."}, {"q": "Quelle condition est posée à la « voie médiane » ?", "a": "Que le train devienne moins cher, car il coûte encore souvent plus que l'avion."}]},
    {"level": "C1", "theme": "Sciences", "type": "Reportage", "title": "Faut-il encore tester sur les animaux ?", "text": "Dans ce laboratoire, les cages de souris ont été réduites de moitié en dix ans. La raison ? Les chercheurs disposent désormais de méthodes alternatives : cultures de cellules humaines, organes miniatures fabriqués en laboratoire, simulations informatiques. Les associations de défense des animaux y voient la preuve que l'expérimentation animale pourrait bientôt disparaître. Les scientifiques, eux, se montrent plus prudents. Pour tester l'effet d'un médicament sur un organisme entier, expliquent-ils, il n'existe pas encore de substitut fiable. La réglementation européenne impose d'ailleurs de remplacer, de réduire et d'améliorer l'usage des animaux chaque fois que c'est possible. Le débat n'est donc plus de savoir s'il faut en finir, mais à quel rythme.", "questions": [{"q": "Quelles méthodes alternatives sont citées ?", "a": "Les cultures de cellules humaines, les organes miniatures fabriqués en laboratoire et les simulations informatiques."}, {"q": "Pourquoi les scientifiques restent-ils prudents ?", "a": "Il n'existe pas encore de substitut fiable pour tester un médicament sur un organisme entier."}, {"q": "Comment le débat a-t-il évolué, selon la conclusion ?", "a": "On ne se demande plus s'il faut arrêter, mais à quel rythme le faire."}]},
    {"level": "C1", "theme": "Société", "type": "Chronique", "title": "Un robot pour veiller sur nos aînés ?", "text": "Il parle, rappelle l'heure des médicaments, détecte une chute et prévient la famille. Dans certaines maisons de retraite, de petits robots de compagnie font déjà partie du quotidien. Pour leurs promoteurs, ils répondent à un défi démographique : le nombre de personnes âgées dépendantes va fortement augmenter, alors que le personnel manque. Les résidents, souvent sceptiques au départ, finissent parfois par s'y attacher. Mais cette réussite apparente soulève une question dérangeante : ne risque-t-on pas de confier à des machines ce qui relève avant tout du lien humain ? Les soignants interrogés sont unanimes : le robot peut soulager, il ne doit jamais remplacer.", "questions": [{"q": "Citez deux fonctions de ces robots.", "a": "Au choix : rappeler l'heure des médicaments, détecter une chute, prévenir la famille, faire la conversation."}, {"q": "À quel « défi » répondent-ils selon leurs promoteurs ?", "a": "La hausse du nombre de personnes âgées dépendantes alors que le personnel manque."}, {"q": "Quelle est la position des soignants ?", "a": "Le robot peut aider à alléger leur travail, mais il ne doit jamais remplacer le contact humain."}]},
    {"level": "C1", "theme": "Éducation", "type": "Débat", "title": "Et si on supprimait les notes ?", "text": "Dans plusieurs écoles primaires, les notes chiffrées ont laissé place à des appréciations et à des couleurs : acquis, en cours d'acquisition, non acquis. Pour les enseignants qui ont tenté l'expérience, le climat de la classe s'est nettement apaisé. Les élèves en difficulté, qui collectionnaient les mauvaises notes, reprennent confiance. Les détracteurs de cette réforme dénoncent pourtant un nivellement par le bas. Selon eux, la note reste un repère clair pour les familles et prépare à la sélection qui attend les élèves au lycée. Entre ces deux camps, certains chercheurs rappellent que le problème n'est pas tant la note elle-même que l'usage qu'on en fait : classer les élèves plutôt que les aider à progresser.", "questions": [{"q": "Par quoi les notes ont-elles été remplacées dans ces écoles ?", "a": "Par des appréciations et des couleurs indiquant si une compétence est acquise, en cours ou non acquise."}, {"q": "Quel argument avancent les opposants ?", "a": "Ce serait un nivellement par le bas ; la note est un repère clair et prépare à la sélection future."}, {"q": "Quelle position intermédiaire les chercheurs défendent-ils ?", "a": "Le problème n'est pas la note mais son usage : elle sert à classer au lieu d'aider à progresser."}]},
    {"level": "C2", "theme": "Logement", "type": "Éditorial", "title": "Le mal-logement, angle mort du débat public", "text": "Ils ne dorment pas dans la rue, et c'est sans doute pour cela qu'on les oublie. Plusieurs millions de personnes vivent pourtant dans un logement trop petit, insalubre ou impossible à chauffer. Le mal-logement ne se voit pas : il se cache derrière des façades ordinaires, dans des appartements surpeuplés où les enfants font leurs devoirs sur un coin de lit. Ses conséquences, elles, sont bien réelles : maladies respiratoires, échec scolaire, épuisement. On objectera que l'État multiplie les aides. Encore faudrait-il qu'elles parviennent à ceux qui en ont besoin : faute d'information, nombre de ménages n'y recourent jamais. Tant que le logement sera traité comme une marchandise plutôt que comme un droit, les plans successifs ne seront que des pansements.", "questions": [{"q": "Pourquoi l'auteur parle-t-il d'un problème « qui ne se voit pas » ?", "a": "Parce que les mal-logés ne sont pas à la rue : ils vivent cachés dans des logements ordinaires mais inadaptés."}, {"q": "Quelles conséquences du mal-logement sont citées ?", "a": "Les maladies respiratoires, l'échec scolaire et l'épuisement."}, {"q": "Quelle objection l'auteur anticipe-t-il, et comment y répond-il ?", "a": "On dira que l'État aide déjà ; il répond que ces aides n'atteignent pas toujours les ménages, faute d'information."}, {"q": "Quelle est la thèse finale ?", "a": "Tant que le logement sera vu comme une marchandise et non comme un droit, les mesures resteront superficielles."}]}
  ],

(function(){ const order=["Concession","Opposition","Cause","Conséquence","Hypothèse","But","Comparaison","Temps","Restriction","Mise en relief","Modalisation","Exprimer son avis","Reformulation","Illustration","Chiffres & évolution","Jugement & sentiment","Proposer des solutions","Intensité & appréciation","Registres de langue","Subjonctif","Subjonctif imparfait","Négation soutenue","Pronoms relatifs","Participe & gérondif","Nominalisation","Cohésion","Discours rapporté","Introduire / conclure","Lettre formelle","Débat avec le jury"];
  const r=t=>{ const i=order.indexOf(t); return i<0?99:i; };
  DATA.structures = DATA.structures.map((s,i)=>[s,i]).sort((a,b)=>r(a[0].theme)-r(b[0].theme)||a[1]-b[1]).map(x=>x[0]); })();
const MORE = {"Avoir beau + infinitif": {"more": ["J'<b>ai beau</b> relire mes notes, je ne retiens rien.", "Les associations <b>ont beau</b> alerter, rien ne change."], "expl": "« Avoir beau » exprime un effort qui reste sans résultat. La principale est souvent juxtaposée, sans « mais ». Le verbe « avoir » porte le temps et la personne ; l'infinitif ne bouge pas."}, "Bien que / quoique + subjonctif": {"more": ["<b>Bien que</b> la loi <b>soit</b> claire, elle est peu appliquée.", "<b>Quoiqu'</b>il <b>ait</b> beaucoup travaillé, il a échoué."], "expl": "La concession admet un fait réel qui n'empêche pas l'autre. « Bien que » et « quoique » imposent le subjonctif, même quand le fait est certain. Avec le même sujet, on peut abréger : « bien que fatigué, il continue »."}, "Quel(le)(s) que soit / soient": {"more": ["<b>Quel que soit</b> le gouvernement, le problème demeure.", "<b>Quelles que soient</b> vos raisons, il faut respecter la règle."], "expl": "Signifie « peu importe le / la… ». « Quel » est un adjectif qui s'accorde avec le sujet de « être », placé après lui. Ne pas confondre avec « quelque… que » qui précède un nom ou un adjectif."}, "Si / aussi + adjectif + que + subjonctif": {"more": ["<b>Si</b> rapide <b>que soit</b> le progrès, il ne règle pas tout.", "<b>Aussi</b> surprenant <b>que</b> cela <b>paraisse</b>, les jeunes lisent davantage."], "expl": "La concession porte sur le degré d'une qualité : « même si c'est très… ». « Aussi surprenant que cela paraisse » est une formule figée très utile à l'oral."}, "Certes… il n'en reste pas moins que": {"more": ["<b>Certes</b>, les éoliennes défigurent le paysage ; <b>il n'en reste pas moins qu'</b>elles sont nécessaires.", "<b>Certes</b>, la réforme est imparfaite ; <b>il n'en demeure pas moins qu'</b>elle constitue un progrès."], "expl": "On concède d'abord un argument adverse, puis on affirme sa position. C'est le mouvement de base de tout paragraphe argumentatif nuancé, attendu au C1."}, "Toujours est-il que": {"more": ["On peut discuter des causes ; <b>toujours est-il que</b> les faits sont là.", "Je ne sais pas qui a raison ; <b>toujours est-il que</b> le projet est bloqué."], "expl": "Écarte une discussion secondaire pour revenir à un fait incontestable. Équivaut à « en tout cas, ce qui est sûr, c'est que »."}, "Pour autant": {"more": ["Il a obtenu son diplôme ; il n'a <b>pas pour autant</b> trouvé d'emploi.", "Le chômage baisse, sans que la précarité recule <b>pour autant</b>."], "expl": "« Pour autant » signifie « malgré cela, en conséquence de cela ». Il s'emploie presque toujours dans une phrase négative ou interrogative. Il nuance une conséquence attendue."}, "Même si + indicatif": {"more": ["<b>Même si</b> tu <b>as</b> raison, tu devrais t'excuser.", "<b>Même si</b> le chômage <b>baissait</b>, la précarité resterait forte."], "expl": "« Même si » se construit comme « si » : présent, imparfait ou plus-que-parfait. Jamais de subjonctif ni de conditionnel juste après. Avec l'imparfait, on obtient une concession hypothétique."}, "Malgré / en dépit de + nom": {"more": ["<b>Malgré</b> la pluie, le festival a eu lieu.", "<b>En dépit de</b> ses efforts, elle n'a pas été retenue."], "expl": "Concession suivie d'un nom. « En dépit de » est plus soutenu que « malgré ». Avec un verbe, utilisez « bien que » ou « malgré le fait que »."}, "Avoir beau… il n'empêche que": {"more": ["Il fait beau ; <b>n'empêche que</b> je reste à la maison.", "Les sondages sont bons ; <b>il n'empêche que</b> rien n'est joué."], "expl": "Signifie « malgré cela, cela n'empêche pas que ». Suivi de l'indicatif. Plus naturel à l'oral qu'à l'écrit soutenu."}, "Tout + adjectif / nom + que": {"more": ["<b>Tout</b> expérimentés <b>qu'</b>ils sont, ils ont commis une erreur.", "<b>Toute</b> riche <b>qu'</b>elle est, elle vit simplement."], "expl": "Concession qui insiste sur une qualité : « bien qu'ils soient expérimentés ». « Tout » varie seulement devant un adjectif féminin commençant par une consonne ou un « h » aspiré."}, "Quelque + adjectif + que": {"more": ["<b>Quelque</b> difficiles <b>que soient</b> les conditions, il faut agir.", "<b>Quelque</b> efforts <b>que</b> l'on <b>fasse</b>, le résultat est incertain."], "expl": "Devant un adjectif, « quelque » est invariable (= si). Devant un nom, il s'accorde (= quels que soient les… que). Registre très soutenu, valorisé au C2."}, "Où que / qui que / quoi que": {"more": ["<b>Où que</b> vous <b>alliez</b>, vous trouverez des francophones.", "<b>Qui que</b> vous <b>soyez</b>, vous avez des droits."], "expl": "Concession sur le lieu, la personne ou la chose : « peu importe où / qui / quoi ». Toujours suivi du subjonctif."}, "Il est vrai que… mais": {"more": ["<b>Il est vrai que</b> les écrans isolent, <b>mais</b> ils créent aussi du lien.", "<b>Il est vrai que</b> la mesure coûte cher ; <b>cependant</b>, elle rapportera à long terme."], "expl": "Formule pour reconnaître un argument avant de le dépasser. Variante soutenue de « c'est vrai que ». Varier le second connecteur : mais, cependant, néanmoins."}, "Pour + adjectif + que": {"more": ["<b>Pour</b> importante <b>qu'</b>elle <b>soit</b>, cette réforme ne suffira pas.", "<b>Pour</b> brillant <b>qu'</b>il <b>soit</b>, il manque d'expérience."], "expl": "Variante littéraire de « si… que ». Elle donne immédiatement un registre soutenu. À réserver à l'écrit ou à la conclusion d'un exposé."}, "Avoir beau à tous les temps": {"more": ["Tu <b>auras beau</b> insister, il ne changera pas d'avis.", "J'<b>avais beau</b> chercher, je ne trouvais pas la réponse."], "expl": "« Avoir beau » se conjugue à tous les temps : la concession suit le temps de la phrase. Le futur annonce l'inutilité d'un effort à venir."}, "Loin de + infinitif": {"more": ["<b>Loin de</b> s'améliorer, la situation empire.", "<b>Loin d'</b>être un frein, la réglementation stimule l'innovation."], "expl": "Exprime le contraire de ce qu'on attendait : « au lieu de… c'est l'inverse ». Très efficace pour réfuter une idée reçue en une phrase."}, "Autant… autant…": {"more": ["<b>Autant</b> j'apprécie l'auteur, <b>autant</b> ce roman me déçoit.", "<b>Autant</b> la ville est animée le jour, <b>autant</b> elle est déserte la nuit."], "expl": "Met deux idées en contraste équilibré. Les deux propositions doivent avoir la même structure. Pas de « que » entre les deux."}, "Alors que / tandis que": {"more": ["Les uns travaillent, <b>alors que</b> les autres profitent.", "Elle aime la ville, <b>tandis que</b> son frère préfère la campagne."], "expl": "« Alors que » oppose deux faits ; il peut aussi exprimer le temps. « Tandis que » insiste sur la simultanéité du contraste. Les deux prennent l'indicatif."}, "Au lieu de + infinitif": {"more": ["<b>Au lieu de</b> critiquer, proposez des solutions.", "<b>Au lieu de</b> baisser, les prix ont continué de grimper."], "expl": "Oppose ce qui se fait à ce qui devrait ou pourrait se faire. Le sujet de l'infinitif est celui de la principale."}, "Contrairement à": {"more": ["<b>Contrairement à</b> ce qu'on pense, le français n'est pas en déclin.", "<b>Contrairement à</b> son frère, elle adore les mathématiques."], "expl": "Introduit un contraste direct avec une personne ou une idée. Très utile en introduction pour casser une idée reçue."}, "À l'inverse / à l'opposé": {"more": ["Les villes s'agrandissent ; <b>à l'inverse</b>, les villages se vident.", "Le Nord investit ; <b>à l'opposé</b>, le Sud stagne."], "expl": "Connecteur qui oppose deux exemples ou deux tendances. Plus formel que « par contre », déconseillé à l'écrit soutenu."}, "Si… en revanche": {"more": ["<b>Si</b> la capitale attire, la province, <b>en revanche</b>, séduit les familles.", "<b>Si</b> le diagnostic est partagé, les solutions, <b>en revanche</b>, divergent."], "expl": "Le « si » n'est pas conditionnel : il signifie « s'il est vrai que ». La structure met en balance deux constats."}, "Tant… que…": {"more": ["L'IA bouleverse <b>tant</b> l'industrie <b>que</b> les services.", "Ce choix est discutable, <b>tant</b> sur le fond <b>que</b> sur la forme."], "expl": "Équivaut à « aussi bien… que ». Les deux éléments doivent être de même nature grammaticale."}, "Dans la mesure où": {"more": ["<b>Dans la mesure où</b> il a avoué, sa peine sera réduite.", "Je vous aiderai <b>dans la mesure où</b> je le pourrai."], "expl": "Deux sens : cause (« puisque ») ou proportion (« autant que »). Le contexte permet de choisir. Toujours l'indicatif."}, "Faute de + nom / infinitif": {"more": ["<b>Faute d'</b>avoir été prévenus, les habitants n'ont pas évacué.", "<b>Faute de</b> temps, la question n'a pas été abordée."], "expl": "Explique un échec par un manque. Pas d'article devant le nom. « Faute de quoi » signifie « sinon »."}, "D'autant (plus) que": {"more": ["Je suis <b>d'autant plus</b> content <b>que</b> je ne m'y attendais pas.", "Il faut agir vite, <b>d'autant que</b> les délais sont courts."], "expl": "Ajoute une raison qui renforce la précédente. « D'autant que » seul est un peu plus oral."}, "Sous prétexte que": {"more": ["Il a manqué la réunion <b>sous prétexte qu'</b>il était malade.", "<b>Sous prétexte de</b> moderniser, on supprime des services."], "expl": "L'énonciateur doute de la cause invoquée. Très utile pour montrer un esprit critique dans un essai."}, "Participe passé composé": {"more": ["<b>Ayant terminé</b> ses études, elle est partie à l'étranger.", "<b>N'ayant</b> pas <b>reçu</b> de réponse, il a relancé l'administration."], "expl": "Cause et antériorité en une structure compacte. Le sujet du participe doit être celui de la principale, sinon la phrase est fautive."}, "Puisque": {"more": ["<b>Puisque</b> tu insistes, je vais te le dire.", "<b>Puisque</b> personne ne s'y oppose, la décision est adoptée."], "expl": "Cause présentée comme connue ou évidente pour les deux interlocuteurs. Ne pas l'utiliser pour apporter une information nouvelle."}, "Étant donné que / vu que": {"more": ["<b>Étant donné que</b> la salle est petite, il faut réserver.", "<b>Vu que</b> personne ne répond, je rappellerai plus tard."], "expl": "Cause objective et constatable. « Étant donné » peut aussi précéder un nom : « étant donné les circonstances »."}, "Du fait de / en raison de": {"more": ["<b>Du fait de</b> son âge, il ne peut pas voter.", "Le match est reporté <b>en raison des</b> intempéries."], "expl": "Cause neutre, sans jugement positif ou négatif. Style écrit, administratif ou journalistique."}, "Grâce à / à cause de": {"more": ["<b>Grâce à</b> son aide, j'ai réussi.", "<b>À cause de</b> la neige, les routes sont fermées."], "expl": "« Grâce à » pour une cause au résultat positif, « à cause de » pour un résultat négatif. Faute fréquente : « grâce à la crise »."}, "Non que… mais": {"more": ["Je refuse, <b>non que</b> l'idée <b>soit</b> mauvaise, <b>mais</b> le moment est mal choisi.", "Il a démissionné, <b>non qu'</b>il <b>soit</b> malheureux, <b>mais</b> il veut changer de vie."], "expl": "Écarte une cause possible (au subjonctif) avant de donner la vraie (à l'indicatif). Marque de grande finesse argumentative."}, "Comme + cause en tête": {"more": ["<b>Comme</b> il pleuvait, nous sommes restés à l'intérieur.", "<b>Comme</b> le budget était épuisé, le projet a été reporté."], "expl": "« Comme » causal se place toujours en tête de phrase et présente la cause avant la conséquence. En milieu de phrase, préférez « parce que »."}, "À force de": {"more": ["<b>À force de</b> travail, elle a réussi.", "<b>À force de</b> répéter les mêmes erreurs, on finit par les corriger."], "expl": "Cause répétée ou intensive qui finit par produire un effet. Le résultat peut être positif ou négatif."}, "Tant (cause intensive)": {"more": ["Personne ne l'écoute, <b>tant</b> son discours est confus.", "Il est épuisé, <b>tant</b> il a travaillé."], "expl": "« Tant » placé après une proposition introduit une cause intensive. Équivaut à « tellement… que », mais en ordre inversé."}, "Si bien que": {"more": ["Il a beaucoup neigé, <b>si bien que</b> les écoles ont fermé.", "Le service s'est dégradé, <b>si bien que</b> les clients sont partis."], "expl": "Conséquence réelle et constatée, toujours à l'indicatif. Plus soutenu que « donc » ou « alors »."}, "D'où + nom": {"more": ["Les prix ont doublé, <b>d'où</b> la colère des consommateurs.", "Il manque d'expérience, <b>d'où</b> ses hésitations."], "expl": "Conséquence sous forme de nom, sans verbe. Très efficace pour condenser une idée dans la synthèse."}, "Au point de / au point que": {"more": ["Il était fatigué <b>au point de</b> s'endormir en réunion.", "Le bruit était fort <b>au point qu'</b>on ne s'entendait plus."], "expl": "Conséquence d'une intensité extrême. « Au point de » + infinitif si le sujet est le même."}, "Tellement / si … que": {"more": ["Le film était <b>si</b> long <b>que</b> j'ai failli partir.", "Il parle <b>tellement</b> vite <b>que</b> personne ne le comprend."], "expl": "Intensité (adjectif ou adverbe) qui entraîne une conséquence. « Tellement » est plus oral que « si »."}, "Tant de / tellement de … que": {"more": ["Il y avait <b>tant de</b> monde <b>que</b> nous avons renoncé.", "Elle a <b>tellement de</b> projets <b>qu'</b>elle manque de temps."], "expl": "Intensité portant sur une quantité (avec un nom). Ne pas oublier le « de »."}, "De sorte que + indicatif": {"more": ["Il a parlé fort, <b>de sorte que</b> tout le monde l'a entendu.", "Les règles ont changé, <b>de sorte que</b> beaucoup ont perdu leurs droits."], "expl": "Avec l'indicatif, la conséquence est réelle. Comparez avec le but : « parle fort de sorte qu'on t'entende » (subjonctif)."}, "C'est pourquoi / c'est la raison pour laquelle": {"more": ["Il pleuvait, <b>c'est pourquoi</b> je suis resté.", "La planète se réchauffe ; <b>c'est la raison pour laquelle</b> il faut agir."], "expl": "Introduit une conséquence en rappelant clairement la cause. « C'est la raison pour laquelle » est plus formel."}, "Aussi + inversion": {"more": ["Le texte est ambigu ; <b>aussi convient-il</b> de le préciser.", "Les candidats sont nombreux ; <b>aussi la sélection est-elle</b> sévère."], "expl": "« Aussi » en tête signifie « c'est pourquoi » et impose l'inversion du sujet. Avec un nom sujet, on garde le nom et on ajoute un pronom inversé."}, "Par voie de conséquence": {"more": ["L'usine a fermé ; <b>par voie de conséquence</b>, le chômage a augmenté.", "Le contrat est nul ; <b>par voie de conséquence</b>, aucun paiement n'est dû."], "expl": "Formule soutenue et logique, fréquente dans les textes administratifs et juridiques. Elle donne de la rigueur au raisonnement."}, "Assez / trop … pour que": {"more": ["Il fait <b>trop</b> froid <b>pour qu'</b>on <b>sorte</b>.", "Le sujet est <b>assez</b> important <b>pour qu'</b>on y <b>consacre</b> du temps."], "expl": "« Trop… pour que » : la conséquence ne se réalise pas. « Assez… pour que » : elle se réalise. Subjonctif obligatoire."}, "À supposer que / en admettant que": {"more": ["<b>À supposer qu'</b>il <b>vienne</b>, où dormira-t-il ?", "<b>En admettant que</b> vous <b>ayez</b> raison, que proposez-vous ?"], "expl": "Hypothèse envisagée pour la discussion, sans y croire forcément. Toujours le subjonctif."}, "Au cas où + conditionnel": {"more": ["Prends un parapluie <b>au cas où</b> il <b>pleuvrait</b>.", "<b>Au cas où</b> vous <b>auriez</b> des questions, contactez-nous."], "expl": "Prévoit une éventualité. Conditionnel obligatoire après « au cas où », jamais le subjonctif."}, "Pour peu que + subjonctif": {"more": ["<b>Pour peu qu'</b>on l'<b>encourage</b>, il fera des progrès.", "<b>Pour peu que</b> le temps le <b>permette</b>, nous partirons demain."], "expl": "« Il suffit que… un peu ». Condition minimale qui suffit à produire l'effet. Subjonctif."}, "Quand bien même + conditionnel": {"more": ["<b>Quand bien même</b> il <b>s'excuserait</b>, je ne lui pardonnerais pas.", "<b>Quand bien même</b> on <b>doublerait</b> le budget, le problème resterait."], "expl": "Hypothèse concessive : « même dans le cas où ». Conditionnel dans les deux propositions."}, "Inversion : dût-il": {"more": ["<b>Dût-elle</b> y passer la nuit, elle finira ce rapport.", "<b>Dussé-je</b> tout recommencer, je ne renoncerai pas."], "expl": "Subjonctif imparfait inversé de « devoir ». Équivaut à « même si je / elle devait ». Une seule utilisation bien placée impressionne le correcteur."}, "Si + plus-que-parfait": {"more": ["<b>Si</b> j'<b>avais su</b>, je ne <b>serais</b> pas <b>venu</b>.", "<b>Si</b> l'alerte <b>avait été</b> donnée, on <b>aurait évité</b> le drame."], "expl": "Hypothèse sur le passé, non réalisée (irréel du passé). Exprime le regret ou le reproche. Jamais de conditionnel après « si »."}, "Si + plus-que-parfait, conditionnel présent": {"more": ["<b>Si</b> tu <b>avais pris</b> le train, tu <b>serais</b> déjà là.", "<b>Si</b> l'État <b>avait investi</b>, nous <b>aurions</b> aujourd'hui de meilleures écoles."], "expl": "Condition dans le passé, conséquence visible dans le présent. Très utile pour analyser les effets d'une décision passée."}, "À condition que / pourvu que": {"more": ["Je viendrai <b>à condition que</b> tu m'<b>invites</b>.", "<b>Pourvu qu'</b>il <b>fasse</b> beau demain !"], "expl": "« À condition que » pose une condition nécessaire. « Pourvu que » exprime aussi un souhait, en début de phrase. Subjonctif."}, "À moins que (ne)": {"more": ["Je partirai demain, <b>à moins qu'</b>il ne <b>neige</b>.", "<b>À moins de</b> trouver un accord, la grève continuera."], "expl": "Signifie « sauf si ». Le « ne » explétif est facultatif mais soutenu. « À moins de » + infinitif si le sujet est le même."}, "En cas de + nom": {"more": ["<b>En cas d'</b>incendie, n'utilisez pas l'ascenseur.", "<b>En cas de</b> retard, prévenez l'accueil."], "expl": "Hypothèse sous forme de nom, très fréquente dans les consignes et textes officiels. Pas d'article."}, "Gérondif hypothétique": {"more": ["<b>En partant</b> plus tôt, tu <b>éviterais</b> les embouteillages.", "<b>En réduisant</b> la vitesse, on <b>sauverait</b> des vies."], "expl": "Le gérondif remplace « si on… ». Il rend la phrase plus fluide et évite les répétitions de « si »."}, "Sans + nom, + conditionnel passé": {"more": ["<b>Sans</b> ton aide, je n'y <b>serais</b> jamais <b>arrivé</b>.", "<b>Sans</b> internet, le télétravail <b>serait</b> impossible."], "expl": "Hypothèse implicite : « s'il n'y avait pas (eu) ». Avec le conditionnel présent, l'hypothèse porte sur le présent."}, "Que… ou que…": {"more": ["<b>Qu'</b>il <b>pleuve</b> ou <b>qu'</b>il <b>vente</b>, il court chaque matin.", "<b>Que</b> vous <b>soyez</b> d'accord ou non, la loi s'applique."], "expl": "Présente deux hypothèses dont le résultat est le même. Subjonctif obligatoire dans les deux."}, "Inversion hypothétique": {"more": ["<b>Serait-il</b> le meilleur candidat <b>qu'</b>il n'aurait aucune chance.", "<b>Viendrait-il</b> à s'excuser, rien ne serait réglé."], "expl": "Inversion littéraire qui remplace « même si ». Très rare à l'oral, à réserver à un écrit très soutenu."}, "Selon que… ou que": {"more": ["<b>Selon que</b> l'on vit en ville <b>ou</b> à la campagne, les besoins diffèrent.", "Le prix varie <b>selon qu'</b>on réserve tôt <b>ou</b> tard."], "expl": "Exprime une variation selon deux cas possibles. Indicatif. Remplace élégamment « en fonction de si »."}, "De peur que / de crainte que (ne)": {"more": ["Il a parlé bas <b>de peur qu'</b>on ne l'<b>entende</b>.", "Elle a pris des notes <b>de crainte d'</b>oublier."], "expl": "But négatif : on agit pour éviter quelque chose. « De peur de » + infinitif si le sujet est le même."}, "De sorte que + subjonctif": {"more": ["Organisez la salle <b>de sorte que</b> tout le monde <b>voie</b> l'écran.", "Il faut expliquer <b>de sorte que</b> chacun <b>comprenne</b>."], "expl": "Avec le subjonctif, « de sorte que » exprime un but. Avec l'indicatif, une conséquence : c'est le mode qui change le sens."}, "Pour que / afin que": {"more": ["Je t'écris <b>pour que</b> tu <b>saches</b> la vérité.", "Il faut voter <b>afin que</b> notre voix <b>soit</b> entendue."], "expl": "But avec un sujet différent : subjonctif. Même sujet : « pour / afin de » + infinitif. « Afin que » est plus soutenu."}, "En vue de": {"more": ["Elle prend des cours <b>en vue de</b> passer le DALF.", "Des négociations ont commencé <b>en vue d'</b>un accord."], "expl": "But planifié, souvent à long terme. Registre administratif."}, "Dans le but de / dans l'optique de": {"more": ["Il a déménagé <b>dans le but de</b> se rapprocher de sa famille.", "<b>Dans l'optique d'</b>une meilleure efficacité, l'équipe a été réorganisée."], "expl": "Varie l'expression du but. « Dans l'optique de » est plus moderne et professionnel."}, "De manière à / de façon à": {"more": ["Parlez lentement <b>de manière à</b> être compris.", "Il a tout planifié <b>de façon à</b> ne rien oublier."], "expl": "But atteint grâce à une manière d'agir. « De manière que / de façon que » + subjonctif si le sujet change."}, "Histoire de (oral)": {"more": ["Je l'ai appelé, <b>histoire de</b> prendre des nouvelles.", "On est sortis, <b>histoire de</b> se changer les idées."], "expl": "Tournure familière. Elle montre une bonne compréhension de l'oral, mais elle est à bannir de l'écrit et de l'exposé."}, "Plus… plus / moins… moins": {"more": ["<b>Plus</b> je le connais, <b>plus</b> je l'apprécie.", "<b>Moins</b> on dort, <b>moins</b> on est efficace."], "expl": "Proportion : les deux éléments évoluent ensemble. Pas d'article, pas de « que ». On peut aussi croiser : « plus… moins »."}, "D'autant plus… que": {"more": ["Ce succès est <b>d'autant plus</b> remarquable <b>qu'</b>il était inattendu.", "Elle est <b>d'autant moins</b> pressée <b>qu'</b>elle a le temps."], "expl": "Compare en expliquant : la qualité est renforcée par la cause qui suit. Structure très appréciée au C1."}, "De même que… de même": {"more": ["<b>De même que</b> le corps a besoin d'exercice, l'esprit a besoin de stimulation.", "<b>De même que</b> les villes, les campagnes souffrent de la crise."], "expl": "Établit un parallèle entre deux réalités. Idéal pour introduire une analogie dans un exposé."}, "Ainsi que / à l'instar de": {"more": ["<b>À l'instar de</b> nombreux pays, le Canada a légalisé le cannabis.", "Le maire, <b>ainsi que</b> ses adjoints, a voté contre."], "expl": "« À l'instar de » = à l'exemple de. Avec « ainsi que », le verbe s'accorde souvent avec le premier sujet."}, "Autant que je sache": {"more": ["<b>Autant que je sache</b>, la réunion est maintenue.", "<b>Pour autant que je sache</b>, aucune décision n'a été prise."], "expl": "Formule figée qui exprime la prudence : « d'après ce que je sais ». Elle n'est pas suivie de « que »."}, "Tel… tel": {"more": ["<b>Tel</b> maître, <b>tel</b> chien.", "<b>Telle</b> est la question qu'il faut se poser."], "expl": "« Tel » exprime l'identité ou la comparaison. « Tel est / Telle est » en tête de phrase est une tournure soutenue pour conclure."}, "Comme si + imparfait": {"more": ["Il se comporte <b>comme s'il était</b> le chef.", "Elle a continué <b>comme si de rien n'était</b>."], "expl": "Comparaison avec une situation imaginaire. Imparfait ou plus-que-parfait, jamais le conditionnel. « Comme si de rien n'était » est une expression figée."}, "Dès que / aussitôt que": {"more": ["<b>Dès que</b> tu <b>arriveras</b>, appelle-moi.", "<b>Aussitôt qu'</b>il <b>eut fini</b>, il partit."], "expl": "Postériorité immédiate. Au futur, le français garde le futur après « dès que », contrairement à l'anglais."}, "Avant que (ne) + subjonctif": {"more": ["Partons <b>avant qu'</b>il ne <b>pleuve</b>.", "Réfléchis <b>avant de</b> répondre."], "expl": "Le subjonctif est obligatoire après « avant que ». Même sujet : « avant de » + infinitif."}, "Après que + indicatif": {"more": ["<b>Après qu'</b>il <b>est parti</b>, la réunion a repris.", "<b>Après avoir lu</b> le rapport, elle a démissionné."], "expl": "La norme impose l'indicatif après « après que », car l'action est réelle. Même sujet
