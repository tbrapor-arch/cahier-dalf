<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cahier DALF C1·C2</title>
<meta name="description" content="Structures, vocabulaire, écoute et examen blanc pour préparer le DALF C1 et C2.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9c3cf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cahier DALF">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a French school notebook (Seyès ruling, red margin), one column, bottom tab bar */
:root{
  --paper:#f7f6f1; --sheet:#ffffff; --ink:#1b1d2a; --muted:#5d6072;
  --encre:#2a45b8; --encre-soft:#e6eafb; --marge:#c43a4c; --rule:#dfe3f2; --line:#e7e6df;
  --ok:#2c7a4b; --ok-soft:#e3f2e8; --warn:#a15c00;
  --f-display:"Young Serif",Georgia,serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11131b; --sheet:#181b26; --ink:#eceef6; --muted:#9a9eb3;
  --encre:#8ea2ff; --encre-soft:#232a4a; --marge:#ff7b8c; --rule:#252a3d; --line:#272a36;
  --ok:#6fd39a; --ok-soft:#1b3326; --warn:#f0b35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11131b; --sheet:#181b26; --ink:#eceef6; --muted:#9a9eb3;
  --encre:#8ea2ff; --encre-soft:#232a4a; --marge:#ff7b8c; --rule:#252a3d; --line:#272a36;
  --ok:#6fd39a; --ok-soft:#1b3326; --warn:#f0b35a; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 110px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:400 1.75rem/1.1 var(--f-display);margin:0;text-wrap:balance}
h1 span{color:var(--encre)}
.lvl{display:flex;gap:4px}
.lvl button{font:500 .75rem var(--f-mono);letter-spacing:.06em;border:1px solid var(--rule);background:var(--sheet);color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.lvl button[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:var(--sheet)}
.intro{color:var(--muted);margin:6px 0 18px;max-width:60ch}

h2{font:400 1.25rem var(--f-display);margin:26px 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.eyebrow{font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Seyès sheet: the one bold device */
.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:6px;
  padding:16px 16px 16px 30px;
  background-image:linear-gradient(var(--sheet),var(--sheet)),repeating-linear-gradient(to bottom,transparent 0 23px,var(--rule) 23px 24px);
  background-size:0 0,100% 100%}
.sheet::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1.5px;background:var(--marge);opacity:.55}
.stack{display:grid;gap:12px}

.chip{display:inline-block;font:500 .68rem var(--f-mono);letter-spacing:.06em;padding:2px 7px;border-radius:4px;background:var(--encre-soft);color:var(--encre)}
.chip.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

/* Structures */
.pattern{font:500 .95rem var(--f-mono);color:var(--encre);margin:4px 0 8px;overflow-wrap:anywhere}
.example{font-style:italic;margin:0}
.example b{font-style:normal;color:var(--encre)}
.note{color:var(--muted);font-size:.88rem;margin:8px 0 0}

/* Vocab flashcard */
.card{min-height:200px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:left}
.card .word{font:400 1.7rem/1.2 var(--f-display);margin:4px 0}
.card .hint{color:var(--muted);font-size:.85rem}
.counter{font:500 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:700 .92rem var(--f-body);padding:10px 16px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--encre);border-color:var(--encre);color:var(--sheet)}
.btn.good{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn:focus-visible,.lvl button:focus-visible,.tabs button:focus-visible,.card:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;flex:1;min-width:80px}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* Écoute */
.player{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--encre);color:var(--sheet);cursor:pointer;display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px;fill:currentColor}
.speed{font:500 .78rem var(--f-mono)}
.transcript{margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px}
details summary{cursor:pointer;color:var(--encre);font-weight:700;font-size:.9rem}
.links{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;color:var(--ink);text-decoration:none}
.links a span{color:var(--muted);font-size:.85rem}
.links a:hover{border-color:var(--encre)}
.links small{display:block;color:var(--muted)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{border:0;background:none;color:var(--muted);font:700 .78rem var(--f-body);padding:10px 4px 12px;display:grid;justify-items:center;gap:3px;cursor:pointer}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabs button[aria-selected="true"]{color:var(--encre)}
.empty{color:var(--muted);font-style:italic}
.clist{background:var(--sheet);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cgroup{margin:0;padding:12px 14px 6px;background:var(--paper);border-bottom:1px solid var(--line)}
.crow{border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow summary{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer;list-style:none}
.crow summary::-webkit-details-marker{display:none}
.crow summary::after{content:"+";margin-left:auto;color:var(--muted);font:500 1rem var(--f-mono)}
.crow[open] summary::after{content:"–"}
.crow[open] summary{background:var(--encre-soft)}
.crow summary:focus-visible{outline:2px solid var(--encre);outline-offset:-2px}
.cname{flex:0 1 auto;min-width:0;font-weight:700}
.cbody{padding:4px 14px 14px 14px}
.kar{line-height:1.75}
.kar .w{cursor:pointer;border-radius:3px;transition:background .15s,color .15s}
.kar .w.read{color:var(--muted)}
.kar .w.cur{background:var(--encre);color:var(--sheet);box-shadow:0 0 0 2px var(--encre)}
.play.on{background:var(--marge)}
.method{background:var(--sheet);border:1px solid var(--line);border-radius:6px}
.method summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 14px;cursor:pointer}
.method summary b{font:400 1.1rem var(--f-display)}
.method[open] summary{border-bottom:1px solid var(--line)}
.mbody{padding:12px 14px 14px}
.mstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;margin-bottom:10px}
.mnum{width:24px;height:24px;border-radius:50%;background:var(--encre);color:var(--sheet);display:grid;place-items:center;font:500 .8rem var(--f-mono)}
.mstep ul{margin:4px 0 0;padding-left:18px;display:grid;gap:4px}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start}
.types{margin:0;display:grid;gap:8px}
.types dt{font-weight:700}
.types dd{margin:0;color:var(--muted);font-size:.92rem}
.subtabs{display:flex;background:var(--rule);border-radius:10px;padding:3px;margin:0 0 16px;gap:2px}
.subtabs button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font:700 .85rem var(--f-body);color:var(--muted);cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.subtabs button:focus-visible{outline:2px solid var(--encre);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stats>div{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.stats b{font:400 1.4rem var(--f-display);font-variant-numeric:tabular-nums}
.tcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tcard{display:grid;gap:4px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);cursor:pointer;font:inherit}
.tcard:hover{border-color:var(--encre)}
.tcard:focus-visible,.stile:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.tcard b{font:400 1.05rem var(--f-display)}
.tcard small{color:var(--muted);font-size:.8rem}
.tcard .progress{min-width:0;margin-top:4px}
.ico{width:22px;height:22px;stroke:var(--encre);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sl-title{display:flex;align-items:center;gap:8px;font:400 1.25rem var(--f-display);margin:0 0 4px}
.stiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stile{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);font:400 1.05rem var(--f-display);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.stile small{font:500 .62rem var(--f-mono);margin-top:2px}
.stile.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.stile.go{background:var(--encre-soft);border-color:var(--encre);color:var(--encre)}
.runhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 8px}
.runhead .more-link{margin:0}
.player2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}
.stopb{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.stopb svg{width:14px;height:14px;fill:currentColor}
.wbox{width:100%;box-sizing:border-box;font:16px/1.6 var(--f-body);padding:10px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);resize:vertical}
.eprow{background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.eprow summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.eprow summary b{font:400 1.02rem var(--f-display)}
.eprow[open] summary{border-bottom:1px solid var(--line)}
.epbody{padding:12px 14px 14px}
.miss{margin:0;padding-left:18px;display:grid;gap:8px}
.lq{padding-left:20px;margin:10px 0 0;display:grid;gap:8px}
.btn.mk{padding:5px 10px;font-size:.82rem}
.btn.mk.good{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.mk.bad{border-color:var(--marge);color:var(--marge)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.itoggle,.ltoggle{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.itoggle button,.ltoggle button{border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.itoggle button{width:34px;height:30px}
.itoggle svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.ltoggle button{height:30px;padding:0 9px;font:500 .72rem var(--f-mono);letter-spacing:.04em}
.itoggle button[aria-pressed="true"],.ltoggle button[aria-pressed="true"]{background:var(--encre-soft);color:var(--encre)}
.itoggle button+button,.ltoggle button+button{border-left:1px solid var(--rule)}
.itoggle button:focus-visible,.ltoggle button:focus-visible{outline:2px solid var(--encre);outline-offset:-2px}
.chip-btn{border:0;cursor:pointer;font:500 .68rem var(--f-mono);letter-spacing:.06em}
.chip-btn span{margin-left:2px}
.chip-btn:focus-visible,.more-link:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.more-link{display:block;margin-top:10px;padding:0;border:0;background:none;color:var(--encre);font:700 .88rem var(--f-body);cursor:pointer}
.more{margin-top:10px;padding:12px 14px;border-radius:6px;background:var(--encre-soft)}
.more-ex{margin:0;padding-left:18px;display:grid;gap:6px}
.more-ex b{font-style:normal;color:var(--encre)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vtile{display:grid;gap:6px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);cursor:pointer;font:inherit}
.vtile:hover{border-color:var(--encre)}
.vtile:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.vtile b{font:400 1rem/1.2 var(--f-display)}
.vtile.all{grid-column:1/-1;background:var(--encre-soft);border-color:transparent}
.vtile .progress{min-width:0}
.star{color:var(--marge);font-size:.95rem;line-height:1}
.qprompt{font-size:1.1rem;line-height:1.5;margin:6px 0 14px}
.qprompt .qword{font:400 1.6rem var(--f-display)}
.gap{display:inline-block;min-width:4em;border-bottom:2px solid var(--encre);color:var(--encre);text-align:center}
.qopt{font:16px/1.4 var(--f-body);text-align:left;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);cursor:pointer}
.qopt:hover:not([disabled]){border-color:var(--encre)}
.qopt:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.qopt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.qopt.wrong{border-color:var(--marge);text-decoration:line-through;text-decoration-color:var(--marge)}
.qopt[disabled]{cursor:default}
.trap{margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--marge);background:var(--encre-soft);border-radius:4px;font-size:.92rem}
.filter{display:grid;gap:4px;margin-bottom:12px;min-width:0}
.filter select{font:16px var(--f-body);padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);max-width:100%}
/* Examen */
.epreuves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ep{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px}
.ep b{display:block;font:400 1rem var(--f-display)}
.ep .pts{font:500 .8rem var(--f-mono);color:var(--encre);font-variant-numeric:tabular-nums}
.ep p{margin:4px 0 0;color:var(--muted);font-size:.85rem}
.q{margin:14px 0 0}
.q legend{font-weight:700;margin-bottom:6px}
.q label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;margin-top:6px;cursor:pointer;background:var(--sheet)}
.q label.right{border-color:var(--ok);background:var(--ok-soft)}
.q label.wrong{border-color:var(--marge)}
.q fieldset{border:0;padding:0;margin:0}
.score{font:500 .95rem var(--f-mono);color:var(--ok)}
.rule-note{border-left:3px solid var(--encre);padding:4px 0 4px 12px;color:var(--muted);font-size:.9rem;margin:12px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Cahier <span>DALF</span></h1>
    <div class="lvl" role="group" aria-label="Niveau">
      <button id="lvl-all" data-l="all" aria-pressed="true">C1·C2</button>
      <button id="lvl-c1" data-l="C1" aria-pressed="false">C1</button>
      <button id="lvl-c2" data-l="C2" aria-pressed="false">C2</button>
    </div>
  </header>
  <p class="intro">Structures, vocabulaire et écoute pour passer du B2 au DALF C1·C2.</p>

  <main id="view"></main>
</div>

  <button id="tab-examen" role="tab" data-t="examen" aria-selected="false">
